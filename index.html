<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Finanzas personales: movimientos, patrimonio e inversiones en ARS y USD.">
<meta name="theme-color" content="#0F5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0F5132; --green-med:#198754; --green-bg:#0F513214; --green-line:#0F513230;
  --danger:#C53030; --danger-bg:rgba(197,48,48,.12);
  --warn:#B45309; --warn-bg:rgba(245,158,11,.14); --warn-line:rgba(245,158,11,.55);
  --blue:#2563eb;
  --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.num{font-family:'DM Mono','SFMono-Regular',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* Topbar */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.5px;line-height:1.1}
.brand span{color:var(--green)}
.brand small{display:block;font-size:11px;color:var(--faint);font-weight:400;letter-spacing:0;margin-top:2px}
.brand small .ver{color:var(--muted);background:#f1f5f9;border-radius:6px;padding:1px 5px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px}
.brand small .ver.alerta{background:var(--danger-bg);color:var(--danger);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.curtoggle{display:inline-flex;background:#f1f5f9;border:1px solid var(--line);border-radius:20px;padding:2px}
.curtoggle button{border:none;background:none;padding:5px 11px;border-radius:18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.curtoggle button.on{background:var(--green);color:#fff}
.mepchip{font-size:11px;background:#f1f5f9;border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.mepchip:hover{border-color:#cbd5e1}
.mepchip.manual{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}

/* Layout */
.shell{max-width:1100px;margin:0 auto;display:flex;gap:0}
.sidenav{display:none}
.content{flex:1;min-width:0;padding:18px 20px 100px}
@media(min-width:860px){
  .sidenav{display:flex;flex-direction:column;gap:4px;width:210px;padding:20px 12px;position:sticky;top:59px;height:calc(100vh - 59px)}
  .sidenav button{display:flex;align-items:center;gap:11px;padding:11px 14px;border:none;background:none;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;width:100%}
  .sidenav button .ic{font-size:18px}
  .sidenav button.on{background:var(--green-bg);color:var(--green);font-weight:600}
  .content{padding:22px 26px 40px}
}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:40}
.bottomnav-in{max-width:600px;margin:0 auto;width:100%;display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10px;font-weight:500}
.bottomnav button .ic{font-size:19px;line-height:1}
.bottomnav button.on{color:var(--green)}
@media(min-width:860px){ .bottomnav{display:none} }

/* Piezas */
h2.tab-title{font-size:19px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card + .card{margin-top:12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.card h3{margin:0;font-size:15px}
.card .hint{font-size:12px;color:var(--faint);margin:4px 0 12px;line-height:1.5}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;background:#f1f5f9;color:var(--muted);font-weight:500;white-space:nowrap;display:inline-block}
.tag.ok{background:rgba(25,135,84,.12);color:var(--green-med)}
.tag.usd{background:rgba(37,99,235,.12);color:var(--blue)}
.tag.off{background:var(--danger-bg);color:var(--danger)}

.btn{border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;padding:11px 16px}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:#f1f5f9;color:var(--ink)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 5px}
input.f,select.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
input.f:focus,select.f:focus{outline:none;border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;margin:14px 0 2px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}

/* Lista de cuentas */
.acc{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #f1f5f9}
.acc:last-child{border-bottom:none}
.acc .ico{width:36px;height:36px;border-radius:10px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.acc .info{flex:1;min-width:0}
.acc .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
.acc .amt{text-align:right;white-space:nowrap}
.acc .amt .n{font-weight:600;font-size:14px}
.acc .amt .sub{font-size:10.5px;color:var(--faint);margin-top:3px}
.acc .acts{display:flex;gap:2px;flex-shrink:0}
.acc .acts button{border:none;background:none;cursor:pointer;font-size:15px;padding:6px;border-radius:7px;color:var(--muted);line-height:1}
.acc .acts button:hover{background:#f1f5f9}

.empty{text-align:center;padding:34px 18px;color:var(--faint)}
.empty .big{font-size:30px;margin-bottom:10px}
.empty .t{font-weight:600;color:var(--muted);font-size:14px;margin-bottom:5px}
.empty .s{font-size:12.5px;line-height:1.55;max-width:340px;margin:0 auto}

.status{font-size:12.5px;padding:9px 12px;border-radius:9px;background:#f1f5f9;color:var(--muted);margin-top:12px;line-height:1.5}
.status.ok{background:rgba(25,135,84,.1);color:var(--green-med)}
.status.err{background:var(--danger-bg);color:var(--danger)}

.mepbox{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mepbox .v{font-size:24px;font-weight:700}
.mepbox .src{font-size:12px;color:var(--faint)}

/* Movimientos */
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-bottom:10px}
.mesnav .m{font-weight:600;font-size:14px;text-transform:capitalize}
.mesnav button{border:none;background:#f1f5f9;color:var(--ink);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
.mesnav button.hoy{width:auto;padding:0 11px;height:30px;font-size:12px;font-weight:600;color:var(--muted)}
.mesnav button:disabled{opacity:.4;cursor:default}

.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tot .b{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;min-width:0}
.tot .lbl{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tot .v{font-weight:700;font-size:15px;margin-top:3px;font-family:'DM Mono',ui-monospace,monospace;overflow-wrap:anywhere}
.tot .v.pos{color:var(--green-med)}
.tot .v.neg{color:var(--danger)}
.tot .v .u{display:block;font-size:11.5px;font-weight:500;color:var(--faint);margin-top:2px}
@media(max-width:420px){ .tot{gap:6px} .tot .b{padding:8px 9px} .tot .v{font-size:13px} .tot .v .u{font-size:10.5px} }

.avisocot{font-size:12px;color:var(--danger);background:var(--danger-bg);border-radius:9px;padding:8px 11px;margin-bottom:10px;line-height:1.5}

/* Resumen */
.hero{background:var(--green-bg);border:1px solid var(--green-line);border-radius:var(--radius);padding:15px 17px;margin-bottom:12px}
.hero .lbl{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.75}
.hero .v{font-size:27px;font-weight:700;line-height:1.15;margin-top:4px;font-family:'DM Mono',ui-monospace,monospace;overflow-wrap:anywhere}
.hero .u{font-size:12px;color:var(--muted);margin-top:3px}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.bar .bl{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:5px}
.bar .bl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar .bl .pct{color:var(--faint);font-size:11.5px;flex-shrink:0}
.bar .bl .val{font-weight:600;font-size:12.5px;flex-shrink:0}
.track{height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;min-width:2px}

.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.pill.on{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:600}
.filtros select,.filtros input{padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--card);color:var(--ink)}
.filtros input{flex:1;min-width:150px}

.diahdr{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 7px}
.mov{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit}
.mov:hover{border-color:#cbd5e1}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.mov .info{flex:1;min-width:0}
.mov .cpt{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
.mov .amt{text-align:right;white-space:nowrap;flex-shrink:0}
.mov .amt .n{font-weight:700;font-size:15px}
.mov .amt .n.pos{color:var(--green-med)}
.mov .amt .n.neg{color:var(--danger)}
.mov .amt .n.int{color:var(--muted)}
.mov .amt .sub{font-size:10.5px;color:var(--faint);margin-top:3px}

.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:25px;cursor:pointer;box-shadow:0 6px 18px rgba(15,81,50,.35);z-index:45;line-height:1}
@media(min-width:860px){.fab{bottom:26px;right:26px}}

/* Selector de tipo de movimiento */
.seg{display:flex;gap:6px;margin:4px 0 2px}
.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.inputmon{position:relative}
.inputmon .sim{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);font-weight:600;pointer-events:none}
.inputmon input{padding-left:42px}
.tcinfo{font-size:12px;color:var(--muted);background:#f1f5f9;border-radius:9px;padding:8px 11px;margin-top:8px;line-height:1.5}

/* Items de lista en Ajustes (categorías, modos de pago) */
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f1f5f9}
.item:last-child{border-bottom:none}
.item .nm{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:2px;flex-shrink:0}
.item .acts button{border:none;background:none;cursor:pointer;font-size:14px;padding:6px;border-radius:7px;color:var(--muted);line-height:1}
.item .acts button:hover{background:#f1f5f9}
.swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:#fff;color:var(--ink)}

/* Importación */
.modal.wide{max-width:940px}

/* Preview de importación: ocupa casi toda la pantalla, con la tabla scrolleando
   adentro y el botón de confirmar siempre visible abajo. */
.modal.imp{width:min(1500px,96vw);max-width:none;height:92vh;max-height:92vh;display:flex;flex-direction:column;padding:16px 0 0}
/* La cabecera no scrollea: las solapas y el header de la tabla quedan siempre a la vista */
.modal.imp > .impHead{padding:0 18px;flex-shrink:0}
/* El modo tarjeta no tiene solapas que fijar: ahí la cabecera sí puede scrollear */
.modal.imp > .impHead.scroll{overflow:auto;max-height:42vh}
.modal.imp > .impTabla{flex:1;min-height:0;min-width:0;display:flex;padding:0 18px}
.modal.imp > .impTabla > .tblwrap{min-width:0;flex:1}
.modal.imp > .impTabla > .intWrap{min-width:0;flex:1;overflow:auto;padding:2px 2px 8px}
.modal.imp > .impPie{flex-shrink:0;border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:var(--card)}
.modal.imp .tblwrap{max-height:none;height:100%;width:100%;margin-top:0}
.modal.imp .btn-row{margin-top:8px}
/* Con el modal ancho la tabla entra sin scroll: el concepto se queda con el resto */
.modal.imp .tbl th,.modal.imp .tbl td{white-space:nowrap;width:1%}
.modal.imp .tbl th.flex,.modal.imp .tbl td.flex{white-space:normal;width:100%;min-width:220px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;background:#f8fafc}
.drop.over{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.drop .big{font-size:26px;display:block;margin-bottom:6px}
.tblwrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:46vh;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--card);text-align:left;color:var(--faint);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:6px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr.dup td{opacity:.45}
.tbl tr.matchea td{background:#0F51320d}
.tbl input[type=date]{padding:4px 6px;border:1px solid var(--line);border-radius:7px;font-size:11.5px;background:#fff;color:var(--ink);font-family:'DM Mono',ui-monospace,monospace}
.tbl tr.reglaEd td{background:var(--green-bg);border-bottom:1px solid var(--green-line)}
.tbl tr.conError td{background:var(--danger-bg)}
/* Sin categoría todavía: el select se pinta en ámbar para que salte a la vista
   al revisar el resumen. No es un error (se importa igual), es un pendiente. */
.tbl select.sinCat{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn);font-weight:600}
.tbl select{max-width:170px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff;color:var(--ink)}
.reglaform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:4px 0}
.reglaform label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.reglaform input,.reglaform select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;color:var(--ink);font-weight:400;text-transform:none;letter-spacing:0}
.reglaform input[type=text]{min-width:150px}
.reglaform .rinfo{font-size:11.5px;color:var(--green);font-weight:600;padding-bottom:6px}
.reglaform .rinfo.vacio{color:var(--danger)}

/* Cabecera compacta del importador: todo lo de arriba en una o dos líneas */
.impLinea{font-size:11.5px;color:var(--muted);margin:2px 0 6px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.impLinea .ok{color:var(--green-med);font-weight:600}
.impLinea .mal{color:var(--danger);font-weight:600}

/* Cuentas detectadas: bloque colapsable, se cierra solo cuando está todo asignado */
.mapBox{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;overflow:hidden}
.mapBox > .cab{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:#f8fafc;border:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left}
.mapBox > .cab .chev{margin-left:auto;color:var(--faint);font-size:11px;transition:transform .15s}
.mapBox.abierto > .cab .chev{transform:rotate(90deg)}
.mapBox > .cab .falta{color:var(--danger);font-weight:700}
.mapBox > .cab .listo{color:var(--green-med);font-weight:600}

/* Mapeo de cuentas detectadas: dos columnas en desktop, una fila por cuenta */
.mapeo{display:grid;grid-template-columns:1fr;gap:0 18px;padding:4px 10px 7px;max-height:30vh;overflow:auto}
@media(min-width:900px){ .mapeo{grid-template-columns:1fr 1fr} }
.mapeo .item{flex-wrap:wrap;gap:7px;padding:4px 0;border-bottom:none;min-height:30px}
.mapeo .item .nm{font-size:12.5px}
.mapeo .item select{flex:1 1 130px;min-width:0;max-width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff;color:var(--ink)}
.mapeo .item .btn.xs{padding:4px 8px;font-size:11px;border-radius:7px;flex-shrink:0;white-space:nowrap}
@media(max-width:560px){ .mapeo .item .nm{flex:1 1 100%} }
.impSolapas{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:2px 0 10px;margin:0}
/* En mobile las solapas van en una sola fila que scrollea: si envuelven se comen la tabla */
@media(max-width:640px){
  .impSolapas{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .impSolapas .pill{flex-shrink:0}
  .mapeo{max-height:22vh}
}

/* Marcar dos patas de una compra/venta de dólares para unirlas en un solo interno */
.mepBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--green-bg);border:1px solid var(--green-line);border-radius:10px;padding:7px 11px;margin:0 0 8px}
.mepBar .txt{flex:1;min-width:160px;font-size:12px;color:var(--ink)}
.mepBar .mal{color:var(--danger);font-weight:600}
.btnUnir{border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;line-height:1;padding:4px 7px;color:var(--faint)}
.btnUnir.on{border-color:var(--blue);background:rgba(37,99,235,.12);color:var(--blue)}
.tbl tr.unirSel td{background:rgba(37,99,235,.09)}

/* Internos: una tarjeta de dos lados en vez de una fila de tabla */
.intList{display:flex;flex-direction:column;gap:8px}
.intCard{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--card)}
.intCard.conError{border-color:var(--danger);background:var(--danger-bg)}

.intCard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}

.intCard .pata .mto{font-family:'DM Mono',ui-monospace,monospace;font-size:13px;font-weight:600;margin-top:5px}
.intCard .pata .mto.sale{color:var(--danger)}
.intCard .pata .mto.entra{color:var(--green-med)}
.intCard .flecha{font-size:18px;color:var(--faint);flex-shrink:0}

.intCard .pie.vacio{color:var(--danger)}

/* Modal */

<script>
/* ══════════════════════ CONSTANTES ══════════════════════ */

/* Sets iniciales opcionales (botón "Cargar sugeridas") */

/* Brokers que siempre aparecen en el desplegable, además de los ya usados. */
const BROKERS_SUGERIDOS = ["Balanz", "PPI"];

/* ══════════════════════ ESTADO ══════════════════════ */
const state = {
  url:      localStorage.getItem("mf_url") || "",
  token:    localStorage.getItem("mf_token") || "",       // token compartido del backend
  cur:      localStorage.getItem("mf_cur") || "ARS",          // ARS | USD | ambas
  mep:      JSON.parse(localStorage.getItem("mf_mep") || "null"), // {compra,venta,fecha,fuente,manual}
  tab:      localStorage.getItem("mf_tab") || "resumen",
  cuentas:  [],
  categorias: [],
  modosPago:  [],
  movimientos: [],
  inversiones: [],
  reglas:     [],
  mes:      "",                                               // "YYYY-MM" que se está mirando
  grafico:  "Egreso",                                         // qué muestra el gráfico del Resumen
  lente:    localStorage.getItem("mf_lente") || "resumen",    // resumen | consumo (ver mesLente)
  filtroBroker: "",                                           // filtro de la pantalla Inversiones
  filtros:  {tipo:"todos", cuenta:"", categoria:"", texto:""},
  config:   {},
  backendVersion: "",                                         // la que publica el Apps Script
  conectado: false,
  cargando:  false,
  error:     ""
};

/* ══════════════════════ HELPERS ══════════════════════ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* Números y montos — es-AR, con símbolo por moneda */
function nf(n, dec){
  const v = Math.abs(+n || 0);
  const d = dec != null ? dec : (Number.isInteger(v) ? 0 : 2);
  return v.toLocaleString("es-AR", {minimumFractionDigits:d, maximumFractionDigits:d});
}
const simbolo = mon => (mon === "USD" ? "u$s " : "$");
function fmt(monto, moneda, dec){
  const n = +monto || 0;
  return (n < 0 ? "−" : "") + simbolo(moneda) + nf(n, dec);
}

/* Fechas — internamente ISO YYYY-MM-DD, se muestran DD/MM/YYYY */
function todayIso(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/* Sello de tiempo local, sólo como respaldo: el que vale lo pone el backend. */
function ahoraLocal(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return todayIso() + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function isoDate(v){
  if(!v) return "";
  if(v instanceof Date && !isNaN(v)){
    return v.getFullYear() + "-" + String(v.getMonth()+1).padStart(2,"0") + "-" + String(v.getDate()).padStart(2,"0");
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);          // ISO o ISO+hora (serializado por Sheets)
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);        // DD/MM/YYYY
  if(m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
  const d = new Date(s);
  return isNaN(d) ? "" : isoDate(d);
}
function dispDate(v){
  const iso = isoDate(v);
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

/* ══════════════════════ REGLAS ══════════════════════ */
function matchRegla(concepto, r){
  const d = String(concepto || "").toLowerCase();
  const p = String(r.patron || "").toLowerCase();
  if(!p) return false;
  const t = r.tipoPatron || "contiene";
  try{
    if(t === "empieza") return d.startsWith(p);
    if(t === "igual")   return d === p;
    if(t === "regex")   return new RegExp(r.patron, "i").test(String(concepto || ""));
    return d.indexOf(p) >= 0;
  }catch(e){ return false; }   // regex inválida: no matchea
}

/** Primera regla activa que matchea, por prioridad. */
function aplicarReglas(concepto){
  if(!concepto) return null;
  const cands = state.reglas
    .filter(r => r.activo !== false && matchRegla(concepto, r))
    .sort((a,b) => (+b.prioridad || 0) - (+a.prioridad || 0));
  return cands.length ? cands[0] : null;
}

/** Patrón sugerido a partir de un concepto: sin dígitos ni símbolos, dos palabras. */
function patronDesde(concepto){
  const limpio = String(concepto || "").toLowerCase()
    .replace(/[\d*]+/g, " ")
    .replace(/[^\wáéíóúüñ\s]/gi, " ");
  return limpio.split(/\s+/).filter(w => w.length > 2).slice(0, 2).join(" ").trim();
}

/** Clave de deduplicación — tiene que dar igual que `calcHash` del backend. */
function calcHash(m){
  return [
    isoDate(m.fecha),
    Math.round((+m.monto || 0) * 100),
    String(m.concepto || "").toLowerCase().slice(0, 40),
    String(m.cuenta || "")
  ].join("|");
}

/* ══════════════════════ PARSER DE RESÚMENES DE TARJETA ══════════════════════ */
/** Números en formato es-AR: "$ 1.234,56" → 1234.56 (respeta el signo). */
function parseNum(v){
  if(v == null || v === "") return null;
  if(typeof v === "number") return v;
  let s = String(v).replace(/U\$[SD]?|AR\$|US\$|\$/g, "").replace(/\s| /g, "");
  const neg = s.indexOf("-") >= 0;
  s = s.replace(/-/g, "").replace(/\./g, "").replace(/,/g, ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : (neg ? -n : n);
}

/** Período del resumen según la fecha de cierre (cierre a principio de mes ⇒ mes anterior). */
function periodoDesdeCierre(iso){
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return "";
  let y = +m[1], mo = +m[2];
  const d = +m[3];
  if(d < 15){ mo--; if(mo < 1){ mo = 12; y--; } }
  return `${y}-${String(mo).padStart(2,"0")}`;
}

/** "5 de 6" → " (cuota 5/6)" */
function textoCuotas(c){
  const s = String(c || "").trim();
  if(!s) return "";
  const m = s.match(/(\d+)\s*de\s*(\d+)/i);
  if(m) return ` (cuota ${m[1]}/${m[2]})`;
  if(/^\d+\s*\/\s*\d+$/.test(s)) return ` (cuota ${s.replace(/\s/g,"")})`;
  return "";
}

/** Amex / Visa de Santander en .xlsx, leídos como array de arrays. */
function parseTarjeta(aoa){
  const lineas = [];
  let inMov = false, inTax = false, lastDate = "";
  let totalPesos = null, totalUsd = null, cierre = "", venc = "";

  for(let i = 0; i < aoa.length; i++){
    const r = aoa[i], c0 = String(r[0] || "").trim();

    if(c0 === "Total a pagar"){ const nx = aoa[i+1] || []; totalPesos = parseNum(nx[0]); totalUsd = parseNum(nx[1]); }
    if(c0 === "Fecha de cierre" && !cierre){ const nx = aoa[i+1] || []; cierre = isoDate(nx[0]); venc = isoDate(nx[1]); }
    if(!cierre){ const mc = c0.match(/Cierre:\s*(\d{2}\/\d{2}\/\d{4})/); if(mc) cierre = isoDate(mc[1]); }
    if(!venc){   const mv = c0.match(/Vencimiento:\s*(\d{2}\/\d{2}\/\d{4})/); if(mv) venc = isoDate(mv[1]); }

    if(c0.startsWith("Fecha") && String(r[1] || "").startsWith("Descrip")){ inMov = true; inTax = false; continue; }
    if(c0.startsWith("Total de ")){ inMov = false; continue; }
    if(c0.startsWith("Otros conceptos")){ inMov = false; inTax = true; continue; }
    if(c0.startsWith("Aviso")) break;

    if(inMov){
      const isDate = /^\d{2}\/\d{2}\/\d{4}$/.test(c0);
      const fecha = isDate ? c0 : lastDate;      // la fecha se arrastra entre líneas
      if(isDate) lastDate = c0;
      const desc = String(r[1] || "").trim();
      if(!desc) continue;
      const cuotas = String(r[2] || "").trim();
      const ars = parseNum(r[4]), usd = parseNum(r[5]);
      const moneda  = usd != null ? "USD" : "ARS";
      const importe = usd != null ? usd : ars;
      if(importe == null) continue;
      lineas.push({ fechaIso:isoDate(fecha), desc, cuotas, moneda, importe });
    }else if(inTax){
      if(/^Descripci/.test(c0)) continue;
      const monto = parseNum(r[1]);
      if(monto == null) continue;
      lineas.push({ fechaIso:cierre, desc:c0, cuotas:"", moneda:"ARS", importe:Math.abs(monto), impuesto:true });
    }
  }
  return { lineas, meta:{ totalPesos, totalUsd, cierreIso:cierre, vencIso:venc, periodo:periodoDesdeCierre(cierre) } };
}

/* ── Resumen de tarjeta en PDF (Santander: Visa, Amex, Mastercard) ── */

/** dd/mm/yy → YYYY-MM-DD (dos dígitos de año ⇒ 20yy). */
function ddmmyyToIso(s){
  const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{2})/);
  return m ? `20${m[3]}-${m[2]}-${m[1]}` : "";
}

const MONEY = /(-?)\s*(U\$S|\$)\s*([\d.]+,\d{2})/g;
/** Último importe de la línea: es el que corresponde a la columna de monto. */
function lastMoney(linea){
  let m, last = null;
  MONEY.lastIndex = 0;
  while((m = MONEY.exec(linea))) last = m;
  if(!last) return null;
  return { token:last[0], moneda: last[2] === "U$S" ? "USD" : "ARS", importe: parseNum(last[3]) * (last[1] === "-" ? -1 : 1) };
}

/**
 * pdf.js entrega fragmentos sueltos: los reagrupamos por `y` y ordenamos por `x`.
 * Conservamos la posición de cada fragmento porque el resumen de cuenta usa
 * columnas (Caja de Ahorro / Cuenta Corriente) que sólo se distinguen por `x`.
 */
async function pdfLineasItems(file){
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({data:buf}).promise;
  const lineas = [];
  for(let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = {};
    tc.items.forEach(it => {
      if(!it.str || !it.str.trim()) return;
      const y = Math.round(it.transform[5]);
      (rows[y] = rows[y] || []).push({ s: it.str, x: it.transform[4], r: it.transform[4] + it.width });
    });
    Object.keys(rows).map(Number).sort((a,b) => b - a).forEach(y => {
      const items = rows[y].sort((a,b) => a.x - b.x);
      const texto = items.map(o => o.s).join(" ").replace(/\s+/g, " ").trim();
      if(texto) lineas.push({ pagina:p, y, texto, items });
    });
  }
  return lineas;
}

/** Sólo el texto de cada línea (lo que usan los parsers de tarjeta suelta). */
async function pdfLines(file){
  return (await pdfLineasItems(file)).map(l => l.texto);
}

/**
 * Devuelve las mismas líneas normalizadas que el parser de .xlsx, más la meta
 * del resumen. `clase` distingue consumo / pago / impuesto.
 */
function parseTarjetaPDF(lines){
  let sec = null, lastDate = "", card = "", totalPesos = null, totalUsd = null, cierre = "", venc = "";
  let subtotalPesos = null, subtotalUsd = null;
  const lineas = [];

  for(const raw of lines){
    const ln = raw.trim();

    const mc = ln.match(/Terminada en (\d{3,})/i);
    if(mc && !card) card = mc[1];

    const mt = ln.match(/^Total a pagar\s+\$?\s*([\d.]+,\d{2})\s+U\$S\s*([\d.]+,\d{2})/i);
    if(mt){ totalPesos = parseNum(mt[1]); totalUsd = parseNum(mt[2]); }

    // Fila de 6 fechas (cierre/vencimiento anterior · actual · próximo)
    if(!cierre && /^\d{2}\/\d{2}\/\d{2}( \d{2}\/\d{2}\/\d{2}){3,}/.test(ln)){
      const ds = ln.match(/\d{2}\/\d{2}\/\d{2}/g);
      cierre = ddmmyyToIso(ds[2]);
      venc   = ddmmyyToIso(ds[3]);
    }

    if(/^Pago anterior y devoluciones/i.test(ln)){ sec = "pago"; continue; }
    if(/^Movimientos de/i.test(ln)){ sec = "consumo"; continue; }
    if(/^Impuestos, intereses y percepciones/i.test(ln)){ sec = "impuesto"; continue; }
    if(/^Subtotal de/i.test(ln)){
      // El subtotal de consumos es contra lo que se concilia lo importado
      MONEY.lastIndex = 0;
      for(const m of ln.matchAll(MONEY)){
        const v = parseNum(m[3]) * (m[1] === "-" ? -1 : 1);
        if(m[2] === "U$S") subtotalUsd = v; else subtotalPesos = v;
      }
      if(sec === "consumo") sec = null;
      continue;
    }
    if(/^Total a pagar/i.test(ln)){ sec = null; continue; }
    if(/^T[eé]rminos y condiciones/i.test(ln)) break;
    if(/^Fecha Descripci/i.test(ln)) continue;                   // header de la tabla
    if(!sec) continue;
    if(/saldo anterior|saldo del resumen/i.test(ln)) continue;    // balances, no movimientos

    const mon = lastMoney(ln);
    if(!mon) continue;                                            // líneas de continuación, sin importe

    const dm = ln.match(/^(\d{2}\/\d{2}\/\d{2})/);
    const fecha = dm ? ddmmyyToIso(dm[1]) : lastDate;             // la fecha se arrastra
    if(dm) lastDate = ddmmyyToIso(dm[1]);

    const cuotaM = ln.match(/(\d+)\s+de\s+(\d+)/);
    let rest = ln;
    if(dm) rest = rest.replace(dm[1], "");
    rest = rest.replace(mon.token, "");
    if(cuotaM) rest = rest.replace(cuotaM[0], "");
    rest = rest.replace(/\b\d{5,}\b\s*$/, "");                    // número de comprobante
    rest = rest.replace(/\s*\$\s*$/, "");                         // "$" colgando en impuestos

    lineas.push({
      clase: sec,
      fechaIso: fecha,
      desc: rest.replace(/\s+/g, " ").trim(),
      cuotas: cuotaM ? `${cuotaM[1]}/${cuotaM[2]}` : "",
      moneda: mon.moneda,
      importe: mon.importe,
      impuesto: sec === "impuesto"
    });
  }

  return {
    lineas,
    meta:{ card, totalPesos, totalUsd, subtotalPesos, subtotalUsd, cierreIso:cierre, vencIso:venc, periodo:periodoDesdeCierre(cierre) }
  };
}

/* ══════════ Resumen de cuenta Santander (multi-cuenta + tarjetas embebidas) ══════════ */

const esMontoItem = s => /^-?(\$|U\$S)\s/.test(String(s).trim());
/** "$ 1.234,56" / "-U$S 6,94" → {moneda, importe} */
function montoDeItem(s){
  const t = String(s).trim();
  const moneda = /U\$S/.test(t) ? "USD" : "ARS";
  const n = parseNum(t.replace(/U\$S|\$/g, ""));
  return n == null ? null : { moneda, importe: n };
}

/** El PDF es un resumen de cuenta si trae las secciones de movimientos del banco. */
const esResumenDeCuenta = lineas => lineas.some(l => /^Movimientos en (pesos|d[óo]lares)/i.test(l.texto));

/**
 * Cuerpo bancario: cada sección ("Movimientos en pesos/dólares") trae una columna
 * por cuenta más la de saldo. La columna de cada importe se resuelve por su borde
 * derecho, que es el que coincide con el del encabezado (los montos van alineados
 * a la derecha).
 */
function parseResumenBanco(lineas){
  const cuentas = {};      // clave → {clave, nombre, moneda, saldoInicial}
  const movs = [], saldos = {};
  let cols = null, moneda = null, enSeccion = false, lastDate = "", ultimo = null;

  const columnaDe = (item) => {
    let mejor = null, dist = 20;                    // tolerancia en puntos
    for(const c of cols){
      const d = Math.abs(item.r - c.r);
      if(d < dist){ dist = d; mejor = c; }
    }
    return mejor;
  };

  for(const l of lineas){
    const t = l.texto;

    const mSec = t.match(/^Movimientos en (pesos|d[óo]lares)/i);
    if(mSec){
      enSeccion = true;
      moneda = /pesos/i.test(mSec[1]) ? "ARS" : "USD";
      cols = null; ultimo = null; lastDate = "";
      continue;
    }
    if(!enSeccion) continue;

    if(/^Saldo total/i.test(t)){                    // cierra la sección
      enSeccion = false; ultimo = null;
      continue;
    }

    // Encabezado de la tabla (se repite en cada página)
    if(/^Fecha\b/.test(t) && /Comprobante/.test(t) && /Movimiento/.test(t)){
      cols = l.items.filter(i => i.x > 300).map(i => ({ nombre:i.s.trim(), x:i.x, r:i.r }));
      cols.forEach((c, idx) => {
        c.esSaldo = idx === cols.length - 1;
        if(!c.esSaldo){
          const clave = c.nombre;
          if(!cuentas[clave]) cuentas[clave] = { clave, nombre:c.nombre, moneda, saldoInicial:null };
        }
      });
      ultimo = null;
      continue;
    }
    if(!cols) continue;

    const montos = l.items.filter(i => esMontoItem(i.s));
    if(!montos.length){
      // Línea de contraparte ("A fulano…", "De fulano…", "Del 01/07…")
      if(ultimo && t && !/^\d{2}\/\d{2}\/\d{2}$/.test(t)) ultimo.concepto = (ultimo.concepto + " " + t).trim();
      continue;
    }

    const fechaItem = l.items.find(i => i.x < 70 && /^\d{2}\/\d{2}\/\d{2}$/.test(i.s.trim()));
    if(fechaItem) lastDate = ddmmyyToIso(fechaItem.s.trim());
    const comprobante = (l.items.find(i => i.x >= 60 && i.x < 112 && /^\d{4,}$/.test(i.s.trim())) || {}).s || "";
    const concepto = l.items
      .filter(i => i.x >= 112 && i.x < 330 && !esMontoItem(i.s))
      .map(i => i.s).join(" ").replace(/\s+/g, " ").trim();

    // El importe del movimiento es el que NO cae en la columna de saldo
    let dato = null, saldo = null;
    for(const it of montos){
      const col = columnaDe(it);
      const v = montoDeItem(it.s);
      if(!col || !v) continue;
      if(col.esSaldo) saldo = v.importe;
      else if(v.importe !== 0 && !dato) dato = { col, ...v };
    }

    if(/^Saldo Inicial/i.test(concepto)){          // no es un movimiento: es la apertura
      for(const it of montos){
        const col = columnaDe(it), v = montoDeItem(it.s);
        if(col && !col.esSaldo && v && cuentas[col.nombre]) cuentas[col.nombre].saldoInicial = v.importe;
      }
      continue;
    }
    if(!dato) continue;

    ultimo = {
      cuentaDetectada: dato.col.nombre,
      fechaIso: lastDate,
      comprobante: String(comprobante).trim(),
      concepto: concepto || "(sin concepto)",
      moneda: dato.moneda,
      importe: dato.importe,
      saldoCorriente: saldo
    };
    movs.push(ultimo);
    if(saldo != null) saldos[moneda] = saldo;      // el último saldo de la sección
  }

  /* Conciliación: el "Saldo en cuenta" del resumen es el acumulado de todas las
     cuentas de esa moneda, así que se controla por moneda y no por cuenta. */
  const totales = {};
  for(const c of Object.values(cuentas)){
    const t = totales[c.moneda] || (totales[c.moneda] = { inicial:0, movimientos:0, resumen:saldos[c.moneda] });
    t.inicial += (+c.saldoInicial || 0);
  }
  for(const m of movs){
    if(totales[m.moneda]) totales[m.moneda].movimientos += m.importe;
  }
  Object.values(totales).forEach(t => {
    t.calculado = Math.round((t.inicial + t.movimientos) * 100) / 100;
    t.coincide = t.resumen != null && Math.abs(t.calculado - t.resumen) < 0.05;
  });

  return { cuentas: Object.values(cuentas), movs, totales };
}

/**
 * Tarjetas embebidas en el resumen de cuenta. Mismo contenido que el PDF suelto
 * de la Fase 8 pero con otras etiquetas ("Consumos del mes" en vez de
 * "Movimientos de", "Tu pago" en vez de "Su pago"), así que tiene su propio parser.
 */
function parseTarjetasEmbebidas(lineas){
  const bloques = [];
  let actual = null;
  for(const l of lineas){
    if(/^Tarjeta Santander$/i.test(l.texto)){
      actual = [];
      bloques.push(actual);
      continue;
    }
    if(actual) actual.push(l);
  }
  return bloques.map(parseBloqueTarjeta).filter(t => t && t.lineas.length);
}

function parseBloqueTarjeta(bloque){
  let emisor = "Tarjeta", numero = "", cierre = "", venc = "";
  let totalPesos = null, totalUsd = null, subtotalPesos = null, subtotalUsd = null;
  let sec = null, lastDate = "", esperandoFechas = false;
  const lineas = [];

  for(const l of bloque){
    const t = l.texto;

    if(/^Visa cr[ée]dito/i.test(t)) emisor = "Visa";
    else if(/^American Express/i.test(t)) emisor = "Amex";
    else if(/^Mastercard/i.test(t)) emisor = "Mastercard";

    const mNum = t.match(/Tarjeta terminada en (\d{3,})/i);
    if(mNum && !numero) numero = mNum[1];

    // Cierre y vencimiento del período actual: van en la línea siguiente al encabezado
    if(!cierre && /Cierre/i.test(t) && /Vencimiento/i.test(t) && !/anterior|pr[óo]ximo/i.test(t)){
      esperandoFechas = true;
      continue;
    }
    if(esperandoFechas){
      const ds = t.match(/\d{2}\/\d{2}\/\d{2}/g);
      if(ds && ds.length >= 2){ cierre = ddmmyyToIso(ds[0]); venc = ddmmyyToIso(ds[1]); esperandoFechas = false; }
      continue;
    }

    if(/^Pago anterior y devoluciones/i.test(t)){ sec = "pago"; continue; }
    if(/^Consumos del mes/i.test(t)){ sec = "consumo"; continue; }
    if(/^Impuestos$/i.test(t)){ sec = "impuesto"; continue; }
    if(/^Consumos totales/i.test(t)){
      const ms = l.items.filter(i => esMontoItem(i.s)).map(i => montoDeItem(i.s));
      ms.forEach(v => { if(v.moneda === "USD") subtotalUsd = v.importe; else subtotalPesos = v.importe; });
      sec = null; continue;
    }
    if(/^Total a pagar/i.test(t)){
      const ms = l.items.filter(i => esMontoItem(i.s)).map(i => montoDeItem(i.s));
      ms.forEach(v => { if(v.moneda === "USD") totalUsd = v.importe; else totalPesos = v.importe; });
      break;                                     // el bloque de esta tarjeta termina acá
    }
    if(!sec) continue;
    if(/^Fecha\b/i.test(t)) continue;                        // encabezado de tabla
    if(/\bSaldo (anterior|del resumen)/i.test(t)) continue;  // es un saldo, no un movimiento
    if(/^Total\b/i.test(t)) continue;                        // subtotales de sección

    const montos = l.items.filter(i => esMontoItem(i.s));
    if(!montos.length) continue;

    const fechaItem = l.items.find(i => i.x < 75 && /^\d{2}\/\d{2}\/\d{2}$/.test(i.s.trim()));
    if(fechaItem) lastDate = ddmmyyToIso(fechaItem.s.trim());

    const mCuota = t.match(/(\d{1,2})\s+de\s+(\d{1,2})/);
    const desc = l.items
      .filter(i => i.x >= 75 && i.x < 340 && !esMontoItem(i.s) && !/^\d{2}\/\d{2}\/\d{2}$/.test(i.s.trim()) && !/^\d{4,}$/.test(i.s.trim()))
      .map(i => i.s).join(" ").replace(/\s+/g, " ").replace(/\s*\$\s*$/, "").trim();

    const v = montoDeItem(montos[montos.length - 1].s);
    if(!v || !desc) continue;

    lineas.push({
      clase: sec,
      fechaIso: lastDate || cierre,
      desc,
      cuotas: mCuota ? `${+mCuota[1]}/${+mCuota[2]}` : "",
      moneda: v.moneda,
      importe: v.importe,
      impuesto: sec === "impuesto"
    });
  }

  if(!numero && !lineas.length) return null;
  return {
    emisor, numero,
    lineas,
    meta:{ card:numero, totalPesos, totalUsd, subtotalPesos, subtotalUsd,
           cierreIso:cierre, vencIso:venc, periodo:periodoDesdeCierre(cierre) }
  };
}

/** Emisor y número de tarjeta a partir del texto del PDF. */
function detectarEmisorPDF(lines, card){
  const texto = lines.slice(0, 40).join(" ").toLowerCase();
  let emisor = "Tarjeta";
  if(texto.includes("american express") || texto.includes("amex")) emisor = "Amex";
  else if(texto.includes("mastercard")) emisor = "Mastercard";
  else if(texto.includes("visa")) emisor = "Visa";
  return { emisor, numero: card || "" };
}

/** Emisor y número de tarjeta, por el texto de las primeras filas. */
function detectarEmisor(aoa){
  const texto = aoa.slice(0, 25).map(r => r.join(" ")).join(" ").toLowerCase();
  let emisor = "Tarjeta";
  if(texto.includes("american express")) emisor = "Amex";
  else if(texto.includes("visa")) emisor = "Visa";
  const m = texto.match(/terminada en\s*(\d{3,4})/);
  return { emisor, numero: m ? m[1] : "" };
}

/* ══════════════════════ COTIZACIÓN ══════════════════════ */
/* Cuántos ARS vale 1 USD, hoy */
function rate(){ return (state.mep && state.mep.venta > 0) ? state.mep.venta : null; }

/* ── Conversión ──
   Regla de oro (PLAN.md):
   · Un movimiento se valúa con SU cotización congelada, la del día en que pasó.
   · Un saldo (cuentas, patrimonio) se valúa al dólar de HOY: representa cuánto vale ahora.
   Devuelve null si no hay cotización con la que convertir. */
function convertir(monto, moneda, cur, tc){
  const n = +monto || 0;
  if(!cur || cur === "ambas" || cur === moneda) return n;
  if(!(tc > 0)) return null;
  if(cur === "USD") return moneda === "ARS" ? n / tc : n;
  return moneda === "USD" ? n * tc : n;
}
/* ── Saldos ──
   El saldo de una cuenta es su SaldoInicial más lo que entró y salió, en la
   moneda de la cuenta (los movimientos siempre están en esa moneda). */
function saldosPorCuenta(hasta){
  const tope = hasta || "9999-12-31";
  const s = {};
  for(const c of state.cuentas){
    s[c.id] = (c.fechaInicial && isoDate(c.fechaInicial) > tope) ? 0 : (+c.saldoInicial || 0);
  }
  for(const m of state.movimientos){
    if(m.fecha > tope) continue;
    if(m.tipo === "Ingreso"){ if(m.cuenta in s) s[m.cuenta] += +m.monto || 0; }
    else if(m.tipo === "Egreso"){ if(m.cuenta in s) s[m.cuenta] -= +m.monto || 0; }
    else if(m.tipo === "Interno"){
      if(m.cuenta in s) s[m.cuenta] -= +m.monto || 0;
      if(m.cuentaDestino in s) s[m.cuentaDestino] += (m.montoDestino == null ? +m.monto : +m.montoDestino) || 0;
    }
  }
  return s;
}

/* ── Acumulador bimonetario ──
   Suma en ARS y en USD por separado: que un monto no se pueda expresar en una
   moneda no lo saca del total de la otra (un saldo en pesos sigue sumando en
   pesos aunque no haya cotización). */
function acum(){ return {ars:0, usd:0, faltanArs:0, faltanUsd:0}; }
function sumar(t, monto, moneda, tc){
  const a = convertir(monto, moneda, "ARS", tc);
  const u = convertir(monto, moneda, "USD", tc);
  if(a == null) t.faltanArs++; else t.ars += a;
  if(u == null) t.faltanUsd++; else t.usd += u;
}
/** Cuántos quedaron fuera del total que se está mirando. */
const faltan = t => state.cur === "USD" ? t.faltanUsd : t.faltanArs;

/** Valor de una tenencia: el guardado o, si falta, cantidad × precio. */
const valorInversion = i => (+i.valorActual || (+i.cantidad || 0) * (+i.precioActual || 0));

/* Todo lo que compone el patrimonio: cuentas marcadas `EnPatrimonio` + tenencias.
   Las tenencias son una foto de hoy, así que sólo entran cuando no hay fecha de corte. */
function activosPatrimonio(hasta){
  const s = saldosPorCuenta(hasta);
  const out = cuentasActivas().filter(c => c.enPatrimonio).map(c => ({
    id:c.id, nombre:c.nombre, moneda:c.moneda, monto:s[c.id], tipo:c.tipo, clase:"cuenta"
  }));
  if(!hasta){
    for(const i of state.inversiones){
      out.push({
        id:i.id, nombre:i.especie || i.descripcion, moneda:i.moneda, monto:valorInversion(i),
        tipo:"inversion", clase:"inversion", broker:i.broker, tipoActivo:i.tipoActivo
      });
    }
  }
  return out;
}

/** Patrimonio: cuentas + tenencias, al dólar de hoy. */
function patrimonio(hasta){
  const t = acum();
  for(const a of activosPatrimonio(hasta)) sumar(t, a.monto, a.moneda, rate());
  return t;
}

/** Total de las tenencias, al dólar de hoy. */
function totalInversiones(lista){
  const t = acum();
  for(const i of (lista || state.inversiones)) sumar(t, valorInversion(i), i.moneda, rate());
  return t;
}

/** Nombre de broker de una tenencia, ya normalizado para agrupar y filtrar. */
const brokerDe = i => String(i.broker || "").trim() || "Sin broker";

/** Cotización de un movimiento: la congelada; si le falta, la de hoy. */
const tcDe = m => (+m.cotizacion > 0 ? +m.cotizacion : rate());
/** Valor de un movimiento en la moneda de vista (histórico). */
const valorMov = (m, cur) => convertir(m.monto, m.moneda, cur, tcDe(m));
/** Valor de hoy de un saldo (cuentas, inversiones, patrimonio). */
const valorHoy = (monto, moneda, cur) => convertir(monto, moneda, cur, rate());

function toARS(monto, moneda){ const v = convertir(monto, moneda, "ARS", rate()); return v == null ? (+monto||0) : v; }
function toUSD(monto, moneda){ const v = convertir(monto, moneda, "USD", rate()); return v == null ? 0 : v; }

/* Cómo mostrar un monto según el toggle. Si hubo conversión, el monto original
   queda de referencia abajo: nunca se muestra un importe convertido con la
   etiqueta de la moneda original. */
function montoVista(monto, moneda, tc){
  const nativo = fmt(monto, moneda);
  if(state.cur === "ambas" || state.cur === moneda) return {txt:nativo, sub:"", tit:""};
  const v = convertir(monto, moneda, state.cur, tc);
  if(v == null){
    return {txt:nativo, sub:"sin cotización",
            tit:"No hay cotización cargada, así que se muestra el monto en " + moneda + "."};
  }
  return {txt:fmt(v, state.cur), sub:nativo,
          tit:`${nativo} convertidos a ${state.cur} a $${nf(tc, 2)} por USD`};
}

const MEP_SOURCES = [
  {n:"MEP",  url:"https://dolarapi.com/v1/dolares/mep",                        pick:d=>({compra:+d.compra, venta:+d.venta, fecha:(d.fechaActualizacion||"").slice(0,10)})},
  {n:"MEP",  url:"https://api.argentinadatos.com/v1/cotizaciones/dolares/mep", pick:d=>({compra:+d.compra, venta:+d.venta, fecha:(d.fecha||"").slice(0,10)})},
  {n:"Blue", url:"https://api.bluelytics.com.ar/v2/latest",                    pick:d=>({compra:+d.blue.value_buy, venta:+d.blue.value_sell, fecha:(d.last_update||"").slice(0,10)})}
];

async function fetchMep(silent){
  for(const s of MEP_SOURCES){
    try{
      const r = await fetch(s.url, {cache:"no-store"});
      if(!r.ok) continue;
      const m = s.pick(await r.json());
      if(m && m.venta > 0){
        state.mep = {compra:m.compra, venta:m.venta, fecha:m.fecha || todayIso(), fuente:s.n, manual:false};
        localStorage.setItem("mf_mep", JSON.stringify(state.mep));
        renderMep();
        if(state.tab === "ajustes") render();
        if(!silent) toast("Dólar " + s.n + " actualizado: $" + nf(m.venta, 0));
        return true;
      }
    }catch(e){ /* probamos la siguiente fuente */ }
  }
  if(!silent) toast("No se pudo obtener la cotización online. Cargala a mano en Ajustes.");
  return false;
}

/* MEP de una fecha pasada (para congelar el valor del movimiento en su día).
   Si no hay dato (fin de semana, feriado, API caída) devuelve null y se usa el actual. */
const mepHistCache = {};
async function mepDe(fechaIso){
  const iso = isoDate(fechaIso);
  if(!iso) return null;
  if(iso >= todayIso()) return rate();
  if(iso in mepHistCache) return mepHistCache[iso];
  const [y,m,d] = iso.split("-");
  try{
    const r = await fetch(`https://api.argentinadatos.com/v1/cotizaciones/dolares/mep/${y}/${m}/${d}`, {cache:"force-cache"});
    if(r.ok){
      const j = await r.json();
      const dato = Array.isArray(j) ? j[j.length - 1] : j;
      const venta = dato && +dato.venta;
      if(venta > 0){ mepHistCache[iso] = venta; return venta; }
    }
  }catch(e){ /* sin dato histórico: se usa el actual */ }
  mepHistCache[iso] = null;
  return null;
}

function setMepManual(valor){
  const v = parseFloat(String(valor).replace(",", "."));
  if(!v || v <= 0){ toast("Valor inválido"); return false; }
  state.mep = {compra:v, venta:v, fecha:todayIso(), fuente:"Manual", manual:true};
  localStorage.setItem("mf_mep", JSON.stringify(state.mep));

function renderMep(){

}

/* ══════════════════════ API ══════════════════════ */
async function api(payload){
  if(!state.url) throw new Error("Falta configurar la URL del backend en Ajustes.");
  if(!state.token) throw new Error("Falta el token del backend en Ajustes.");
  const res = await fetch(state.url, {
    method: "POST",
    // text/plain evita el preflight CORS con Apps Script
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    // el token viaja en el cuerpo, nunca en la URL (no queda en logs ni historial)
    body: JSON.stringify({...payload, token: state.token})
  });
  const txt = await res.text();
  let data;
  try{ data = JSON.parse(txt); }
  catch(e){
    throw new Error("El backend no devolvió JSON. Verificá que la URL termine en /exec y que la implementación tenga acceso 'Cualquiera con el enlace'.");
  }
  if(!data.ok) throw new Error(data.error || "Error del servidor");
  return data;
}

function ordenarCuentas(list){
  return list.slice().sort((a,b) => ((+a.orden||0) - (+b.orden||0)) || String(a.nombre).localeCompare(String(b.nombre), "es"));
}
/* Más nuevos primero; a igual fecha, el último cargado arriba. */
function ordenarMovs(list){
  return list.slice().sort((a,b) => (b.fecha + (b.timestamp||"")).localeCompare(a.fecha + (a.timestamp||"")));
}

/* ── Mes ── */
const mesActual  = () => todayIso().slice(0,7);
const mesDe      = iso => String(iso || "").slice(0,7);

/* ── Lente de fechas ──
   Un consumo de tarjeta tiene dos fechas: la de la compra y la del resumen que
   la factura. La lente elige con cuál se agrupa por mes.
   · "resumen" (default): cada cuota cae en el mes en que la pagás — gastos parejos.
   · "consumo": cada gasto en el mes en que lo hiciste — las cuotas se apilan ahí.
   En los movimientos manuales las dos fechas coinciden, así que no cambian. */
const LENTES = [
  {v:"resumen", l:"Por resumen", ayuda:"Cada cuota cae en el mes del resumen que la factura: es lo que te impacta cada mes."},
  {v:"consumo", l:"Por consumo", ayuda:"Cada gasto cae en el mes en que lo hiciste: una compra en cuotas se ve entera ahí."}
];
const lenteInfo = () => LENTES.find(x => x.v === state.lente) || LENTES[0];

/** Mes (YYYY-MM) con el que se agrupa un movimiento según la lente. */
function mesLente(mov, lente){
  const l = lente || state.lente;
  const f = l === "consumo" ? mov.fecha : (mov.fechaResumen || mov.fecha);
  return mesDe(isoDate(f));
}

/** Fecha con la que se ordena y agrupa un movimiento según la lente. */
function fechaLente(mov, lente){
  const l = lente || state.lente;
  return isoDate(l === "consumo" ? mov.fecha : (mov.fechaResumen || mov.fecha));
}

/** Meses con movimientos en la lente activa, ordenados. */
function mesesConDatos(lente){
  return [...new Set(state.movimientos.map(m => mesLente(m, lente)).filter(Boolean))].sort();
}

/** Al cambiar de lente, si el mes elegido queda vacío saltamos al último con datos. */
function setLente(lente){
  state.lente = lente;
  localStorage.setItem("mf_lente", lente);
  const meses = mesesConDatos(lente);
  if(meses.length && !meses.includes(state.mes)) state.mes = meses[meses.length - 1];
  render();
}

/** Control segmentado de la lente, con su línea de ayuda. */
function toggleLente(){
  return `
  <div class="lente">
    <div class="filtros" style="margin-bottom:4px">
      ${LENTES.map(l => `<button class="pill ${state.lente === l.v ? "on" : ""}" data-lente="${l.v}">${l.l}</button>`).join("")}
    </div>
    <p class="hint" style="margin:0 2px 12px">${lenteInfo().ayuda}</p>
  </div>`;
}
function bindLente(){
  $$("[data-lente]").forEach(b => b.onclick = () => setLente(b.dataset.lente));
}
function mesLabel(mes){
  const [y,m] = String(mes).split("-");
  return (MESES[+m - 1] || "") + " " + y;
}
function mesShift(mes, delta){
  const [y,m] = String(mes).split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

/* ── Lookups ── */
/* Las archivadas siguen en `state.cuentas` para resolver el historial;
   para operar (altas, patrimonio, saldos a la vista) sólo van las activas. */
const cuentasActivas = () => state.cuentas.filter(c => c.activo !== false);
const estaArchivada  = id => { const c = cuentaPorId(id); return !!c && c.activo === false; };
const cuentaPorId = id => state.cuentas.find(c => c.id === id) || null;
const catPorId    = id => state.categorias.find(c => c.id === id) || null;
const nombreCuenta = id => (cuentaPorId(id) || {}).nombre || "cuenta borrada";
const monedaCuenta = id => (cuentaPorId(id) || {}).moneda || "ARS";
/* Categorías que aplican a un tipo de movimiento */
function catsPara(tipo){
  const quiere = tipo === "Ingreso" ? "ingreso" : "gasto";
  return state.categorias.filter(c => c.aplica === quiere || c.aplica === "ambos");
}

async function bootstrap(silent){
  if(!state.url || !state.token){ state.conectado = false; render(); return false; }
  state.cargando = true; state.error = ""; render();
  try{
    const d = await api({action:"bootstrap"});
    state.cuentas     = ordenarCuentas(d.cuentas || []);
    state.categorias  = (d.categorias || []).filter(c => c.activo !== false);
    state.modosPago   = (d.modosPago || []).filter(m => m.activo !== false);
    state.movimientos = ordenarMovs((d.movimientos || []).map(m => ({
      ...m, fecha:isoDate(m.fecha), fechaResumen:isoDate(m.fechaResumen || m.fecha)
    })));
    state.inversiones = (d.inversiones || []).map(i => ({...i, fecha:isoDate(i.fecha)}));
    state.reglas      = (d.reglas || []).filter(r => r.activo !== false);
    state.config      = d.config || {};
    state.backendVersion = d.version || "";
    state.conectado = true;
    if(!silent){ const n = cuentasActivas().length; toast("Conectado · " + n + (n === 1 ? " cuenta" : " cuentas")); }
    return true;
  }catch(e){
    state.conectado = false;
    state.error = e.message;
    if(!silent) toast(e.message);
    return false;
  }finally{
    state.cargando = false;
    render();
  }
}

/* ══════════════════════ NAVEGACIÓN ══════════════════════ */
function setTab(id){
  state.tab = id;
  localStorage.setItem("mf_tab", id);
  render();
  window.scrollTo({top:0});
}

function renderNav(){
  const side = TABS.map(t =>
    `<button data-tab="${t.id}" class="${state.tab===t.id?"on":""}"><span class="ic">${t.ic}</span>${t.label}</button>`).join("");
  $("#sideNav").innerHTML = side;
  const bottom = TABS.map(t =>
    `<button data-tab="${t.id}" class="${state.tab===t.id?"on":""}"><span class="ic">${t.ic}</span>${t.label}</button>`).join("");
  $("#bottomNav").innerHTML = bottom;
  $$("[data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));
}

function renderCurToggle(){
  $$("#curToggle button").forEach(b => b.classList.toggle("on", b.dataset.cur === state.cur));
}

function renderBrandSub(){
  const s = $("#brandSub");
  let txt;
  if(!state.url || !state.token) txt = "sin conectar";
  else if(state.cargando) txt = "cargando…";
  else if(state.conectado){ const n = cuentasActivas().length; txt = n + (n === 1 ? " cuenta" : " cuentas"); }
  else txt = "sin conexión";
  const desfasado = state.backendVersion && state.backendVersion !== APP_VERSION;
  s.innerHTML = `${esc(txt)} <span class="ver${desfasado ? " alerta" : ""}" title="App v${esc(APP_VERSION)} · ${esc(APP_FECHA)}${desfasado ? ` — el backend publicado es v${esc(state.backendVersion)}` : ""}">v${esc(APP_VERSION)}${desfasado ? " ⚠" : ""}</span>`;
}

/* ══════════════════════ RENDER ══════════════════════ */
function render(){
  renderNav();
  renderCurToggle();
  renderBrandSub();
  if(!state.mes) state.mes = mesActual();
  const c = $("#content");
  if(state.tab === "ajustes"){ c.innerHTML = viewAjustes(); bindAjustes(); }
  else if(state.tab === "movimientos"){ c.innerHTML = viewMovimientos(); bindMovimientos(); }
  else if(state.tab === "resumen"){ c.innerHTML = viewResumen(); bindResumen(); }
  else if(state.tab === "patrimonio"){ c.innerHTML = viewPatrimonio(); }
  else if(state.tab === "inversiones"){ c.innerHTML = viewInversiones(); bindInversiones(); }
  else c.innerHTML = viewProximamente(state.tab);
}

function viewProximamente(tabId){
  const t = TABS.find(x => x.id === tabId) || TABS[0];
  return `
    <h2 class="tab-title">${t.label}</h2>
    <div class="card">
      <div class="empty">
        <div class="big">${t.ic}</div>
        <div class="t">Próximamente</div>
        <div class="s">Esta pantalla se construye en la <b>Fase ${t.fase}</b> del plan.
        Por ahora podés cargar tus cuentas y la cotización desde <b>Ajustes</b>.</div>
      </div>
    </div>`;
}

/* Gráfico de barras por categoría (sin librerías) */
function cardGrafico(movsMes){
  const tipo = state.grafico === "Ingreso" ? "Ingreso" : "Egreso";
  const map = {};
  for(const m of movsMes){
    if(m.tipo !== tipo) continue;
    const k = m.categoria || "";
    if(!map[k]) map[k] = Object.assign(acum(), {id:k});
    sumar(map[k], m.monto, m.moneda, tcDe(m));
  }
  const enUsd  = state.cur === "USD";
  const filas  = Object.values(map).sort((a,b) => (enUsd ? b.usd - a.usd : b.ars - a.ars));
  const sinCot = filas.reduce((a,f) => a + faltan(f), 0);
  const total  = filas.reduce((a,x) => a + (enUsd ? x.usd : x.ars), 0);

  const pills = ["Egreso","Ingreso"].map(t =>
    `<button class="pill ${tipo===t?"on":""}" data-graf="${t}">${t}s</button>`).join("");

  let cuerpo;
  if(!filas.length){
    cuerpo = `<div class="empty" style="padding:20px 10px"><div class="s">Sin ${tipo.toLowerCase()}s en ${mesLabel(state.mes)}.</div></div>`;
  }else{
    cuerpo = `<div class="bars">` + filas.map(f => {
      const cat = catPorId(f.id);
      const v   = enUsd ? f.usd : f.ars;
      const pct = total ? Math.round(v / total * 100) : 0;
      const val = fmt(v, enUsd ? "USD" : "ARS", 0);
      return `<div class="bar">
        <div class="bl">
          <span class="dot" style="background:${esc(cat ? cat.color : COLOR_DEFAULT)}"></span>
          <span class="nm">${esc(cat ? cat.nombre : "Sin categoría")}</span>
          <span class="pct">${pct}%</span>
          <span class="val num">${val}</span>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${esc(cat ? cat.color : COLOR_DEFAULT)}"></div></div>
      </div>`;
    }).join("") + `</div>`;
  }

  return `
  <div class="card">
    <div class="card-head"><h3>Por categoría</h3><span style="display:flex;gap:6px">${pills}</span></div>
    ${cuerpo}
    ${sinCot ? `<p class="hint" style="margin:10px 0 0">${sinCot} ${sinCot === 1 ? "movimiento quedó" : "movimientos quedaron"} fuera por no tener cotización.</p>` : ""}
  </div>`;
}

function bindResumen(){
  $$("[data-mes]").forEach(b => b.onclick = () => {
    state.mes = b.dataset.mes === "hoy" ? mesActual() : mesShift(state.mes, +b.dataset.mes);
    render();
  });
  $$("[data-graf]").forEach(b => b.onclick = () => { state.grafico = b.dataset.graf; render(); });
  bindLente();
  const fab = $("#fabNuevo");
  if(fab) fab.onclick = () => modalMovimiento(null);
}

/* ══════════════════════ INVERSIONES ══════════════════════ */
function viewInversiones(){
  if(!state.conectado){
    return `<h2 class="tab-title">Inversiones</h2>
      <div class="card"><div class="empty">
        <div class="big">🔌</div><div class="t">Sin conexión</div>
        <div class="s">Conectá tu backend en <b>Ajustes</b> para cargar tus tenencias.</div>
      </div></div>`;
  }
  if(!state.inversiones.length){
    return `<h2 class="tab-title">Inversiones</h2>
      <div class="card"><div class="empty">
        <div class="big">📈</div>
        <div class="t">Todavía no hay tenencias</div>
        <div class="s">Cargá lo que tenés en cada broker (especie, cantidad y precio actual). Suman al patrimonio automáticamente.</div>
        <div class="btn-row" style="justify-content:center"><button class="btn primary sm" id="btnNuevaInv">＋ Nueva tenencia</button></div>
      </div></div>`;
  }

  /* Filtro por broker */
  const listaBrokers = [...new Set(state.inversiones.map(brokerDe))].sort((a,b) => a.localeCompare(b, "es"));
  if(state.filtroBroker && !listaBrokers.includes(state.filtroBroker)) state.filtroBroker = "";
  const invs = state.filtroBroker
    ? state.inversiones.filter(i => brokerDe(i) === state.filtroBroker)
    : state.inversiones;

  const pillsBroker = listaBrokers.length > 1 ? `
    <div class="filtros">
      <button class="pill ${state.filtroBroker ? "" : "on"}" data-broker="">Todos</button>
      ${listaBrokers.map(b => `<button class="pill ${state.filtroBroker === b ? "on" : ""}" data-broker="${esc(b)}">${esc(b)}</button>`).join("")}
    </div>` : "";

  const t = totalInversiones(invs);

  /* Composición por tipo de activo */
  const porTipo = {};
  for(const i of invs){
    const k = i.tipoActivo || "otro";
    if(!porTipo[k]) porTipo[k] = Object.assign(acum(), {nombre:activoInfo(k).l, color:activoInfo(k).color});
    sumar(porTipo[k], valorInversion(i), i.moneda, rate());
  }
  const filasTipo = Object.values(porTipo).sort((a,b) => (state.cur === "USD" ? b.usd - a.usd : b.ars - a.ars));

  /* Detalle agrupado por broker */
  const brokers = {};
  for(const i of invs){
    (brokers[brokerDe(i)] || (brokers[brokerDe(i)] = [])).push(i);
  }
  const detalle = Object.keys(brokers).sort((a,b) => a.localeCompare(b, "es")).map(b => {
    const sub = acum();
    brokers[b].forEach(i => sumar(sub, valorInversion(i), i.moneda, rate()));
    return `
      <div class="card">
        <div class="card-head">
          <h3>${esc(b)}</h3>
          <span class="num" style="font-weight:700;font-size:14px">${totalVista(sub.ars, sub.usd)}</span>
        </div>
        <div style="margin-top:6px">${brokers[b].map(filaInversion).join("")}</div>
      </div>`;
  }).join("");

  return `
    <h2 class="tab-title">Inversiones</h2>

    <div class="hero">
      <div class="lbl">${!state.filtroBroker ? "Total en tenencias"
        : state.filtroBroker === "Sin broker" ? "Total sin broker"
        : "Total en " + esc(state.filtroBroker)}</div>
      <div class="v num">${state.cur === "USD" ? fmt(t.usd, "USD", 0) : fmt(t.ars, "ARS", 0)}</div>
      ${state.cur === "ambas" ? `<div class="u num">${fmt(t.usd, "USD", 0)}</div>` : ""}
      <div class="u">${invs.length} ${invs.length === 1 ? "tenencia" : "tenencias"}${state.filtroBroker ? ` de ${state.inversiones.length}` : ""}${faltan(t) ? ` · ${faltan(t)} sin cotización` : ""}</div>
    </div>

    ${pillsBroker}
    ${cardComposicion("Por tipo de activo", filasTipo)}
    ${detalle}

    <button class="fab" id="btnNuevaInv" title="Nueva tenencia">＋</button>`;
}

function filaInversion(i){
  const info  = activoInfo(i.tipoActivo);
  const vista = montoVista(valorInversion(i), i.moneda, rate());
  const detalle = `${nf(i.cantidad)} × ${fmt(i.precioActual, i.moneda)}`;
  return `
  <button class="mov" data-inv="${esc(i.id)}"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
    <span class="dot" style="background:${esc(info.color)}"></span>
    <span class="info">
      <span class="cpt">${esc(i.especie || i.descripcion)}</span>
      <span class="meta">
        <span class="tag">${esc(info.l)}</span>
        ${i.especie && i.descripcion ? `<span class="tag">${esc(i.descripcion)}</span>` : ""}
        <span class="tag">${esc(detalle)}</span>
      </span>
    </span>
    <span class="amt">
      <span class="n num">${vista.txt}</span>
      <span class="sub">${vista.sub ? esc(vista.sub) : dispDate(i.fecha)}</span>
    </span>
  </button>`;
}

function bindInversiones(){
  const nueva = $("#btnNuevaInv");
  if(nueva) nueva.onclick = () => modalInversion(null);
  $$("[data-inv]").forEach(b => b.onclick = () => modalInversion(b.dataset.inv));
  $$("[data-broker]").forEach(b => b.onclick = () => { state.filtroBroker = b.dataset.broker; render(); });
}
