  const enPatrimonio = cuentasActivas().filter(c => c.enPatrimonio);
  const fuera = cuentasActivas().filter(c => !c.enPatrimonio);

  const filaSaldo = c => filaSaldoCuenta(c, saldos[c.id], 0);   // el % vive en Patrimonio

  return `
    <h2 class="tab-title">Resumen</h2>

    <div class="hero">
      <div class="lbl">Patrimonio hoy</div>
      <div class="v num">${state.cur === "USD" ? fmt(p.usd, "USD", 0) : fmt(p.ars, "ARS", 0)}</div>
      ${state.cur === "ambas" ? `<div class="u num">${fmt(p.usd, "USD", 0)}</div>` : ""}
      <div class="u">${enPatrimonio.length} ${enPatrimonio.length === 1 ? "cuenta" : "cuentas"} en patrimonio${faltan(p) ? ` · ${faltan(p)} sin cotización` : ""}</div>
    </div>

    <div class="mesnav">
      <button data-mes="-1" title="Mes anterior">‹</button>
      <span class="m">${mesLabel(state.mes)}</span>
      <span style="display:flex;gap:6px;align-items:center">
        ${state.mes !== mesActual() ? `<button class="hoy" data-mes="hoy">Hoy</button>` : ""}
        <button data-mes="1" title="Mes siguiente">›</button>
      </span>
    </div>
    ${bloqueTotales(movsMes)}
    ${cardGrafico(movsMes)}

    <div class="card">
      <div class="card-head"><h3>Saldo por cuenta</h3><span class="tag">hoy</span></div>
      <div style="margin-top:6px">
        ${enPatrimonio.length ? enPatrimonio.map(filaSaldo).join("") : `<div class="empty"><div class="s">Ninguna cuenta activa suma al patrimonio.</div></div>`}
      </div>
      ${fuera.length ? `<p class="hint" style="margin:12px 0 4px">Fuera del patrimonio</p>${fuera.map(filaSaldo).join("")}` : ""}
    </div>

    <button class="fab" id="fabNuevo" title="Nuevo movimiento">＋</button>`;
}

/* Gráfico de barras por categoría (sin librerías) */
function cardGrafico(movsMes){
  const tipo = state.grafico === "Ingreso" ? "Ingreso" : "Egreso";
  const map = {};
  for(const m of movsMes){
    if(m.tipo !== tipo) continue;
    const k = m.categoria || "";
    if(!map[k]) map[k] = Object.assign(acum(), {id:k});
    sumar(map[k], m.monto, m.moneda, tcDe(m));
  }
  const enUsd  = state.cur === "USD";
  const filas  = Object.values(map).sort((a,b) => (enUsd ? b.usd - a.usd : b.ars - a.ars));
  const sinCot = filas.reduce((a,f) => a + faltan(f), 0);
  const total  = filas.reduce((a,x) => a + (enUsd ? x.usd : x.ars), 0);

  const pills = ["Egreso","Ingreso"].map(t =>
    `<button class="pill ${tipo===t?"on":""}" data-graf="${t}">${t}s</button>`).join("");

  let cuerpo;
  if(!filas.length){
    cuerpo = `<div class="empty" style="padding:20px 10px"><div class="s">Sin ${tipo.toLowerCase()}s en ${mesLabel(state.mes)}.</div></div>`;
  }else{
    cuerpo = `<div class="bars">` + filas.map(f => {
      const cat = catPorId(f.id);
      const v   = enUsd ? f.usd : f.ars;
      const pct = total ? Math.round(v / total * 100) : 0;
      const val = fmt(v, enUsd ? "USD" : "ARS", 0);
      return `<div class="bar">
        <div class="bl">
          <span class="dot" style="background:${esc(cat ? cat.color : COLOR_DEFAULT)}"></span>
          <span class="nm">${esc(cat ? cat.nombre : "Sin categoría")}</span>
          <span class="pct">${pct}%</span>
          <span class="val num">${val}</span>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${esc(cat ? cat.color : COLOR_DEFAULT)}"></div></div>
      </div>`;
    }).join("") + `</div>`;
  }

  return `
  <div class="card">
    <div class="card-head"><h3>Por categoría</h3><span style="display:flex;gap:6px">${pills}</span></div>
    ${cuerpo}
    ${sinCot ? `<p class="hint" style="margin:10px 0 0">${sinCot} ${sinCot === 1 ? "movimiento quedó" : "movimientos quedaron"} fuera por no tener cotización.</p>` : ""}
  </div>`;
}

function bindResumen(){
  $$("[data-mes]").forEach(b => b.onclick = () => {
    state.mes = b.dataset.mes === "hoy" ? mesActual() : mesShift(state.mes, +b.dataset.mes);
    render();
  });
  $$("[data-graf]").forEach(b => b.onclick = () => { state.grafico = b.dataset.graf; render(); });
  const fab = $("#fabNuevo");
  if(fab) fab.onclick = () => modalMovimiento(null);
}

/* ══════════════════════ INVERSIONES ══════════════════════ */
function viewInversiones(){
  if(!state.conectado){
    return `<h2 class="tab-title">Inversiones</h2>
      <div class="card"><div class="empty">
        <div class="big">🔌</div><div class="t">Sin conexión</div>
        <div class="s">Conectá tu backend en <b>Ajustes</b> para cargar tus tenencias.</div>
      </div></div>`;
  }
  if(!state.inversiones.length){
    return `<h2 class="tab-title">Inversiones</h2>
      <div class="card"><div class="empty">
        <div class="big">📈</div>
        <div class="t">Todavía no hay tenencias</div>
        <div class="s">Cargá lo que tenés en cada broker (especie, cantidad y precio actual). Suman al patrimonio automáticamente.</div>
        <div class="btn-row" style="justify-content:center"><button class="btn primary sm" id="btnNuevaInv">＋ Nueva tenencia</button></div>
      </div></div>`;
  }

  const t = totalInversiones();

  /* Composición por tipo de activo */
  const porTipo = {};
  for(const i of state.inversiones){
    const k = i.tipoActivo || "otro";
    if(!porTipo[k]) porTipo[k] = Object.assign(acum(), {nombre:activoInfo(k).l, color:activoInfo(k).color});
    sumar(porTipo[k], valorInversion(i), i.moneda, rate());
  }
  const filasTipo = Object.values(porTipo).sort((a,b) => (state.cur === "USD" ? b.usd - a.usd : b.ars - a.ars));

  /* Detalle agrupado por broker */
  const brokers = {};
  for(const i of state.inversiones){
    const k = i.broker || "Sin broker";
    (brokers[k] || (brokers[k] = [])).push(i);
  }
  const detalle = Object.keys(brokers).sort((a,b) => a.localeCompare(b, "es")).map(b => {
    const sub = acum();
    brokers[b].forEach(i => sumar(sub, valorInversion(i), i.moneda, rate()));
    return `
      <div class="card">
        <div class="card-head">
          <h3>${esc(b)}</h3>
          <span class="num" style="font-weight:700;font-size:14px">${totalVista(sub.ars, sub.usd)}</span>
        </div>
        <div style="margin-top:6px">${brokers[b].map(filaInversion).join("")}</div>
      </div>`;
  }).join("");

  return `
    <h2 class="tab-title">Inversiones</h2>

    <div class="hero">
      <div class="lbl">Total en tenencias</div>
      <div class="v num">${state.cur === "USD" ? fmt(t.usd, "USD", 0) : fmt(t.ars, "ARS", 0)}</div>
      ${state.cur === "ambas" ? `<div class="u num">${fmt(t.usd, "USD", 0)}</div>` : ""}
      <div class="u">${state.inversiones.length} ${state.inversiones.length === 1 ? "tenencia" : "tenencias"}${faltan(t) ? ` · ${faltan(t)} sin cotización` : ""}</div>
    </div>

    ${cardComposicion("Por tipo de activo", filasTipo)}
    ${detalle}

    <button class="fab" id="btnNuevaInv" title="Nueva tenencia">＋</button>`;
}

function filaInversion(i){
  const info  = activoInfo(i.tipoActivo);
  const vista = montoVista(valorInversion(i), i.moneda, rate());
  const detalle = `${nf(i.cantidad)} × ${fmt(i.precioActual, i.moneda)}`;
  return `
  <button class="mov" data-inv="${esc(i.id)}"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
    <span class="dot" style="background:${esc(info.color)}"></span>
    <span class="info">
      <span class="cpt">${esc(i.especie || i.descripcion)}</span>
      <span class="meta">
        <span class="tag">${esc(info.l)}</span>
        ${i.especie && i.descripcion ? `<span class="tag">${esc(i.descripcion)}</span>` : ""}
        <span class="tag">${esc(detalle)}</span>
      </span>
    </span>
    <span class="amt">
      <span class="n num">${vista.txt}</span>
      <span class="sub">${vista.sub ? esc(vista.sub) : dispDate(i.fecha)}</span>
    </span>
  </button>`;
}

function bindInversiones(){
  const nueva = $("#btnNuevaInv");
  if(nueva) nueva.onclick = () => modalInversion(null);
  $$("[data-inv]").forEach(b => b.onclick = () => modalInversion(b.dataset.inv));
}

function modalInversion(id){
  const i = id ? state.inversiones.find(x => x.id === id) : null;
  const brokers = [...new Set(state.inversiones.map(x => x.broker).filter(Boolean))];

  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ovInv">
    <div class="modal">
      <button class="close" id="mClose">×</button>
      <h3>${i ? "Editar tenencia" : "Nueva tenencia"}</h3>
      <p class="hint">Valuación manual: cargá el precio actual y el valor se calcula solo.</p>

      <div class="row2">
        <div>
          <label class="f" for="iBroker">Broker</label>
          <input class="f" id="iBroker" list="listaBrokers" placeholder="PPI, Balanz…" autocomplete="off" value="${i ? esc(i.broker) : ""}">
          <datalist id="listaBrokers">${brokers.map(b => `<option value="${esc(b)}"></option>`).join("")}</datalist>
        </div>
        <div>
          <label class="f" for="iTipo">Tipo de activo</label>
          <select class="f" id="iTipo">
            ${TIPOS_ACTIVO.map(t => `<option value="${t.v}" ${i && i.tipoActivo === t.v ? "selected" : ""}>${t.l}</option>`).join("")}
          </select>
        </div>
      </div>

      <label class="f" for="iEspecie">Especie</label>
      <input class="f" id="iEspecie" placeholder="AL30, AAPL, BTC…" autocomplete="off" value="${i ? esc(i.especie) : ""}">

      <label class="f" for="iDescripcion">Descripción (opcional)</label>
      <input class="f" id="iDescripcion" placeholder="Bonar 2030" autocomplete="off" value="${i ? esc(i.descripcion) : ""}">

      <div class="row2">
        <div>
          <label class="f" for="iCantidad">Cantidad</label>
          <input class="f num" id="iCantidad" type="number" step="any" min="0" inputmode="decimal" value="${i ? esc(i.cantidad) : ""}" placeholder="0">
        </div>
        <div>
          <label class="f" for="iMoneda">Moneda</label>
          <select class="f" id="iMoneda">
            <option value="ARS" ${i && i.moneda === "ARS" ? "selected" : ""}>ARS</option>
            <option value="USD" ${i && i.moneda === "USD" ? "selected" : ""}>USD</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="f" for="iPrecio">Precio actual</label>
          <div class="inputmon">
            <span class="sim" id="iSim">$</span>
            <input class="f num" id="iPrecio" type="number" step="any" min="0" inputmode="decimal" value="${i ? esc(i.precioActual) : ""}" placeholder="0">
          </div>
        </div>
        <div>
          <label class="f" for="iFecha">Fecha de valuación</label>
          <input class="f" id="iFecha" type="date" value="${i && i.fecha ? esc(isoDate(i.fecha)) : todayIso()}">
        </div>
      </div>

      <div class="tcinfo" id="iValor"></div>

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
      ${i ? `<div class="btn-row"><button class="btn danger block" id="mBorrar">Borrar tenencia</button></div>` : ""}
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovInv").onclick = e => { if(e.target.id === "ovInv") cerrar(); };
  setTimeout(() => { const el = $("#iEspecie"); if(el) el.focus(); }, 50);

  function sync(){
    const moneda = $("#iMoneda").value;
    const valor  = (parseFloat($("#iCantidad").value) || 0) * (parseFloat($("#iPrecio").value) || 0);
    $("#iSim").textContent = simbolo(moneda).trim();
    const otra = convertir(valor, moneda, moneda === "ARS" ? "USD" : "ARS", rate());
    $("#iValor").innerHTML = `Valor de la tenencia: <b>${fmt(valor, moneda)}</b>` +
      (otra != null ? ` · ${fmt(otra, moneda === "ARS" ? "USD" : "ARS")} al dólar de hoy` : "");
  }
  ["#iCantidad","#iPrecio","#iMoneda"].forEach(sel => { const el = $(sel); el.oninput = sync; el.onchange = sync; });
  sync();

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const especie = $("#iEspecie").value.trim();
    const descripcion = $("#iDescripcion").value.trim();
    if(!especie && !descripcion){ toast("Poné al menos la especie"); $("#iEspecie").focus(); return; }
    const cantidad = parseFloat($("#iCantidad").value) || 0;
    const precioActual = parseFloat($("#iPrecio").value) || 0;
    if(cantidad < 0 || precioActual < 0){ toast("Cantidad y precio no pueden ser negativos"); return; }

    const inversion = {
      id: i ? i.id : uid(),
      broker: $("#iBroker").value.trim(),
      especie, descripcion,
      tipoActivo: $("#iTipo").value,
      cantidad, precioActual,
      moneda: $("#iMoneda").value,
      valorActual: cantidad * precioActual,
      fecha: $("#iFecha").value || todayIso()
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveInversion", inversion});
      const k = state.inversiones.findIndex(x => x.id === inversion.id);
      if(k >= 0) state.inversiones[k] = inversion; else state.inversiones.push(inversion);
      cerrar(); render();
      toast(i ? "Tenencia actualizada" : "Tenencia cargada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };

  const btnBorrar = $("#mBorrar");
  if(btnBorrar) btnBorrar.onclick = async (ev) => {
    if(!confirm(`¿Borrar "${i.especie || i.descripcion}"?`)) return;
    const b = ev.currentTarget;
    b.disabled = true; b.textContent = "Borrando…";
    try{
      await api({action:"deleteInversion", id:i.id});
      state.inversiones = state.inversiones.filter(x => x.id !== i.id);
      cerrar(); render();
      toast("Tenencia borrada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Borrar tenencia";
    }
  };
}

/* ══════════════════════ PATRIMONIO ══════════════════════ */
function viewPatrimonio(){
  if(!state.conectado){
    return `<h2 class="tab-title">Patrimonio</h2>
      <div class="card"><div class="empty">
        <div class="big">🔌</div><div class="t">Sin conexión</div>
        <div class="s">Conectá tu backend en <b>Ajustes</b> para ver tu patrimonio.</div>
      </div></div>`;
  }
  if(!cuentasActivas().length){
    return `<h2 class="tab-title">Patrimonio</h2>
      <div class="card"><div class="empty">
        <div class="big">🏦</div><div class="t">Todavía no hay cuentas</div>
        <div class="s">El patrimonio se arma con el saldo de tus cuentas. Creá la primera en <b>Ajustes</b>.</div>
      </div></div>`;
  }

  const saldos = saldosPorCuenta();
  const p      = patrimonio();
  const enPat  = cuentasActivas().filter(c => c.enPatrimonio);
  const fuera  = cuentasActivas().filter(c => !c.enPatrimonio);

  /* Valor de cada cuenta en ARS y USD, al dólar de hoy */
  const valorDe = c => ({
    ars: convertir(saldos[c.id], c.moneda, "ARS", rate()),
    usd: convertir(saldos[c.id], c.moneda, "USD", rate())
  });

  /* Composición sobre todo lo que suma: cuentas + tenencias */
  const activos = activosPatrimonio();
  const grupos = (claveDe, infoDe) => {
    const map = {};
    for(const a of activos){
      const k = claveDe(a);
      if(!map[k]) map[k] = Object.assign(acum(), infoDe(k));
      sumar(map[k], a.monto, a.moneda, rate());
    }
    return Object.values(map).sort((a,b) => (state.cur === "USD" ? b.usd - a.usd : b.ars - a.ars));
  };

  const porMoneda = grupos(a => a.moneda,
    k => ({nombre:k === "USD" ? "Dólares" : "Pesos", color:k === "USD" ? COLOR_USD : COLOR_ARS}));
  const porTipo = grupos(a => a.tipo,
    k => ({nombre:tipoInfo(k).l, color:tipoInfo(k).color}));

  const totalFuera = fuera.reduce((a,c) => { const v = valorDe(c); return a + (v.ars || 0); }, 0);
  const totalFueraUsd = fuera.reduce((a,c) => { const v = valorDe(c); return a + (v.usd || 0); }, 0);

  /* Detalle agrupado por tipo de cuenta */
  const detalle = TIPOS_CUENTA.map(t => {
    const cuentas = enPat.filter(c => c.tipo === t.v);
    if(!cuentas.length) return "";
    return `<p class="hint" style="margin:14px 0 2px">${t.ic} ${t.l}</p>` +
      cuentas.map(c => filaSaldoCuenta(c, saldos[c.id], p.ars)).join("");
  }).join("");

  return `
    <h2 class="tab-title">Patrimonio</h2>

    <div class="hero">
      <div class="lbl">Total hoy</div>
      <div class="v num">${state.cur === "USD" ? fmt(p.usd, "USD", 0) : fmt(p.ars, "ARS", 0)}</div>
      ${state.cur === "ambas" ? `<div class="u num">${fmt(p.usd, "USD", 0)}</div>` : ""}
      <div class="u">${enPat.length} ${enPat.length === 1 ? "cuenta" : "cuentas"}${state.inversiones.length ? ` · ${state.inversiones.length} ${state.inversiones.length === 1 ? "tenencia" : "tenencias"}` : ""}${rate() ? ` · dólar de hoy $${nf(rate(), 0)}` : " · sin cotización"}</div>
    </div>

    ${cardComposicion("Por moneda", porMoneda)}
    ${cardComposicion("Por tipo de cuenta", porTipo)}

    <div class="card">
      <div class="card-head"><h3>Detalle por cuenta</h3><span class="tag">hoy</span></div>
      ${detalle || `<div class="empty"><div class="s">Ninguna cuenta suma al patrimonio.</div></div>`}
    </div>

    ${fuera.length ? `
    <div class="card">
      <div class="card-head">
        <div>
          <h3>Fuera del patrimonio</h3>
          <p class="hint" style="margin-bottom:0">Cuentas con <b>EnPatrimonio</b> desactivado (normalmente tarjetas).</p>
        </div>
      </div>
      <div style="margin-top:8px">${fuera.map(c => filaSaldoCuenta(c, saldos[c.id], 0)).join("")}</div>
      <div class="item" style="border-top:1px solid var(--line);border-bottom:none;margin-top:4px">
        <span class="nm" style="color:var(--muted)">Total</span>
        <span class="num" style="font-weight:700;text-align:right">${totalVista(totalFuera, totalFueraUsd)}</span>
      </div>
      ${totalFuera < 0 ? `<p class="hint" style="margin:10px 0 0">Patrimonio neto descontando estas cuentas: <b>${state.cur === "USD" ? fmt(p.usd + totalFueraUsd, "USD", 0) : fmt(p.ars + totalFuera, "ARS", 0)}</b>.</p>` : ""}
    </div>` : ""}

    ${(() => {
      const conSaldo = state.cuentas.filter(c => c.activo === false && saldos[c.id]);
      if(!conSaldo.length) return "";
      return `
      <div class="card">
        <div class="card-head"><h3>Cuentas archivadas con saldo</h3></div>
        <p class="hint">No suman al patrimonio. Si todavía tenés esa plata, reactivalas en Ajustes; si la cuenta se cerró, cargá el movimiento que la vació.</p>
        <div>${conSaldo.map(c => filaSaldoCuenta(c, saldos[c.id], 0)).join("")}</div>
      </div>`;
    })()}

    ${cardInversionesEnPatrimonio()}`;
}

/** Las tenencias dentro del patrimonio: total por broker y aviso de doble conteo. */
function cardInversionesEnPatrimonio(){
  if(!state.inversiones.length){
    return `
    <div class="card">
      <div class="card-head"><h3>Inversiones</h3></div>
      <p class="hint" style="margin-bottom:0">Todavía no hay tenencias cargadas. Las que cargues en <b>Inversiones</b> suman acá y al total de arriba.</p>
    </div>`;
  }
  const t = totalInversiones();
  const porBroker = {};
  for(const i of state.inversiones){
    const k = i.broker || "Sin broker";
    if(!porBroker[k]) porBroker[k] = Object.assign(acum(), {nombre:k});
    sumar(porBroker[k], valorInversion(i), i.moneda, rate());
  }
  const filas = Object.values(porBroker)
    .sort((a,b) => (state.cur === "USD" ? b.usd - a.usd : b.ars - a.ars))
    .map(b => `<div class="item">
      <span style="width:20px;text-align:center;flex-shrink:0">📈</span>
      <span class="nm">${esc(b.nombre)}</span>
      <span class="num" style="font-weight:600;font-size:14px;text-align:right">${totalVista(b.ars, b.usd)}</span>
    </div>`).join("");

  // Una cuenta de tipo Inversión con saldo, más tenencias cargadas, puede estar contando dos veces lo mismo.
  const cuentasInv = cuentasActivas().filter(c => c.enPatrimonio && c.tipo === "inversion" && saldosPorCuenta()[c.id] !== 0);

  return `
  <div class="card">
    <div class="card-head">
      <h3>Inversiones</h3>
      <span class="num" style="font-weight:700;font-size:14px;text-align:right">${totalVista(t.ars, t.usd)}</span>
    </div>
    <div style="margin-top:6px">${filas}</div>
    ${cuentasInv.length ? `<p class="hint" style="margin:12px 0 0">Ojo: ${cuentasInv.map(c => `<b>${esc(c.nombre)}</b>`).join(", ")} ${cuentasInv.length === 1 ? "es una cuenta" : "son cuentas"} de tipo Inversión con saldo. Si ${cuentasInv.length === 1 ? "representa" : "representan"} lo mismo que estas tenencias, el patrimonio lo está contando dos veces: desmarcá <b>Suma al patrimonio</b> en esa cuenta o dejá una sola de las dos fuentes.</p>` : ""}
  </div>`;
}

/** Fila de cuenta con su saldo y, si se pasa el total, su peso en el patrimonio. */
function filaSaldoCuenta(c, saldo, totalArs){
  const vista = montoVista(saldo, c.moneda, rate());
  const ars   = convertir(saldo, c.moneda, "ARS", rate());
  const pct   = (totalArs > 0 && ars != null && ars > 0) ? Math.round(ars / totalArs * 100) : null;
  return `<div class="item">
    <span style="width:20px;text-align:center;flex-shrink:0">${tipoInfo(c.tipo).ic}</span>
    <span class="nm">${esc(c.nombre)}</span>
    ${pct != null ? `<span class="tag">${pct}%</span>` : ""}
    <span style="text-align:right;flex-shrink:0"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
      <span class="num" style="font-weight:600;font-size:14px;display:block">${vista.txt}</span>
      ${vista.sub ? `<span style="font-size:10.5px;color:var(--faint)">${esc(vista.sub)}</span>` : ""}
    </span>
  </div>`;
}

/** Tarjeta de composición: barras con el peso de cada grupo. */
function cardComposicion(titulo, filasTodas){
  const enUsd = state.cur === "USD";
  const valor = f => enUsd ? f.usd : f.ars;
  // Un grupo que no se pudo convertir no se muestra en cero: se avisa aparte.
  const filas    = filasTodas.filter(f => valor(f) !== 0 || !faltan(f));
  const omitidos = filasTodas.length - filas.length;
  const total    = filas.reduce((a,f) => a + Math.max(0, valor(f)), 0);
  if(!filas.length || total <= 0){
    return `<div class="card">
      <div class="card-head"><h3>${esc(titulo)}</h3></div>
      <div class="empty" style="padding:18px 10px"><div class="s">Sin saldos positivos para repartir.</div></div>
    </div>`;
  }
  const barras = filas.map(f => {
    const pct = Math.round(Math.max(0, valor(f)) / total * 100);
    const val = fmt(valor(f), enUsd ? "USD" : "ARS", 0);
    return `<div class="bar">
      <div class="bl">
        <span class="dot" style="background:${esc(f.color)}"></span>
        <span class="nm">${esc(f.nombre)}</span>
        <span class="pct">${pct}%</span>
        <span class="val num">${val}</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${esc(f.color)}"></div></div>
    </div>`;
  }).join("");
  return `<div class="card">
    <div class="card-head"><h3>${esc(titulo)}</h3></div>
    <div class="bars">${barras}</div>
    ${omitidos ? `<p class="hint" style="margin:12px 0 0">${omitidos} ${omitidos === 1 ? "grupo quedó" : "grupos quedaron"} fuera: sin cotización para expresarlo${omitidos === 1 ? "" : "s"} en ${state.cur === "USD" ? "dólares" : "pesos"}.</p>` : ""}
  </div>`;
}

/* ══════════════════════ IMPORTACIÓN DE RESÚMENES ══════════════════════ */
function modalImportar(){
  const est = { datos:null, filas:[], periodo:"", cuentaArs:"", cuentaUsd:"", archivo:"", crearReglas:true };

  $("#modalRoot").innerHTML = `<div class="overlay" id="ovImp"><div class="modal wide" id="impBody"></div></div>`;
  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#ovImp").onclick = e => { if(e.target.id === "ovImp") cerrar(); };

  /* ── Paso 1: archivo ── */
  function vistaArchivo(){
    return `
      <button class="close" id="mClose">×</button>
      <h3>Importar resumen de tarjeta</h3>
      <p class="hint">Excel (<b>.xlsx</b>) del resumen de Amex o Visa. El archivo se lee en tu navegador: no se sube a ningún lado.</p>
      <div class="drop" id="dropZone">
        <span class="big">⬆</span>
        Arrastrá el archivo acá o tocá para elegirlo
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
      <p class="hint" style="margin-top:14px">Los PDF de banco y broker todavía no: por ahora sólo resúmenes de tarjeta en Excel.</p>`;
  }

  function bindArchivo(){
    $("#mClose").onclick = cerrar;
    const zona = $("#dropZone"), input = $("#fileInput");
    zona.onclick = () => input.click();
    input.onchange = () => { if(input.files[0]) leerArchivo(input.files[0]); };
    zona.ondragover = e => { e.preventDefault(); zona.classList.add("over"); };
    zona.ondragleave = () => zona.classList.remove("over");
    zona.ondrop = e => {
      e.preventDefault(); zona.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if(f) leerArchivo(f);
    };
  }

  async function leerArchivo(file){
    if(typeof XLSX === "undefined"){ toast("El lector de Excel todavía está cargando, probá en un segundo"); return; }
    try{
      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf, {type:"array"});
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
      const { lineas, meta } = parseTarjeta(aoa);
      if(!lineas.length){ toast("No encontré consumos en ese archivo"); return; }
      const info = detectarEmisor(aoa);
      est.datos   = { ...info, lineas, meta };
      est.archivo = file.name;
      est.periodo = meta.periodo || mesActual();
      elegirCuentas();
      construirFilas();
      pintar();
    }catch(e){ toast("No pude leer el archivo: " + e.message); }
  }

  /* Autocompleta las cuentas de la tarjeta: por número, por emisor, o la primera del tipo. */
  function elegirCuentas(){
    const tarjetas = cuentasActivas().filter(c => c.tipo === "tarjeta");
    const buscar = mon => {
      const cand = tarjetas.filter(c => c.moneda === mon);
      const porNumero = est.datos.numero ? cand.find(c => c.nombre.includes(est.datos.numero)) : null;
      const porEmisor = cand.find(c => c.nombre.toLowerCase().includes(est.datos.emisor.toLowerCase()));
      return ((porNumero || porEmisor || cand[0]) || {}).id || "";
    };
    est.cuentaArs = buscar("ARS");
    est.cuentaUsd = buscar("USD");
  }

  function construirFilas(){
    est.filas = est.datos.lineas.map((l, i) => {
      const concepto = l.desc + textoCuotas(l.cuotas);
      const regla = aplicarReglas(concepto);
      return {
        i, fecha:l.fechaIso, concepto, moneda:l.moneda,
        monto: Math.abs(l.importe),
        tipo: l.importe < 0 ? "Ingreso" : "Egreso",   // negativo = pago o devolución
        esPago: l.importe < 0,
        esImpuesto: !!l.impuesto,
        categoria: (regla && regla.categoria) || "",
        reglaId: regla ? regla.id : "",
        categoriaManual: false,
        sel: true
      };
    });
    revisarDuplicados();
  }

  /** Recalcula el hash con la cuenta elegida y marca lo que ya está cargado. */
  function revisarDuplicados(){
    const existentes = new Set(state.movimientos.map(m => m.hash || calcHash(m)));
    for(const f of est.filas){
      f.cuenta = f.moneda === "USD" ? est.cuentaUsd : est.cuentaArs;
      f.hash = calcHash({fecha:f.fecha, monto:f.monto, concepto:f.concepto, cuenta:f.cuenta});
      f.dup = existentes.has(f.hash);
      if(f.dup) f.sel = false;
    }
  }

  /* ── Paso 2: mapeo + preview ── */
  function optCuentasTarjeta(mon, sel){
    const cand = cuentasActivas().filter(c => c.moneda === mon);
    return `<option value="">— elegir cuenta ${mon} —</option>` + cand.map(c =>
      `<option value="${esc(c.id)}" ${sel === c.id ? "selected" : ""}>${esc(c.nombre)}${c.tipo === "tarjeta" ? "" : " · " + tipoInfo(c.tipo).l}</option>`).join("");
  }

  function vistaPreview(){
    const { meta } = est.datos;
    const hayUsd = est.filas.some(f => f.moneda === "USD");
    const dups   = est.filas.filter(f => f.dup).length;
    const aImportar = est.filas.filter(f => f.sel && !f.dup).length;
    const manuales  = est.filas.filter(f => f.categoriaManual && f.categoria && f.sel && !f.dup).length;

    // Conciliación informativa contra el total del resumen
    const sumaArs = est.datos.lineas.filter(l => l.moneda === "ARS").reduce((a,l) => a + l.importe, 0);
    const sumaUsd = est.datos.lineas.filter(l => l.moneda === "USD").reduce((a,l) => a + l.importe, 0);
    const difArs = meta.totalPesos != null ? Math.abs(sumaArs - meta.totalPesos) : 0;
    const difUsd = meta.totalUsd  != null ? Math.abs(sumaUsd - meta.totalUsd)  : 0;
    const concilia = difArs < 1 && difUsd < 0.05;

    const filasHtml = est.filas.map(f => {
      const cats = catsPara(f.tipo);
      const opts = `<option value="">Sin categoría</option>` + cats.map(c =>
        `<option value="${esc(c.id)}" ${f.categoria === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("");
      const chip = f.esImpuesto ? `<span class="tag">impuesto</span>` : (f.esPago ? `<span class="tag ok">pago</span>` : "");
      return `
      <tr class="${f.dup ? "dup" : ""}">
        <td><input type="checkbox" data-sel="${f.i}" ${f.sel ? "checked" : ""} ${f.dup ? "disabled" : ""}></td>
        <td>${dispDate(f.fecha)}</td>
        <td>${esc(f.concepto)} ${chip}${f.dup ? ` <span class="tag off">ya está</span>` : ""}</td>
        <td class="num ${f.esPago ? "pos" : "neg"}">${f.esPago ? "+" : "−"}${fmt(f.monto, f.moneda)}</td>
        <td><span class="tag ${f.moneda === "USD" ? "usd" : ""}">${f.moneda}</span></td>
        <td><select data-cat="${f.i}">${opts}</select></td>
      </tr>`;
    }).join("");

    return `
      <button class="close" id="mClose">×</button>
      <h3>${esc(est.datos.emisor)}${est.datos.numero ? " ·· " + esc(est.datos.numero) : ""}</h3>
      <p class="hint">${esc(est.archivo)} · ${est.datos.lineas.length} líneas detectadas</p>

      <div class="resumen-meta">
        ${meta.totalPesos != null ? `<span class="m">Total a pagar<b>${fmt(meta.totalPesos, "ARS")}</b></span>` : ""}
        ${meta.totalUsd ? `<span class="m">En dólares<b>${fmt(meta.totalUsd, "USD")}</b></span>` : ""}
        ${meta.cierreIso ? `<span class="m">Cierre<b>${dispDate(meta.cierreIso)}</b></span>` : ""}
        ${meta.vencIso ? `<span class="m">Vencimiento<b>${dispDate(meta.vencIso)}</b></span>` : ""}
      </div>
      ${meta.totalPesos != null ? `<p class="hint" style="margin:2px 0 10px">${concilia
        ? "✓ Las líneas suman exactamente el total del resumen."
        : `Las líneas suman ${fmt(sumaArs, "ARS")}${meta.totalUsd ? " / " + fmt(sumaUsd, "USD") : ""} contra el total del resumen. Revisá antes de confirmar.`}</p>` : ""}

      <div class="row2">
        <div>
          <label class="f" for="impCuentaArs">Cuenta de la tarjeta (pesos)</label>
          <select class="f" id="impCuentaArs">${optCuentasTarjeta("ARS", est.cuentaArs)}</select>
        </div>
        <div>
          <label class="f" for="impPeriodo">Período del resumen</label>
          <input class="f" id="impPeriodo" type="month" value="${esc(est.periodo)}">
        </div>
      </div>
      ${hayUsd ? `
      <label class="f" for="impCuentaUsd">Cuenta de la tarjeta (dólares)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="f" id="impCuentaUsd">${optCuentasTarjeta("USD", est.cuentaUsd)}</select>
        ${!est.cuentaUsd ? `<button class="btn ghost sm" id="btnCrearUsd" style="flex-shrink:0;white-space:nowrap">Crear cuenta USD</button>` : ""}
      </div>` : ""}

      <div class="tblwrap">
        <table class="tbl">
          <thead><tr>
            <th><input type="checkbox" id="selTodos" ${aImportar && aImportar === est.filas.filter(f => !f.dup).length ? "checked" : ""}></th>
            <th>Fecha</th><th>Concepto</th><th style="text-align:right">Monto</th><th>Moneda</th><th>Categoría</th>
          </tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>

      <p class="hint" style="margin:10px 0 0">${aImportar} de ${est.filas.length} para importar${dups ? ` · ${dups} ya estaban cargadas` : ""}.</p>
      ${manuales ? `<label class="check"><input type="checkbox" id="impCrearReglas" ${est.crearReglas ? "checked" : ""}> Crear reglas para las ${manuales} categorías que asigné a mano</label>` : ""}

      <div class="btn-row" style="margin-top:16px">
        <button class="btn primary block" id="btnImportar" ${aImportar ? "" : "disabled"}>Importar ${aImportar} movimiento${aImportar === 1 ? "" : "s"}</button>
      </div>`;
  }

  function bindPreview(){
    $("#mClose").onclick = cerrar;

    $("#impCuentaArs").onchange = e => { est.cuentaArs = e.target.value; revisarDuplicados(); pintar(); };
    const selUsd = $("#impCuentaUsd");
    if(selUsd) selUsd.onchange = e => { est.cuentaUsd = e.target.value; revisarDuplicados(); pintar(); };
    $("#impPeriodo").onchange = e => { est.periodo = e.target.value; };

    const btnUsd = $("#btnCrearUsd");
    if(btnUsd) btnUsd.onclick = ev => crearCuentaUsd(ev.currentTarget);

    $("#selTodos").onchange = e => {
      est.filas.forEach(f => { if(!f.dup) f.sel = e.target.checked; });
      pintar();
    };
    $$("[data-sel]").forEach(ch => ch.onchange = () => {
      const f = est.filas[+ch.dataset.sel];
      f.sel = ch.checked;
      pintar();
    });
    $$("[data-cat]").forEach(sel => sel.onchange = () => {
      const f = est.filas[+sel.dataset.cat];
      f.categoria = sel.value;
      f.categoriaManual = true;
      pintar();
    });
    const chkReglas = $("#impCrearReglas");
    if(chkReglas) chkReglas.onchange = e => { est.crearReglas = e.target.checked; };

    $("#btnImportar").onclick = ev => confirmar(ev.currentTarget);
  }

  async function crearCuentaUsd(btn){
    const nombre = `${est.datos.emisor}${est.datos.numero ? " " + est.datos.numero : ""} USD`;
    const cuenta = {
      id: uid(), nombre, tipo:"tarjeta", moneda:"USD",
      saldoInicial: 0, fechaInicial: todayIso(),
      enPatrimonio: false, orden: 0, activo: true
    };
    const prev = btn.textContent;
    btn.disabled = true; btn.textContent = "Creando…";
    try{
      await api({action:"saveCuenta", cuenta});
      state.cuentas.push(cuenta);
      state.cuentas = ordenarCuentas(state.cuentas);
      est.cuentaUsd = cuenta.id;
      revisarDuplicados();
      pintar();
      toast(`Cuenta "${nombre}" creada`);
    }catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = prev;
    }
  }

  async function confirmar(btn){
    const sel = est.filas.filter(f => f.sel && !f.dup);
    if(!sel.length){ toast("No hay filas para importar"); return; }
    if(sel.some(f => !f.cuenta)){
      toast(sel.some(f => f.moneda === "USD" && !f.cuenta) ? "Falta elegir la cuenta en dólares" : "Falta elegir la cuenta de la tarjeta");
      return;
    }
    btn.disabled = true; btn.textContent = "Guardando…";
    try{
      const meta = est.datos.meta;
      const obs  = `Resumen ${est.periodo}` + (meta.vencIso ? ` · vence ${dispDate(meta.vencIso)}` : "");
      const modoCredito = (state.modosPago.find(m => /cr[eé]dito/i.test(m.nombre)) || {}).nombre || "";

      // Cotizaciones: una consulta por fecha distinta, todas en paralelo
      const cots = {};
      await Promise.all([...new Set(sel.map(f => f.fecha))].map(async fecha => {
        cots[fecha] = (await mepDe(fecha)) || rate();
      }));

      const movimientos = [];
      for(const f of sel){
        const cot = cots[f.fecha];
        movimientos.push({
          id: uid(), mes: mesDe(f.fecha), fecha: f.fecha, tipo: f.tipo,
          categoria: f.categoria, concepto: f.concepto,
          cuenta: f.cuenta, cuentaDestino: "",
          moneda: f.moneda, monto: f.monto,
          monedaDestino: "", montoDestino: null,
          cotizacion: cot || null, modoPago: modoCredito, observacion: obs,
          timestamp: "", hash: f.hash, fuente: "import"
        });
      }

      const res = await api({action:"saveMovimientos", movimientos});

      // Reflejamos localmente lo que el backend efectivamente guardó
      const yaEstaban = new Set(state.movimientos.map(m => m.hash || calcHash(m)));
      movimientos.forEach(m => {
        if(!yaEstaban.has(m.hash)){
          yaEstaban.add(m.hash);
          state.movimientos.push({...m, timestamp: ahoraLocal()});
        }
      });
      state.movimientos = ordenarMovs(state.movimientos);
      if(sel.length) state.mes = mesDe(sel[0].fecha);

      await actualizarReglas(sel);

      cerrar();
      render();
      toast(`Importados ${res.guardados}${res.omitidos ? ` · ${res.omitidos} ya estaban` : ""}`);
    }catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = "Reintentar importación";
    }
  }

  /** Suma hits a las reglas que se aplicaron y crea las nuevas que pidió el usuario. */
  async function actualizarReglas(filas){
    const cambios = [];

    const hits = {};
    filas.forEach(f => { if(f.reglaId && !f.categoriaManual) hits[f.reglaId] = (hits[f.reglaId] || 0) + 1; });
    Object.keys(hits).forEach(id => {
      const r = state.reglas.find(x => x.id === id);
      if(r) cambios.push({...r, hits:(+r.hits || 0) + hits[id]});
    });

    if(est.crearReglas){
      const vistos = new Set();
      for(const f of filas){
        if(!f.categoriaManual || !f.categoria) continue;
        const patron = patronDesde(f.concepto);
        if(!patron) continue;
        const clave = patron + "|" + f.categoria;
        if(vistos.has(clave)) continue;
        vistos.add(clave);
        if(state.reglas.some(r => r.patron.toLowerCase() === patron && r.categoria === f.categoria)) continue;
        cambios.push({id:uid(), patron, tipoPatron:"contiene", categoria:f.categoria, tipo:"", prioridad:10, hits:0, activo:true});
      }
    }

    if(!cambios.length) return;
    try{
      const d = await api({action:"saveReglas", reglas:cambios});
      state.reglas = (d.reglas || []).filter(r => r.activo !== false);
    }catch(e){ /* las reglas son secundarias: no rompemos la importación */ }
  }

  function pintar(){
    $("#impBody").innerHTML = est.datos ? vistaPreview() : vistaArchivo();
    if(est.datos) bindPreview(); else bindArchivo();
  }
  pintar();
}

/* ══════════════════════ MOVIMIENTOS ══════════════════════ */
function movsVisibles(){
  const f = state.filtros;
  const txt = f.texto.trim().toLowerCase();
  return state.movimientos.filter(m => {
    if(mesDe(m.fecha) !== state.mes) return false;
    if(f.tipo !== "todos" && m.tipo !== f.tipo) return false;
    if(f.cuenta && m.cuenta !== f.cuenta && m.cuentaDestino !== f.cuenta) return false;
    if(f.categoria && m.categoria !== f.categoria) return false;
    if(txt && !((m.concepto || "") + " " + (m.observacion || "")).toLowerCase().includes(txt)) return false;
    return true;
  });
}

function viewMovimientos(){
  if(!state.conectado){
    return `<h2 class="tab-title">Movimientos</h2>
      <div class="card"><div class="empty">
        <div class="big">🔌</div><div class="t">Sin conexión</div>
        <div class="s">Conectá tu backend en <b>Ajustes</b> para cargar y ver movimientos.</div>
      </div></div>`;
  }
  if(!cuentasActivas().length){
    return `<h2 class="tab-title">Movimientos</h2>
      <div class="card"><div class="empty">
        <div class="big">🏦</div><div class="t">Primero creá una cuenta</div>
        <div class="s">Los movimientos entran o salen de una cuenta. Creá al menos una en <b>Ajustes → Cuentas</b>.</div>
      </div></div>`;
  }

  const f = state.filtros;
  const movs = movsVisibles();
  const sinCategoria = state.movimientos.filter(m => !m.categoria && m.tipo !== "Interno").length;
  const total = state.movimientos.filter(m => mesDe(m.fecha) === state.mes).length;

  const pills = ["todos"].concat(TIPOS_MOV).map(t =>
    `<button class="pill ${f.tipo===t?"on":""}" data-ftipo="${t}">${t==="todos"?"Todos":t+"s"}</button>`).join("");

  const optCuentas = `<option value="">Todas las cuentas</option>` + state.cuentas.map(c =>
    `<option value="${esc(c.id)}" ${f.cuenta===c.id?"selected":""}>${esc(c.nombre)}${c.activo === false ? " (archivada)" : ""}</option>`).join("");
  const optCats = `<option value="">Todas las categorías</option>` + state.categorias.map(c =>
    `<option value="${esc(c.id)}" ${f.categoria===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("");

  let lista;
  if(!movs.length){
    lista = `<div class="card"><div class="empty">
      <div class="big">💸</div>
      <div class="t">${total ? "Ningún movimiento con estos filtros" : "Sin movimientos en " + mesLabel(state.mes)}</div>
      <div class="s">${total ? "Probá aflojar los filtros." : "Tocá el <b>＋</b> para cargar el primero."}</div>
    </div></div>`;
  }else{
    let dia = "";
    lista = movs.map(m => {
      const hdr = m.fecha !== dia ? (dia = m.fecha, `<div class="diahdr">${dispDate(m.fecha)}</div>`) : "";
      return hdr + filaMov(m);
    }).join("");
  }

  return `
    <h2 class="tab-title">Movimientos</h2>
    <div class="btn-row" style="margin:0 0 12px">
      <button class="btn ghost sm" id="btnImportarResumen">⬆ Importar resumen</button>
      ${sinCategoria ? `<button class="btn ghost sm" id="btnAplicarReglas">✨ Aplicar reglas a ${sinCategoria} sin categoría</button>` : ""}
    </div>
    <div class="mesnav">
      <button data-mes="-1" title="Mes anterior">‹</button>
      <span class="m">${mesLabel(state.mes)}</span>
      <span style="display:flex;gap:6px;align-items:center">
        ${state.mes !== mesActual() ? `<button class="hoy" data-mes="hoy">Hoy</button>` : ""}
        <button data-mes="1" title="Mes siguiente">›</button>
      </span>
    </div>
    ${state.cur !== "ambas" && !rate() ? `<div class="avisocot">Sin cotización del día: los movimientos usan la que tienen guardada, pero los que no tengan ninguna quedan en su moneda original. Cargala en <b>Ajustes</b>.</div>` : ""}
    ${bloqueTotales(movs)}
    <div class="filtros">${pills}</div>
    <div class="filtros">
      <input id="fTexto" type="search" placeholder="Buscar concepto…" value="${esc(f.texto)}">
      <select id="fCuenta">${optCuentas}</select>
      <select id="fCategoria">${optCats}</select>
    </div>
    ${lista}
    <button class="fab" id="fabNuevo" title="Nuevo movimiento">＋</button>`;
}

function filaMov(m){
  const cat  = catPorId(m.categoria);
  const color = m.tipo === "Interno" ? "#94a3b8" : (cat ? cat.color : COLOR_DEFAULT);
  const tags = [];
  if(m.tipo !== "Interno") tags.push(`<span class="tag">${esc(cat ? cat.nombre : "Sin categoría")}</span>`);
  tags.push(`<span class="tag">${esc(m.tipo === "Interno" ? nombreCuenta(m.cuenta) + " → " + nombreCuenta(m.cuentaDestino) : nombreCuenta(m.cuenta))}</span>`);
  if(m.modoPago) tags.push(`<span class="tag">${esc(m.modoPago)}</span>`);

  let clase = "int", signo = "";
  if(m.tipo === "Ingreso"){ clase = "pos"; signo = "+"; }
  if(m.tipo === "Egreso"){  clase = "neg"; signo = "−"; }

  // Valuado con la cotización congelada del movimiento
  const vista = montoVista(m.monto, m.moneda, tcDe(m));
  let sub = vista.sub;
  if(m.tipo === "Interno" && state.cur === "ambas"){
    // En vista nativa mostramos lo que entra; convertido, ambos lados dan lo mismo.
    const cambio = m.monedaDestino && m.monedaDestino !== m.moneda;
    sub = "→ " + fmt(m.montoDestino || m.monto, m.monedaDestino || m.moneda) +
          (cambio ? " · TC " + nf(tcImplicito(m), 0) : "");
  }

  return `
  <button class="mov" data-mov="${esc(m.id)}"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
    <span class="dot" style="background:${esc(color)}"></span>
    <span class="info">
      <span class="cpt">${esc(m.concepto || "(sin concepto)")}</span>
      <span class="meta">${tags.join("")}</span>
    </span>
    <span class="amt">
      <span class="n ${clase}">${signo}${vista.txt}</span>
      ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
    </span>
  </button>`;
}

/* Totales del mes (de lo que se está viendo). Los internos no suman: mueven
   plata entre cuentas propias. Se calculan en las dos monedas y el toggle elige. */
function totalesDe(movs){
  const ing = acum(), egr = acum();
  for(const m of movs){
    if(m.tipo === "Interno") continue;
    sumar(m.tipo === "Ingreso" ? ing : egr, m.monto, m.moneda, tcDe(m));
  }
  return {ing, egr};
}

/** Un total en la(s) moneda(s) del toggle. */
function totalVista(ars, usd){
  if(state.cur === "USD") return fmt(usd, "USD", 0);
  if(state.cur === "ARS") return fmt(ars, "ARS", 0);
  return fmt(ars, "ARS", 0) + `<span class="u">${fmt(usd, "USD", 0)}</span>`;
}

function bloqueTotales(movs){
  const t = totalesDe(movs);
  const netoArs = t.ing.ars - t.egr.ars, netoUsd = t.ing.usd - t.egr.usd;
  const signoNeto = (state.cur === "USD" ? netoUsd : netoArs) < 0 ? "neg" : "pos";
  const fuera = faltan(t.ing) + faltan(t.egr);
  return `
  <div class="tot">
    <div class="b"><div class="lbl">Ingresos</div><div class="v pos">${totalVista(t.ing.ars, t.ing.usd)}</div></div>
    <div class="b"><div class="lbl">Egresos</div><div class="v neg">${totalVista(t.egr.ars, t.egr.usd)}</div></div>
    <div class="b"><div class="lbl">Neto</div><div class="v ${signoNeto}">${totalVista(netoArs, netoUsd)}</div></div>
  </div>
  ${fuera ? `<p class="hint" style="margin:-4px 2px 10px">${fuera} ${fuera === 1 ? "movimiento quedó" : "movimientos quedaron"} fuera del total por no tener cotización.</p>` : ""}`;
}

/** ARS por 1 USD implícito en un interno con cambio de moneda. */
function tcImplicito(m){
  const a = +m.monto || 0, b = +m.montoDestino || 0;
  if(!a || !b) return 0;
  if(m.moneda === "USD" && m.monedaDestino === "ARS") return b / a;   // venta de dólares
  if(m.moneda === "ARS" && m.monedaDestino === "USD") return a / b;   // compra de dólares
  return 0;
}

function bindMovimientos(){
  $$("[data-mes]").forEach(b => b.onclick = () => {
    state.mes = b.dataset.mes === "hoy" ? mesActual() : mesShift(state.mes, +b.dataset.mes);
    render();
  });
  $$("[data-ftipo]").forEach(b => b.onclick = () => { state.filtros.tipo = b.dataset.ftipo; render(); });

  const txt = $("#fTexto");
  if(txt) txt.oninput = () => {
    state.filtros.texto = txt.value;
    const pos = txt.selectionStart;
    render();
    const nuevo = $("#fTexto");
    if(nuevo){ nuevo.focus(); nuevo.setSelectionRange(pos, pos); }
  };
  const fc = $("#fCuenta");
  if(fc) fc.onchange = () => { state.filtros.cuenta = fc.value; render(); };
  const fk = $("#fCategoria");
  if(fk) fk.onchange = () => { state.filtros.categoria = fk.value; render(); };

  $$("[data-mov]").forEach(b => b.onclick = () => modalMovimiento(b.dataset.mov));
  const fab = $("#fabNuevo");
  if(fab) fab.onclick = () => modalMovimiento(null);
  const imp = $("#btnImportarResumen");
  if(imp) imp.onclick = () => modalImportar();
  const apl = $("#btnAplicarReglas");
  if(apl) apl.onclick = ev => aplicarReglasPendientes(ev.currentTarget);
}

/** Corre las reglas sobre los movimientos sin categoría y guarda los que cambian. */
async function aplicarReglasPendientes(btn){
  const pendientes = state.movimientos.filter(m => !m.categoria && m.tipo !== "Interno");
  const cambios = [], hits = {};
  for(const m of pendientes){
    const r = aplicarReglas(m.concepto);
    if(!r || !r.categoria) continue;
    cambios.push({...m, categoria:r.categoria, tipo:r.tipo || m.tipo});
    hits[r.id] = (hits[r.id] || 0) + 1;
  }
  if(!cambios.length){ toast("Ninguna regla aplica a los movimientos sin categoría"); return; }

  const prev = btn.textContent;
  btn.disabled = true;
  let ok = 0;
  for(const mov of cambios){
    btn.textContent = `Aplicando… ${ok + 1}/${cambios.length}`;
    try{
      await api({action:"saveMovimiento", mov:{...mov, hash:""}});
      const i = state.movimientos.findIndex(x => x.id === mov.id);
      if(i >= 0) state.movimientos[i] = mov;
      ok++;
    }catch(e){ toast(e.message); break; }
  }

  const actualizadas = Object.keys(hits).map(id => {
    const r = state.reglas.find(x => x.id === id);
    return r ? {...r, hits:(+r.hits || 0) + hits[id]} : null;
  }).filter(Boolean);
  if(actualizadas.length){
    try{
      const d = await api({action:"saveReglas", reglas:actualizadas});
      state.reglas = (d.reglas || []).filter(r => r.activo !== false);
    }catch(e){ /* secundario */ }
  }

  btn.disabled = false; btn.textContent = prev;
  render();
  toast(`${ok} ${ok === 1 ? "movimiento categorizado" : "movimientos categorizados"}`);
}

/* ── Alta / edición de movimiento ── */
function modalMovimiento(id){
  const m = id ? state.movimientos.find(x => x.id === id) : null;
  if(!cuentasActivas().length){ toast("Primero creá una cuenta activa en Ajustes"); return; }

  // Estado local del formulario
  let tipo = m ? m.tipo : "Egreso";

  // Sólo activas; si el movimiento que se edita usa una archivada, se incluye para no perderla al guardar.
  const usadas = m ? [m.cuenta, m.cuentaDestino].filter(Boolean) : [];

      <h3>${m ? "Editar movimiento" : "Nuevo movimiento"}</h3>

      <div class="seg" id="segTipo">
        ${TIPOS_MOV.map(t => `<button data-tipo="${t}" class="${t===tipo?"on":""}">${t}</button>`).join("")}
      </div>

      <div class="row2">
        <div>
          <label class="f" for="mFecha">Fecha</label>
          <input class="f" id="mFecha" type="date" value="${m ? esc(isoDate(m.fecha)) : todayIso()}">
        </div>
        <div>
          <label class="f" for="mMonto"><span id="lblMonto">Monto</span></label>
          <div class="inputmon">
            <span class="sim" id="simMonto">$</span>
            <input class="f num" id="mMonto" type="number" step="0.01" min="0" inputmode="decimal" value="${m ? esc(m.monto) : ""}" placeholder="0">
          </div>
        </div>
      </div>

      <label class="f" for="mCuenta"><span id="lblCuenta">Cuenta</span></label>
      <select class="f" id="mCuenta">${optCuentas(m ? m.cuenta : cuentasForm[0].id)}</select>

      <div id="bloqueDestino" class="hidden">
        <label class="f" for="mCuentaDestino">Entra en</label>
        <select class="f" id="mCuentaDestino">${optCuentas(m ? m.cuentaDestino : "")}</select>
        <div id="bloqueMontoDestino" class="hidden">
          <label class="f" for="mMontoDestino">Monto que entra</label>
          <div class="inputmon">
            <span class="sim" id="simMontoDestino">$</span>
            <input class="f num" id="mMontoDestino" type="number" step="0.01" min="0" inputmode="decimal" value="${m && m.montoDestino ? esc(m.montoDestino) : ""}" placeholder="0">
          </div>
        </div>
        <div class="tcinfo hidden" id="tcInfo"></div>
      </div>

      <div id="bloqueCategoria">
        <label class="f" for="mCategoria">Categoría</label>
        <select class="f" id="mCategoria"></select>
        <div id="bloqueRegla"></div>
      </div>

      <label class="f" for="mConcepto">Concepto</label>
      <input class="f" id="mConcepto" placeholder="Coto, sueldo, transferencia…" autocomplete="off" value="${m ? esc(m.concepto) : ""}">

      <div class="row2">
        <div>
          <label class="f" for="mModoPago">Modo de pago</label>
          <select class="f" id="mModoPago">${optModos}</select>
        </div>
        <div>
          <label class="f" for="mCotizacion">Cotización (ARS por USD)</label>
          <input class="f num" id="mCotizacion" type="number" step="0.01" min="0" value="${m && m.cotizacion ? esc(m.cotizacion) : (rate() ? esc(Math.round(rate()*100)/100) : "")}">
        </div>
      </div>
      <p class="hint" style="margin:6px 0 0">Se guarda con el movimiento para congelar su valor en la otra moneda.</p>

      <label class="f" for="mObservacion">Observación (opcional)</label>
      <input class="f" id="mObservacion" autocomplete="off" value="${m ? esc(m.observacion) : ""}">

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
      ${m ? `<div class="btn-row"><button class="btn danger block" id="mBorrar">Borrar movimiento</button></div>` : ""}
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovMov").onclick = e => { if(e.target.id === "ovMov") cerrar(); };

  /* Ajusta el formulario al tipo y a las monedas de las cuentas elegidas */
  function sync(){
    const esInterno = tipo === "Interno";
    const cuentaId  = $("#mCuenta").value;
    const moneda    = monedaCuenta(cuentaId);

    $("#simMonto").textContent = simbolo(moneda).trim();
    $("#lblMonto").textContent = esInterno ? "Monto que sale" : "Monto";
    $("#lblCuenta").textContent = tipo === "Ingreso" ? "Entra en" : esInterno ? "Sale de" : "Cuenta";

    $("#bloqueDestino").classList.toggle("hidden", !esInterno);
    $("#bloqueCategoria").classList.toggle("hidden", esInterno);

    // Categorías según el tipo (se re-arma para respetar `Aplica`)
    if(!esInterno){
      const sel = $("#mCategoria").value || (m ? m.categoria : "");
      const cats = catsPara(tipo);
      $("#mCategoria").innerHTML = cats.length
        ? `<option value="">— elegí una categoría —</option>` +
          cats.map(c => `<option value="${esc(c.id)}" ${sel===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")
        : `<option value="">(no hay categorías — creá una en Ajustes)</option>`;
    }

    if(esInterno){
      const destId  = $("#mCuentaDestino").value;
      const monDest = monedaCuenta(destId);
      const cambio  = destId && monDest !== moneda;
      $("#bloqueMontoDestino").classList.toggle("hidden", !cambio);
      $("#simMontoDestino").textContent = simbolo(monDest).trim();
      const info = $("#tcInfo");
      if(cambio){
        const a = parseFloat($("#mMonto").value) || 0;
        const b = parseFloat($("#mMontoDestino").value) || 0;
        const tc = tcImplicito({monto:a, montoDestino:b, moneda, monedaDestino:monDest});
        info.classList.remove("hidden");
        info.innerHTML = tc
          ? `Tipo de cambio implícito: <b>$${nf(tc, 2)}</b> por USD.`
          : `Cambio de moneda ${esc(moneda)} → ${esc(monDest)}: cargá los dos montos y calculo el tipo de cambio.`;
        if(tc) $("#mCotizacion").value = Math.round(tc * 100) / 100;
      }else{
        info.classList.add("hidden");
        if(destId && destId === cuentaId) { info.classList.remove("hidden"); info.textContent = "La cuenta destino tiene que ser distinta de la de origen."; }
      }
    }
    refrescarRegla();
  }

  // La cotización se autocompleta con el MEP del día del movimiento, salvo que la toques.
  let cotTocada = !!(m && m.cotizacion);
  $("#mCotizacion").oninput = () => { cotTocada = true; };
  async function cotizacionDeLaFecha(){
    if(cotTocada || tipo === "Interno") return;
    const v = await mepDe($("#mFecha").value);
    const el = $("#mCotizacion");                 // puede haberse cerrado el modal mientras tanto
    if(v > 0 && el && !cotTocada) el.value = Math.round(v * 100) / 100;
  }
  $("#mFecha").onchange = cotizacionDeLaFecha;
  if(!m) cotizacionDeLaFecha();

  $$("#segTipo button").forEach(b => b.onclick = () => {
    tipo = b.dataset.tipo;
    $$("#segTipo button").forEach(x => x.classList.toggle("on", x === b));
    sync();
  });
  ["#mCuenta","#mCuentaDestino","#mMonto","#mMontoDestino"].forEach(sel => {
    const el = $(sel);
    if(el){ el.onchange = sync; el.oninput = sync; }
  });

  /* Reglas: sugerir la categoría por el concepto y ofrecer crear la regla */
  function sugerirCategoria(){
    if(tipo === "Interno") return;
    const cat = $("#mCategoria");
    if(!cat || cat.value) return;                       // no pisamos lo que ya elegiste
    const r = aplicarReglas($("#mConcepto").value);
    if(r && r.categoria && Array.from(cat.options).some(o => o.value === r.categoria)) cat.value = r.categoria;
  }
  function refrescarRegla(){
    const cont = $("#bloqueRegla");
    if(!cont) return;
    const concepto = $("#mConcepto").value.trim();
    const cat = $("#mCategoria") ? $("#mCategoria").value : "";
    if(tipo === "Interno" || !concepto || !cat){ cont.innerHTML = ""; return; }
    const r = aplicarReglas(concepto);
    if(r && r.categoria === cat){
      cont.innerHTML = `<p class="hint" style="margin:6px 0 0">✨ Categoría sugerida por la regla «${esc(r.patron)}».</p>`;
      return;
    }
    const patron = patronDesde(concepto);
    if(!patron){ cont.innerHTML = ""; return; }
    cont.innerHTML = `<label class="check" style="margin:8px 0 0;font-size:13px"><input type="checkbox" id="mCrearRegla"> Crear regla: «${esc(patron)}» → ${esc((catPorId(cat) || {}).nombre || "")}</label>`;
  }
  $("#mConcepto").oninput = () => { sugerirCategoria(); refrescarRegla(); };
  $("#mCategoria").onchange = refrescarRegla;

  sync();
  setTimeout(() => { const el = $("#mMonto"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const esInterno = tipo === "Interno";
    const fecha  = $("#mFecha").value || todayIso();
    const cuenta = $("#mCuenta").value;
    const moneda = monedaCuenta(cuenta);
    const monto  = parseFloat($("#mMonto").value) || 0;
    const cuentaDestino = esInterno ? $("#mCuentaDestino").value : "";
    const monedaDestino = esInterno ? monedaCuenta(cuentaDestino) : "";
    const categoria = esInterno ? "" : $("#mCategoria").value;
    let montoDestino = esInterno ? (parseFloat($("#mMontoDestino").value) || 0) : null;
    if(esInterno && monedaDestino === moneda) montoDestino = monto;   // misma moneda: entra lo mismo que sale

    if(!(monto > 0)){ toast("El monto tiene que ser mayor a cero"); $("#mMonto").focus(); return; }
    if(esInterno){
      if(!cuentaDestino){ toast("Elegí la cuenta destino"); return; }
      if(cuentaDestino === cuenta){ toast("La cuenta destino tiene que ser distinta"); return; }
      if(!(montoDestino > 0)){ toast("Cargá el monto que entra"); $("#mMontoDestino").focus(); return; }
    }else if(!categoria){
      toast("Elegí una categoría (o creá una en Ajustes)"); return;
    }

    const concepto = $("#mConcepto").value.trim() ||
      (esInterno ? "Transferencia interna" : (catPorId(categoria) || {}).nombre || "");

    const mov = {
      id: m ? m.id : uid(),
      mes: mesDe(fecha),
      fecha, tipo, categoria, concepto,
      cuenta, cuentaDestino, moneda, monto,
      monedaDestino, montoDestino,
      cotizacion: parseFloat($("#mCotizacion").value) || null,
      modoPago: $("#mModoPago").value,
      observacion: $("#mObservacion").value.trim(),
      // El sello de tiempo lo pone el backend en hora argentina; al editar se conserva.
      timestamp: (m && m.timestamp) || "",
      hash: "",                                  // lo recalcula el backend con los valores nuevos
      fuente: (m && m.fuente) || "manual"
    };

    const chkRegla = $("#mCrearRegla");
    const crearRegla = !!(chkRegla && chkRegla.checked);

    b.disabled = true; b.textContent = "Guardando…";
    try{
      const res = await api({action:"saveMovimiento", mov});
      mov.timestamp = res.timestamp || mov.timestamp || ahoraLocal();
      mov.hash = calcHash(mov);
      const i = state.movimientos.findIndex(x => x.id === mov.id);
      if(i >= 0) state.movimientos[i] = mov; else state.movimientos.push(mov);
      state.movimientos = ordenarMovs(state.movimientos);
      state.mes = mov.mes;                       // saltamos al mes del movimiento guardado
      cerrar();
      render();
      toast(m ? "Movimiento actualizado" : "Movimiento guardado");
      if(crearRegla) await crearReglaDesde(concepto, categoria);
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };

  const btnBorrar = $("#mBorrar");
  if(btnBorrar) btnBorrar.onclick = async (ev) => {

      await api({action:"deleteMovimiento", id:m.id});
      state.movimientos = state.movimientos.filter(x => x.id !== m.id);
      cerrar();
      render();
      toast("Movimiento borrado");

/** Archiva o reactiva una cuenta (campo `Activo` de la hoja). */
async function archivarCuenta(id){
  const c = cuentaPorId(id);
  if(!c) return;
  const archivar = c.activo !== false;
  const saldo = saldosPorCuenta()[c.id];
  if(archivar){
    const aviso = saldo
      ? `\n\nOjo: tiene un saldo de ${fmt(saldo, c.moneda)} que va a dejar de sumar al patrimonio.`
      : "";
    if(!confirm(`¿Archivar "${c.nombre}"?\n\nNo vas a poder usarla en movimientos nuevos, pero su historial se mantiene y la podés reactivar cuando quieras.${aviso}`)) return;
  }
  const cuenta = {...c, activo: !archivar};
  try{
    await api({action:"saveCuenta", cuenta});
    const i = state.cuentas.findIndex(x => x.id === id);
    if(i >= 0) state.cuentas[i] = cuenta;
    render();
    toast(archivar ? "Cuenta archivada" : "Cuenta reactivada");
  }catch(e){ toast(e.message); }
}

async function cargarSugeridos(que, btn){
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "Cargando…";
  try{
    if(que === "categorias"){
      const categorias = CATEGORIAS_SUGERIDAS.map(c => ({...c, id:uid(), activo:true}));
      const d = await api({action:"saveCategorias", categorias});
      state.categorias = (d.categorias || categorias).filter(c => c.activo !== false);
    }else{

    render(); toast("Listo, ya podés editarlos");

    btn.disabled = false; btn.textContent = prev;

        <div>
          <label class="f" for="gTipo">Forzar tipo (opcional)</label>
          <select class="f" id="gTipo">
            <option value="">— no forzar —</option>
            ${TIPOS_MOV.map(t => `<option value="${t}" ${r && r.tipo === t ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="f" for="gPrioridad">Prioridad</label>
          <input class="f num" id="gPrioridad" type="number" step="1" value="${r ? esc(r.prioridad || 0) : "10"}">
        </div>
      </div>
      <p class="hint" style="margin:6px 0 0">Ante varias reglas que coinciden, gana la de prioridad más alta.</p>

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovRegla").onclick = e => { if(e.target.id === "ovRegla") cerrar(); };
  setTimeout(() => { const el = $("#gPatron"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const patron = $("#gPatron").value.trim();
    if(!patron){ toast("La regla necesita un patrón"); $("#gPatron").focus(); return; }
    const categoria = $("#gCategoria").value, tipo = $("#gTipo").value;
    if(!categoria && !tipo){ toast("Elegí una categoría (o un tipo a forzar)"); return; }
    if($("#gTipoPatron").value === "regex"){
      try{ new RegExp(patron); }catch(e){ toast("Esa expresión regular no es válida"); return; }
    }
    const regla = {
      id: r ? r.id : uid(),
      patron, tipoPatron: $("#gTipoPatron").value,
      categoria, tipo,
      prioridad: parseInt($("#gPrioridad").value, 10) || 0,
      hits: r ? r.hits : 0,
      activo: true
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveRegla", regla});
      const i = state.reglas.findIndex(x => x.id === regla.id);
      if(i >= 0) state.reglas[i] = regla; else state.reglas.push(regla);
      state.reglas.sort((a,z) => ((+z.prioridad||0)-(+a.prioridad||0)) || a.patron.localeCompare(z.patron, "es"));
      cerrar(); render();
      toast(r ? "Regla actualizada" : "Regla creada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };
}

async function borrarRegla(id){
  const r = state.reglas.find(x => x.id === id);
  if(!r || !confirm(`¿Borrar la regla «${r.patron}»?`)) return;
  try{
    await api({action:"deleteRegla", id});
    state.reglas = state.reglas.filter(x => x.id !== id);
    render(); toast("Regla borrada");
  }catch(e){ toast(e.message); }
}

/** Crea una regla a partir de un movimiento recién categorizado. */
async function crearReglaDesde(concepto, categoria){
  const patron = patronDesde(concepto);
  if(!patron || !categoria) return;
  if(state.reglas.some(r => r.patron.toLowerCase() === patron && r.categoria === categoria)) return;
  const regla = {id:uid(), patron, tipoPatron:"contiene", categoria, tipo:"", prioridad:10, hits:0, activo:true};
  try{
    await api({action:"saveRegla", regla});
    state.reglas.push(regla);
    toast(`Regla creada: «${patron}»`);
  }catch(e){ toast(e.message); }
}

/** Set inicial de reglas, creando las categorías que falten. */
async function cargarReglasSugeridas(btn){
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "Cargando…";
  try{
    const idPorNombre = {}, catsNuevas = [];
    for(const g of REGLAS_SUGERIDAS){
      const existente = state.categorias.find(c => c.nombre.toLowerCase() === g.categoria.toLowerCase());
      if(existente){ idPorNombre[g.categoria] = existente.id; continue; }
      const cat = {id:uid(), nombre:g.categoria, aplica:g.aplica, color:g.color, orden:50, activo:true};
      catsNuevas.push(cat);
      idPorNombre[g.categoria] = cat.id;
    }
    if(catsNuevas.length){
      const d = await api({action:"saveCategorias", categorias:catsNuevas});
      state.categorias = (d.categorias || state.categorias.concat(catsNuevas)).filter(c => c.activo !== false);
    }
    const reglas = [];
    for(const g of REGLAS_SUGERIDAS){
      for(const p of g.patrones){
        if(state.reglas.some(r => r.patron.toLowerCase() === p)) continue;
        reglas.push({id:uid(), patron:p, tipoPatron:"contiene", categoria:idPorNombre[g.categoria], tipo:"", prioridad:10, hits:0, activo:true});
      }
    }
    if(!reglas.length){ toast("Ya tenés todas las reglas sugeridas"); btn.disabled = false; btn.textContent = prev; return; }
    const d = await api({action:"saveReglas", reglas});
    state.reglas = (d.reglas || []).filter(r => r.activo !== false);
    render();
    toast(`${reglas.length} reglas cargadas`);
  }catch(e){
    toast(e.message);
    btn.disabled = false; btn.textContent = prev;
  }
}

function bindAjustes(){
  const url = $("#cfgUrl");
  const tok = $("#cfgToken");

  // Toma URL + token de los inputs; false si falta alguno.
  function tomarCredenciales(){
    const u = url.value.trim();
    if(!u){ toast("Pegá la URL del Apps Script"); url.focus(); return false; }
    const t = tok.value.trim();
    if(!t){ toast("Pegá el token del backend"); tok.focus(); return false; }
    state.url = u; state.token = t;
    return true;
  }

  $("#btnConectar").onclick = async () => {
    if(!tomarCredenciales()) return;
    localStorage.setItem("mf_url", state.url);
    localStorage.setItem("mf_token", state.token);
    await bootstrap(false);
  };

  $("#btnProbar").onclick = async (ev) => {
    const b = ev.currentTarget, prev = b.textContent;
    if(!tomarCredenciales()) return;
    b.disabled = true; b.textContent = "Probando…";
    try{
      const d = await api({action:"bootstrap"});
      toast("Conexión OK · " + (d.cuentas || []).length + " cuentas");
    }catch(e){ toast(e.message); }
    b.disabled = false; b.textContent = prev;
  };

  $("#btnMepOnline").onclick = async (ev) => {
    const b = ev.currentTarget, prev = b.textContent;
    b.disabled = true; b.textContent = "Buscando…";
    await fetchMep(false);
    b.disabled = false; b.textContent = prev;
    render();
  };

  const btnAuto = $("#btnMepAuto");
  if(btnAuto) btnAuto.onclick = async () => {
    if(state.mep) state.mep.manual = false;
    localStorage.setItem("mf_mep", JSON.stringify(state.mep));
    await fetchMep(false);
    render();
  };

  $("#btnMepManual").onclick = () => setMepManual($("#cfgMepManual").value);
  $("#cfgMepManual").onkeydown = e => { if(e.key === "Enter") setMepManual(e.currentTarget.value); };

  const nueva = $("#btnNuevaCuenta");
  if(nueva) nueva.onclick = () => modalCuenta(null);

  $$("[data-edit]").forEach(b => b.onclick = () => modalCuenta(b.dataset.edit));
  $$("[data-del]").forEach(b => b.onclick = () => borrarCuenta(b.dataset.del));
  $$("[data-archivar]").forEach(b => b.onclick = () => archivarCuenta(b.dataset.archivar));

  const nuevaCat = $("#btnNuevaCat");
  if(nuevaCat) nuevaCat.onclick = () => modalCategoria(null);
  $$("[data-editcat]").forEach(b => b.onclick = () => modalCategoria(b.dataset.editcat));
  $$("[data-delcat]").forEach(b => b.onclick = () => borrarCategoria(b.dataset.delcat));
  const seedCats = $("#btnSeedCats");
  if(seedCats) seedCats.onclick = ev => cargarSugeridos("categorias", ev.currentTarget);

  $$("[data-editmodo]").forEach(b => b.onclick = () => modalModoPago(b.dataset.editmodo));
  $$("[data-delmodo]").forEach(b => b.onclick = () => borrarModoPago(b.dataset.delmodo));
  const nuevaRegla = $("#btnNuevaRegla");
  if(nuevaRegla) nuevaRegla.onclick = () => modalRegla(null);
  $$("[data-editregla]").forEach(b => b.onclick = () => modalRegla(b.dataset.editregla));
  $$("[data-delregla]").forEach(b => b.onclick = () => borrarRegla(b.dataset.delregla));
  const seedReglas = $("#btnSeedReglas");
  if(seedReglas) seedReglas.onclick = ev => cargarReglasSugeridas(ev.currentTarget);

  const seedModos = $("#btnSeedModos");
  if(seedModos) seedModos.onclick = ev => cargarSugeridos("modos", ev.currentTarget);

  const addModo = $("#btnAddModo"), inputModo = $("#nuevoModo");
  if(addModo){
    const agregar = async (ev) => {
      const nombre = inputModo.value.trim();
      if(!nombre){ inputModo.focus(); return; }
      const b = ev.currentTarget && ev.currentTarget.tagName === "BUTTON" ? ev.currentTarget : addModo;
      const prev = b.textContent;
      b.disabled = true; b.textContent = "Guardando…";
      try{
        await guardarModoPago({id:uid(), nombre, orden:state.modosPago.length + 1, activo:true});
        render(); toast("Modo de pago agregado");
      }catch(e){
        toast(e.message);
        b.disabled = false; b.textContent = prev;
      }
    };
    addModo.onclick = agregar;
    inputModo.onkeydown = e => { if(e.key === "Enter") agregar(e); };
  }
}

/* ── ABM Cuentas ── */
function modalCuenta(id){
  const c = id ? state.cuentas.find(x => x.id === id) : null;
  const nueva = !c;
  const opciones = TIPOS_CUENTA.map(t =>
    `<option value="${t.v}" ${c && c.tipo === t.v ? "selected" : ""}>${t.ic} ${t.l}</option>`).join("");

  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ovCuenta">
    <div class="modal">
      <button class="close" id="mClose">×</button>
      <h3>${nueva ? "Nueva cuenta" : "Editar cuenta"}</h3>
      <p class="hint">Cada cuenta maneja una sola moneda.</p>

      <label class="f" for="fNombre">Nombre</label>
      <input class="f" id="fNombre" placeholder="Efectivo ARS" value="${c ? esc(c.nombre) : ""}" autocomplete="off">

      <div class="row2">
        <div>
          <label class="f" for="fTipo">Tipo</label>
          <select class="f" id="fTipo">${opciones}</select>
        </div>
        <div>
          <label class="f" for="fMoneda">Moneda</label>
          <select class="f" id="fMoneda">
            <option value="ARS" ${c && c.moneda === "ARS" ? "selected" : ""}>ARS</option>
            <option value="USD" ${c && c.moneda === "USD" ? "selected" : ""}>USD</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="f" for="fSaldo">Saldo inicial</label>
          <input class="f num" id="fSaldo" type="number" step="0.01" value="${c ? esc(c.saldoInicial) : "0"}">
        </div>
        <div>
          <label class="f" for="fFecha">Fecha inicial</label>
          <input class="f" id="fFecha" type="date" value="${c && c.fechaInicial ? esc(isoDate(c.fechaInicial)) : todayIso()}">
        </div>
      </div>

      <label class="f" for="fOrden">Orden (opcional)</label>
      <input class="f num" id="fOrden" type="number" step="1" value="${c ? esc(c.orden || 0) : "0"}">

      <label class="check"><input type="checkbox" id="fPatrimonio" ${!c || c.enPatrimonio ? "checked" : ""}> Suma al patrimonio</label>

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovCuenta").onclick = e => { if(e.target.id === "ovCuenta") cerrar(); };
  setTimeout(() => { const el = $("#fNombre"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const nombre = $("#fNombre").value.trim();
    if(!nombre){ toast("La cuenta necesita un nombre"); $("#fNombre").focus(); return; }
    const cuenta = {
      id:           c ? c.id : uid(),
      nombre,
      tipo:         $("#fTipo").value,
      moneda:       $("#fMoneda").value,
      saldoInicial: parseFloat($("#fSaldo").value) || 0,
      fechaInicial: $("#fFecha").value || todayIso(),
      enPatrimonio: $("#fPatrimonio").checked,
      orden:        parseInt($("#fOrden").value, 10) || 0,
      activo:       c ? c.activo !== false : true
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveCuenta", cuenta});
      const i = state.cuentas.findIndex(x => x.id === cuenta.id);
      if(i >= 0) state.cuentas[i] = cuenta; else state.cuentas.push(cuenta);
      state.cuentas = ordenarCuentas(state.cuentas);
      cerrar();
      render();
      toast(c ? "Cuenta actualizada" : "Cuenta creada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };
}

async function borrarCuenta(id){
  const c = state.cuentas.find(x => x.id === id);
  if(!c) return;
  if(!confirm(`¿Borrar la cuenta "${c.nombre}"? Esta acción no se puede deshacer.`)) return;
  try{
    await api({action:"deleteCuenta", id});
    state.cuentas = state.cuentas.filter(x => x.id !== id);
    render();
    toast("Cuenta borrada");
  }catch(e){ toast(e.message); }
}

/* ══════════════════════ INIT ══════════════════════ */
$$("#curToggle button").forEach(b => b.onclick = () => {
  state.cur = b.dataset.cur;
  localStorage.setItem("mf_cur", state.cur);
  renderCurToggle();
  render();
});

$("#mepChip").onclick = () => fetchMep(false);

(async function init(){
  renderMep();
  render();
  // La cotización manual manda: no la pisamos con la online.
  if(!(state.mep && state.mep.manual)) fetchMep(true);
  if(state.url && state.token) bootstrap(true);
})();

/* PWA */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(new URL("sw.js", location.href))
      .catch(err => console.warn("SW no registrado:", err));
  });
}
</script>
