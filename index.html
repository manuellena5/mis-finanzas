      ${dosFechas ? `
      <label class="f" for="mFechaResumen">Fecha resumen</label>
      <input class="f" id="mFechaResumen" type="date" value="${esc(isoDate(m.fechaResumen))}">
      <p class="hint" style="margin:6px 0 0">Con la lente <b>Por resumen</b> el movimiento cae en el mes de esta fecha; con <b>Por consumo</b>, en el de la de arriba.</p>` : ""}

      <label class="f" for="mCuenta"><span id="lblCuenta">Cuenta</span></label>
      <select class="f" id="mCuenta">${optCuentas(m ? m.cuenta : cuentasForm[0].id)}</select>

      <div id="bloqueDestino" class="hidden">
        <label class="f" for="mCuentaDestino">Entra en</label>
        <select class="f" id="mCuentaDestino">${optCuentas(m ? m.cuentaDestino : "")}</select>
        <div id="bloqueMontoDestino" class="hidden">
          <label class="f" for="mMontoDestino">Monto que entra</label>
          <div class="inputmon">
            <span class="sim" id="simMontoDestino">$</span>
            <input class="f num" id="mMontoDestino" type="number" step="0.01" min="0" inputmode="decimal" value="${m && m.montoDestino ? esc(m.montoDestino) : ""}" placeholder="0">
          </div>
        </div>
        <div class="tcinfo hidden" id="tcInfo"></div>
      </div>

      <div id="bloqueCategoria">
        <label class="f" for="mCategoria">Categoría</label>
        <select class="f" id="mCategoria"></select>
        <div id="bloqueRegla"></div>
      </div>

      <label class="f" for="mConcepto">Concepto</label>
      <input class="f" id="mConcepto" placeholder="Coto, sueldo, transferencia…" autocomplete="off" value="${m ? esc(m.concepto) : ""}">

      <div class="row2">
        <div>
          <label class="f" for="mModoPago">Modo de pago</label>
          <select class="f" id="mModoPago">${optModos}</select>
        </div>
        <div>
          <label class="f" for="mCotizacion">Cotización (ARS por USD)</label>
          <input class="f num" id="mCotizacion" type="number" step="0.01" min="0" value="${m && m.cotizacion ? esc(m.cotizacion) : (rate() ? esc(Math.round(rate()*100)/100) : "")}">
        </div>
      </div>
      <p class="hint" style="margin:6px 0 0">Se guarda con el movimiento para congelar su valor en la otra moneda.</p>

      <label class="f" for="mObservacion">Observación (opcional)</label>
      <input class="f" id="mObservacion" autocomplete="off" value="${m ? esc(m.observacion) : ""}">

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
      ${m ? `<div class="btn-row"><button class="btn danger block" id="mBorrar">Borrar movimiento</button></div>` : ""}
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovMov").onclick = e => { if(e.target.id === "ovMov") cerrar(); };

  /* Ajusta el formulario al tipo y a las monedas de las cuentas elegidas */
  function sync(){
    const esInterno = tipo === "Interno";
    const cuentaId  = $("#mCuenta").value;
    const moneda    = monedaCuenta(cuentaId);

    $("#simMonto").textContent = simbolo(moneda).trim();
    $("#lblMonto").textContent = esInterno ? "Monto que sale" : "Monto";
    $("#lblCuenta").textContent = tipo === "Ingreso" ? "Entra en" : esInterno ? "Sale de" : "Cuenta";

    $("#bloqueDestino").classList.toggle("hidden", !esInterno);
    $("#bloqueCategoria").classList.toggle("hidden", esInterno);

    // Categorías según el tipo (se re-arma para respetar `Aplica`)
    if(!esInterno){
      const sel = $("#mCategoria").value || (m ? m.categoria : "");
      const cats = catsPara(tipo);
      $("#mCategoria").innerHTML = cats.length
        ? `<option value="">— elegí una categoría —</option>` +
          cats.map(c => `<option value="${esc(c.id)}" ${sel===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")
        : `<option value="">(no hay categorías — creá una en Ajustes)</option>`;
    }

    if(esInterno){
      const destId  = $("#mCuentaDestino").value;
      const monDest = monedaCuenta(destId);
      const cambio  = destId && monDest !== moneda;
      $("#bloqueMontoDestino").classList.toggle("hidden", !cambio);
      $("#simMontoDestino").textContent = simbolo(monDest).trim();
      const info = $("#tcInfo");
      if(cambio){
        const a = parseFloat($("#mMonto").value) || 0;
        const b = parseFloat($("#mMontoDestino").value) || 0;
        const tc = tcImplicito({monto:a, montoDestino:b, moneda, monedaDestino:monDest});
        info.classList.remove("hidden");
        info.innerHTML = tc
          ? `Tipo de cambio implícito: <b>$${nf(tc, 2)}</b> por USD.`
          : `Cambio de moneda ${esc(moneda)} → ${esc(monDest)}: cargá los dos montos y calculo el tipo de cambio.`;
        if(tc) $("#mCotizacion").value = Math.round(tc * 100) / 100;
      }else{
        info.classList.add("hidden");
        if(destId && destId === cuentaId) { info.classList.remove("hidden"); info.textContent = "La cuenta destino tiene que ser distinta de la de origen."; }
      }
    }
    refrescarRegla();
  }

  // La cotización se autocompleta con el MEP del día del movimiento, salvo que la toques.
  let cotTocada = !!(m && m.cotizacion);
  $("#mCotizacion").oninput = () => { cotTocada = true; };
  async function cotizacionDeLaFecha(){
    if(cotTocada || tipo === "Interno") return;
    const v = await mepDe($("#mFecha").value);
    const el = $("#mCotizacion");                 // puede haberse cerrado el modal mientras tanto
    if(v > 0 && el && !cotTocada) el.value = Math.round(v * 100) / 100;
  }
  $("#mFecha").onchange = cotizacionDeLaFecha;
  if(!m) cotizacionDeLaFecha();

  $$("#segTipo button").forEach(b => b.onclick = () => {
    tipo = b.dataset.tipo;
    $$("#segTipo button").forEach(x => x.classList.toggle("on", x === b));
    sync();
  });
  ["#mCuenta","#mCuentaDestino","#mMonto","#mMontoDestino"].forEach(sel => {
    const el = $(sel);
    if(el){ el.onchange = sync; el.oninput = sync; }
  });

  /* Reglas: sugerir la categoría por el concepto y ofrecer crear la regla */
  function sugerirCategoria(){
    if(tipo === "Interno") return;
    const cat = $("#mCategoria");
    if(!cat || cat.value) return;                       // no pisamos lo que ya elegiste
    const r = aplicarReglas($("#mConcepto").value);
    if(r && r.categoria && Array.from(cat.options).some(o => o.value === r.categoria)) cat.value = r.categoria;
  }
  function refrescarRegla(){
    const cont = $("#bloqueRegla");
    if(!cont) return;
    const concepto = $("#mConcepto").value.trim();
    const cat = $("#mCategoria") ? $("#mCategoria").value : "";
    if(tipo === "Interno" || !concepto || !cat){ cont.innerHTML = ""; return; }
    const r = aplicarReglas(concepto);
    if(r && r.categoria === cat){
      cont.innerHTML = `<p class="hint" style="margin:6px 0 0">✨ Categoría sugerida por la regla «${esc(r.patron)}».</p>`;
      return;
    }
    const yaAbierto = !!$("#mCrearRegla") && $("#mCrearRegla").checked;
    if(yaAbierto) return;                       // no pisamos el editor mientras lo estás usando
    const patron = patronDesde(concepto);
    if(!patron){ cont.innerHTML = ""; return; }
    cont.innerHTML = `<label class="check" style="margin:8px 0 0;font-size:13px"><input type="checkbox" id="mCrearRegla"> Crear una regla a partir de este movimiento</label><div id="editorRegla"></div>`;
    $("#mCrearRegla").onchange = e => {
      $("#editorRegla").innerHTML = e.target.checked ? editorReglaManual(patron, cat) : "";
    };
  }

  /* Mismo editor que en la importación: patrón, match, categoría, tipo y prioridad. */
  function editorReglaManual(patron, cat){
    return `
    <div class="reglaform" style="margin-top:8px">
      <label>El concepto
        <select id="rgMatch">${TIPOS_PATRON.map(t => `<option value="${t.v}">${t.l}</option>`).join("")}</select>
      </label>
      <label>Patrón
        <input type="text" id="rgPatron" value="${esc(patron)}" autocomplete="off">
      </label>
      <label>Categoría
        <select id="rgCat">
          <option value="">— ninguna —</option>
          ${state.categorias.map(c => `<option value="${esc(c.id)}" ${cat === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}
        </select>
      </label>
      <label>Forzar tipo
        <select id="rgTipo"><option value="">— no —</option>${TIPOS_MOV.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
      </label>
      <label>Prioridad
        <input type="number" step="1" style="width:70px" id="rgPrio" value="10">
      </label>
    </div>`;
  }
  $("#mConcepto").oninput = () => { sugerirCategoria(); refrescarRegla(); };
  $("#mCategoria").onchange = refrescarRegla;

  sync();
  setTimeout(() => { const el = $("#mMonto"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const esInterno = tipo === "Interno";
    const fecha  = $("#mFecha").value || todayIso();
    const cuenta = $("#mCuenta").value;
    const moneda = monedaCuenta(cuenta);
    const monto  = parseFloat($("#mMonto").value) || 0;
    const cuentaDestino = esInterno ? $("#mCuentaDestino").value : "";
    const monedaDestino = esInterno ? monedaCuenta(cuentaDestino) : "";
    const categoria = esInterno ? "" : $("#mCategoria").value;
    let montoDestino = esInterno ? (parseFloat($("#mMontoDestino").value) || 0) : null;
    if(esInterno && monedaDestino === moneda) montoDestino = monto;   // misma moneda: entra lo mismo que sale

    if(!(monto > 0)){ toast("El monto tiene que ser mayor a cero"); $("#mMonto").focus(); return; }
    if(esInterno){
      if(!cuentaDestino){ toast("Elegí la cuenta destino"); return; }
      if(cuentaDestino === cuenta){ toast("La cuenta destino tiene que ser distinta"); return; }
      if(!(montoDestino > 0)){ toast("Cargá el monto que entra"); $("#mMontoDestino").focus(); return; }
    }else if(!categoria){
      toast("Elegí una categoría (o creá una en Ajustes)"); return;
    }

    const concepto = $("#mConcepto").value.trim() ||
      (esInterno ? "Transferencia interna" : (catPorId(categoria) || {}).nombre || "");

    const mov = {
      id: m ? m.id : uid(),
      mes: mesDe(fecha),
      fecha, tipo, categoria, concepto,
      cuenta, cuentaDestino, moneda, monto,
      monedaDestino, montoDestino,
      cotizacion: parseFloat($("#mCotizacion").value) || null,
      modoPago: $("#mModoPago").value,
      observacion: $("#mObservacion").value.trim(),
      // El sello de tiempo lo pone el backend en hora argentina; al editar se conserva.
      fechaResumen: ($("#mFechaResumen") && $("#mFechaResumen").value) || fecha,
      timestamp: (m && m.timestamp) || "",
      hash: "",                                  // lo recalcula el backend con los valores nuevos
      fuente: (m && m.fuente) || "manual"
    };

    const chkRegla = $("#mCrearRegla");
    // Capturamos la regla antes de cerrar el modal
    const reglaNueva = (chkRegla && chkRegla.checked && $("#rgPatron")) ? {
      patron: $("#rgPatron").value.trim(),
      tipoPatron: $("#rgMatch").value,
      categoria: $("#rgCat").value,
      tipo: $("#rgTipo").value,
      prioridad: parseInt($("#rgPrio").value, 10) || 10
    } : null;
    if(reglaNueva && !reglaNueva.patron){ toast("La regla necesita un patrón"); $("#rgPatron").focus(); return; }

    b.disabled = true; b.textContent = "Guardando…";
    try{
      const res = await api({action:"saveMovimiento", mov});
      mov.timestamp = res.timestamp || mov.timestamp || ahoraLocal();
      mov.hash = calcHash(mov);
      const i = state.movimientos.findIndex(x => x.id === mov.id);
      if(i >= 0) state.movimientos[i] = mov; else state.movimientos.push(mov);
      state.movimientos = ordenarMovs(state.movimientos);
      state.mes = mesLente(mov);                 // saltamos al mes del movimiento guardado
      cerrar();
      render();
      toast(m ? "Movimiento actualizado" : "Movimiento guardado");
      if(reglaNueva) await guardarReglaNueva(reglaNueva);
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };

  const btnBorrar = $("#mBorrar");
  if(btnBorrar) btnBorrar.onclick = async (ev) => {
    if(!confirm(`¿Borrar "${m.concepto || "este movimiento"}"?`)) return;
    const b = ev.currentTarget;
    b.disabled = true; b.textContent = "Borrando…";
    try{
      await api({action:"deleteMovimiento", id:m.id});
      state.movimientos = state.movimientos.filter(x => x.id !== m.id);
      cerrar();
      render();
      toast("Movimiento borrado");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Borrar movimiento";
    }
  };
}

/* ── Ajustes ── */
function viewAjustes(){
  return `
    <h2 class="tab-title">Ajustes</h2>
    ${cardConexion()}
    ${cardCotizacion()}
    ${cardCuentas()}
    ${cardCategorias()}
    ${cardModosPago()}
    ${cardReglas()}
    ${cardVersion()}`;
}

function cardConexion(){
  let status = `<div class="status">Pegá la URL <b>/exec</b> y el token de tu Apps Script para conectar la app con tu planilla.</div>`;
  if(state.cargando)       status = `<div class="status">Conectando…</div>`;
  else if(state.conectado) status = `<div class="status ok">Conectado · ${cuentasActivas().length} ${cuentasActivas().length===1?"cuenta":"cuentas"}</div>`;
  else if(state.error)     status = `<div class="status err">${esc(state.error)}</div>`;
  return `
  <div class="card">
    <div class="card-head"><h3>Conexión</h3>${state.token ? `<span class="tag ok">con token</span>` : `<span class="tag off">sin token</span>`}</div>
    <p class="hint">Google Apps Script publicado como aplicación web (termina en <code>/exec</code>).</p>
    <input class="f" id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(state.url)}">
    <label class="f" for="cfgToken">Token</label>
    <input class="f" id="cfgToken" type="password" autocomplete="off" spellcheck="false" placeholder="el que devolvió generarToken()" value="${esc(state.token)}">
    <p class="hint" style="margin:6px 0 0">Sin el token la URL no devuelve datos. Queda guardado sólo en este navegador.</p>
    <div class="btn-row">
      <button class="btn primary sm" id="btnConectar">Guardar y conectar</button>
      <button class="btn ghost sm" id="btnProbar">Probar conexión</button>
    </div>
    ${status}
  </div>`;
}

function cardCotizacion(){
  const m = state.mep;
  const detalle = (m && m.venta > 0)
    ? `<div class="mepbox">
         <span class="v num">$${nf(m.venta, 2)}</span>
         <span class="src">por 1 USD · ${esc(m.fuente || "")} · ${dispDate(m.fecha)}</span>
       </div>`
    : `<div class="status err">Sin cotización cargada.</div>`;
  const manualTag = (m && m.manual) ? `<span class="tag ok">manual</span>` : "";
  return `
  <div class="card">
    <div class="card-head"><h3>Cotización del dólar</h3>${manualTag}</div>
    <p class="hint">Se usa el <b>MEP</b> (respaldo: Blue). Si la red bloquea las APIs, cargalo a mano: el valor manual no se pisa al recargar.</p>
    ${detalle}
    <div class="btn-row">
      <button class="btn ghost sm" id="btnMepOnline">Actualizar online</button>
      ${(m && m.manual) ? `<button class="btn ghost sm" id="btnMepAuto">Volver a automático</button>` : ""}
    </div>
    <label class="f" for="cfgMepManual">Carga manual — 1 USD =</label>
    <div class="btn-row" style="margin-top:0;gap:8px;flex-wrap:nowrap">
      <input class="f num" id="cfgMepManual" type="number" step="0.01" min="0" placeholder="1531" value="${m && m.manual ? esc(m.venta) : ""}">
      <button class="btn primary sm" id="btnMepManual" style="flex-shrink:0">Fijar</button>
    </div>
  </div>`;
}

function cardCuentas(){
  let cuerpo;
  if(!state.url || !state.conectado){
    cuerpo = `<div class="empty">
      <div class="big">🔌</div>
      <div class="t">Sin conexión</div>
      <div class="s">Conectá tu backend acá arriba para ver y cargar cuentas.</div>
    </div>`;
  }else if(!state.cuentas.length){
    cuerpo = `<div class="empty">
      <div class="big">🏦</div>
      <div class="t">Todavía no hay cuentas</div>
      <div class="s">Creá tus cuentas (efectivo, bancos, billeteras). Cada una tiene una sola moneda: ARS o USD.</div>
    </div>`;
  }else{
    const activas    = cuentasActivas();
    const archivadas = state.cuentas.filter(c => c.activo === false);
    cuerpo = activas.map(filaCuenta).join("") ||
      `<div class="empty" style="padding:20px 10px"><div class="s">Todas tus cuentas están archivadas.</div></div>`;
    if(archivadas.length){
      cuerpo += `<p class="hint" style="margin:16px 0 2px">Archivadas · no se pueden usar en movimientos nuevos ni suman al patrimonio, pero su historial se mantiene.</p>` +
        archivadas.map(filaCuenta).join("");
    }
  }
  return `
  <div class="card">
    <div class="card-head">
      <div>
        <h3>Cuentas</h3>
        <p class="hint" style="margin-bottom:0">El saldo mostrado es el saldo actual: el inicial más sus movimientos.</p>
      </div>
      <button class="btn primary sm" id="btnNuevaCuenta" ${state.conectado ? "" : "disabled"} style="flex-shrink:0">＋ Nueva</button>
    </div>
    <div style="margin-top:10px">${cuerpo}</div>
  </div>`;
}

function filaCuenta(c){
  const ti       = tipoInfo(c.tipo);
  const saldo    = saldosPorCuenta()[c.id];
  const vista    = montoVista(saldo, c.moneda, rate());   // un saldo se valúa al dólar de hoy
  const archivada = c.activo === false;
  return `
  <div class="acc"${archivada ? ` style="opacity:.6"` : ""}>
    <div class="ico">${ti.ic}</div>
    <div class="info">
      <div class="nm">${esc(c.nombre)}</div>
      <div class="meta">
        <span class="tag">${ti.l}</span>
        <span class="tag ${c.moneda === "USD" ? "usd" : ""}">${esc(c.moneda)}</span>
        ${archivada
          ? `<span class="tag off">archivada</span>`
          : (c.enPatrimonio ? `<span class="tag ok">en patrimonio</span>` : `<span class="tag off">fuera de patrimonio</span>`)}
      </div>
    </div>
    <div class="amt"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
      <div class="n num">${vista.txt}</div>
      <div class="sub">${vista.sub ? esc(vista.sub) : "inicial " + fmt(c.saldoInicial, c.moneda)}</div>
    </div>
    <div class="acts">
      <button data-archivar="${esc(c.id)}" title="${archivada ? "Reactivar" : "Archivar"}">${archivada ? "↩️" : "📥"}</button>
      <button data-edit="${esc(c.id)}" title="Editar">✏️</button>
      <button data-del="${esc(c.id)}" title="Borrar">🗑️</button>
    </div>
  </div>`;
}

/** Archiva o reactiva una cuenta (campo `Activo` de la hoja). */
async function archivarCuenta(id){
  const c = cuentaPorId(id);
  if(!c) return;
  const archivar = c.activo !== false;
  const saldo = saldosPorCuenta()[c.id];
  if(archivar){
    const aviso = saldo
      ? `\n\nOjo: tiene un saldo de ${fmt(saldo, c.moneda)} que va a dejar de sumar al patrimonio.`
      : "";
    if(!confirm(`¿Archivar "${c.nombre}"?\n\nNo vas a poder usarla en movimientos nuevos, pero su historial se mantiene y la podés reactivar cuando quieras.${aviso}`)) return;
  }
  const cuenta = {...c, activo: !archivar};
  try{
    await api({action:"saveCuenta", cuenta});
    const i = state.cuentas.findIndex(x => x.id === id);
    if(i >= 0) state.cuentas[i] = cuenta;
    render();
    toast(archivar ? "Cuenta archivada" : "Cuenta reactivada");
  }catch(e){ toast(e.message); }
}

function cardModosPago(){
  let cuerpo;
  if(!state.conectado){
    cuerpo = `<div class="empty"><div class="t">Sin conexión</div><div class="s">Conectá tu backend para administrar modos de pago.</div></div>`;
  }else if(!state.modosPago.length){
    cuerpo = `<div class="empty">
      <div class="big">💳</div>

/** Descarta el cache del service worker y recarga con lo último publicado. */
async function buscarActualizaciones(btn){
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "Buscando…";
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.update()));
    }
    if(window.caches){
      const claves = await caches.keys();
      await Promise.all(claves.map(k => caches.delete(k)));
    }
  }catch(e){ /* si el navegador no deja, igual recargamos */ }
  location.reload();
}

/** Set inicial de reglas, creando las categorías que falten. */
async function cargarReglasSugeridas(btn){
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "Cargando…";
  try{
    const idPorNombre = {}, catsNuevas = [];
    for(const g of REGLAS_SUGERIDAS){
      const existente = state.categorias.find(c => c.nombre.toLowerCase() === g.categoria.toLowerCase());
      if(existente){ idPorNombre[g.categoria] = existente.id; continue; }
      const cat = {id:uid(), nombre:g.categoria, aplica:g.aplica, color:g.color, orden:50, activo:true};
      catsNuevas.push(cat);
      idPorNombre[g.categoria] = cat.id;
    }
    if(catsNuevas.length){
      const d = await api({action:"saveCategorias", categorias:catsNuevas});
      state.categorias = (d.categorias || state.categorias.concat(catsNuevas)).filter(c => c.activo !== false);
    }
    const reglas = [];
    for(const g of REGLAS_SUGERIDAS){
      for(const p of g.patrones){
        if(state.reglas.some(r => r.patron.toLowerCase() === p)) continue;
        reglas.push({id:uid(), patron:p, tipoPatron:"contiene", categoria:idPorNombre[g.categoria], tipo:"", prioridad:10, hits:0, activo:true});
      }
    }
    if(!reglas.length){ toast("Ya tenés todas las reglas sugeridas"); btn.disabled = false; btn.textContent = prev; return; }
    const d = await api({action:"saveReglas", reglas});
    state.reglas = (d.reglas || []).filter(r => r.activo !== false);
    render();
    toast(`${reglas.length} reglas cargadas`);
  }catch(e){
    toast(e.message);
    btn.disabled = false; btn.textContent = prev;
  }
}

  $$("[data-delcat]").forEach(b => b.onclick = () => borrarCategoria(b.dataset.delcat));
  const seedCats = $("#btnSeedCats");
  if(seedCats) seedCats.onclick = ev => cargarSugeridos("categorias", ev.currentTarget);

  $$("[data-editmodo]").forEach(b => b.onclick = () => modalModoPago(b.dataset.editmodo));
  $$("[data-delmodo]").forEach(b => b.onclick = () => borrarModoPago(b.dataset.delmodo));
  const nuevaRegla = $("#btnNuevaRegla");
  if(nuevaRegla) nuevaRegla.onclick = () => modalRegla(null);
  $$("[data-editregla]").forEach(b => b.onclick = () => modalRegla(b.dataset.editregla));
  $$("[data-delregla]").forEach(b => b.onclick = () => borrarRegla(b.dataset.delregla));
  const btnAct = $("#btnActualizar");
  if(btnAct) btnAct.onclick = ev => buscarActualizaciones(ev.currentTarget);

  const seedReglas = $("#btnSeedReglas");
  if(seedReglas) seedReglas.onclick = ev => cargarReglasSugeridas(ev.currentTarget);

  const seedModos = $("#btnSeedModos");
  if(seedModos) seedModos.onclick = ev => cargarSugeridos("modos", ev.currentTarget);

  const addModo = $("#btnAddModo"), inputModo = $("#nuevoModo");
  if(addModo){
    const agregar = async (ev) => {
      const nombre = inputModo.value.trim();
      if(!nombre){ inputModo.focus(); return; }
      const b = ev.currentTarget && ev.currentTarget.tagName === "BUTTON" ? ev.currentTarget : addModo;
      const prev = b.textContent;
      b.disabled = true; b.textContent = "Guardando…";
      try{
        await guardarModoPago({id:uid(), nombre, orden:state.modosPago.length + 1, activo:true});
        render(); toast("Modo de pago agregado");
      }catch(e){
        toast(e.message);
        b.disabled = false; b.textContent = prev;
      }
    };
    addModo.onclick = agregar;
    inputModo.onkeydown = e => { if(e.key === "Enter") agregar(e); };
  }
}

/* ── ABM Cuentas ── */
function modalCuenta(id){
  const c = id ? state.cuentas.find(x => x.id === id) : null;
  const nueva = !c;
  const opciones = TIPOS_CUENTA.map(t =>
    `<option value="${t.v}" ${c && c.tipo === t.v ? "selected" : ""}>${t.ic} ${t.l}</option>`).join("");

  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ovCuenta">
    <div class="modal">
      <button class="close" id="mClose">×</button>
      <h3>${nueva ? "Nueva cuenta" : "Editar cuenta"}</h3>
      <p class="hint">Cada cuenta maneja una sola moneda.</p>

      <label class="f" for="fNombre">Nombre</label>
      <input class="f" id="fNombre" placeholder="Efectivo ARS" value="${c ? esc(c.nombre) : ""}" autocomplete="off">

      <div class="row2">
        <div>
          <label class="f" for="fTipo">Tipo</label>
          <select class="f" id="fTipo">${opciones}</select>
        </div>
        <div>
          <label class="f" for="fMoneda">Moneda</label>
          <select class="f" id="fMoneda">
            <option value="ARS" ${c && c.moneda === "ARS" ? "selected" : ""}>ARS</option>
            <option value="USD" ${c && c.moneda === "USD" ? "selected" : ""}>USD</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="f" for="fSaldo">Saldo inicial</label>
          <input class="f num" id="fSaldo" type="number" step="0.01" value="${c ? esc(c.saldoInicial) : "0"}">
        </div>
        <div>
          <label class="f" for="fFecha">Fecha inicial</label>
          <input class="f" id="fFecha" type="date" value="${c && c.fechaInicial ? esc(isoDate(c.fechaInicial)) : todayIso()}">
        </div>
      </div>

      <label class="f" for="fOrden">Orden (opcional)</label>
      <input class="f num" id="fOrden" type="number" step="1" value="${c ? esc(c.orden || 0) : "0"}">

      <label class="check"><input type="checkbox" id="fPatrimonio" ${!c || c.enPatrimonio ? "checked" : ""}> Suma al patrimonio</label>

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovCuenta").onclick = e => { if(e.target.id === "ovCuenta") cerrar(); };
  setTimeout(() => { const el = $("#fNombre"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const nombre = $("#fNombre").value.trim();
    if(!nombre){ toast("La cuenta necesita un nombre"); $("#fNombre").focus(); return; }
    const cuenta = {
      id:           c ? c.id : uid(),
      nombre,
      tipo:         $("#fTipo").value,
      moneda:       $("#fMoneda").value,
      saldoInicial: parseFloat($("#fSaldo").value) || 0,
      fechaInicial: $("#fFecha").value || todayIso(),
      enPatrimonio: $("#fPatrimonio").checked,
      orden:        parseInt($("#fOrden").value, 10) || 0,
      activo:       c ? c.activo !== false : true
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveCuenta", cuenta});
      const i = state.cuentas.findIndex(x => x.id === cuenta.id);
      if(i >= 0) state.cuentas[i] = cuenta; else state.cuentas.push(cuenta);
      state.cuentas = ordenarCuentas(state.cuentas);
      cerrar();
      render();
      toast(c ? "Cuenta actualizada" : "Cuenta creada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };
}

async function borrarCuenta(id){
  const c = state.cuentas.find(x => x.id === id);
  if(!c) return;
  if(!confirm(`¿Borrar la cuenta "${c.nombre}"? Esta acción no se puede deshacer.`)) return;
  try{
    await api({action:"deleteCuenta", id});
    state.cuentas = state.cuentas.filter(x => x.id !== id);
    render();
    toast("Cuenta borrada");
  }catch(e){ toast(e.message); }
}

/* ══════════════════════ INIT ══════════════════════ */
$$("#curToggle button").forEach(b => b.onclick = () => {
  state.cur = b.dataset.cur;
  localStorage.setItem("mf_cur", state.cur);
  renderCurToggle();
  render();
});

$("#mepChip").onclick = () => fetchMep(false);

(async function init(){
  renderMep();
  render();
  // La cotización manual manda: no la pisamos con la online.
  if(!(state.mep && state.mep.manual)) fetchMep(true);
  if(state.url && state.token) bootstrap(true);
})();

/* PWA */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(new URL("sw.js", location.href))
      .catch(err => console.warn("SW no registrado:", err));
  });
}
</script>
