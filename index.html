<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Finanzas personales: movimientos, patrimonio e inversiones en ARS y USD.">
<meta name="theme-color" content="#0F5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0F5132; --green-med:#198754; --green-bg:#0F513214; --green-line:#0F513230;
  --danger:#C53030; --danger-bg:rgba(197,48,48,.12);
  --blue:#2563eb;
  --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.num{font-family:'DM Mono','SFMono-Regular',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* Topbar */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.5px;line-height:1.1}
.brand span{color:var(--green)}
.brand small{display:block;font-size:11px;color:var(--faint);font-weight:400;letter-spacing:0;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.curtoggle{display:inline-flex;background:#f1f5f9;border:1px solid var(--line);border-radius:20px;padding:2px}
.curtoggle button{border:none;background:none;padding:5px 11px;border-radius:18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.curtoggle button.on{background:var(--green);color:#fff}
.mepchip{font-size:11px;background:#f1f5f9;border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.mepchip:hover{border-color:#cbd5e1}
.mepchip.manual{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}

/* Layout */
.shell{max-width:1100px;margin:0 auto;display:flex;gap:0}
.sidenav{display:none}
.content{flex:1;min-width:0;padding:18px 20px 100px}
@media(min-width:860px){
  .sidenav{display:flex;flex-direction:column;gap:4px;width:210px;padding:20px 12px;position:sticky;top:59px;height:calc(100vh - 59px)}
  .sidenav button{display:flex;align-items:center;gap:11px;padding:11px 14px;border:none;background:none;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;width:100%}
  .sidenav button .ic{font-size:18px}
  .sidenav button.on{background:var(--green-bg);color:var(--green);font-weight:600}
  .content{padding:22px 26px 40px}
}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:40}
.bottomnav-in{max-width:600px;margin:0 auto;width:100%;display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10px;font-weight:500}
.bottomnav button .ic{font-size:19px;line-height:1}
.bottomnav button.on{color:var(--green)}
@media(min-width:860px){ .bottomnav{display:none} }

/* Piezas */
h2.tab-title{font-size:19px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card + .card{margin-top:12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.card h3{margin:0;font-size:15px}
.card .hint{font-size:12px;color:var(--faint);margin:4px 0 12px;line-height:1.5}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;background:#f1f5f9;color:var(--muted);font-weight:500;white-space:nowrap;display:inline-block}
.tag.ok{background:rgba(25,135,84,.12);color:var(--green-med)}
.tag.usd{background:rgba(37,99,235,.12);color:var(--blue)}
.tag.off{background:var(--danger-bg);color:var(--danger)}

.btn{border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;padding:11px 16px}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:#f1f5f9;color:var(--ink)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 5px}
input.f,select.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
input.f:focus,select.f:focus{outline:none;border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;margin:14px 0 2px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}

/* Lista de cuentas */
.acc{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #f1f5f9}
.acc:last-child{border-bottom:none}
.acc .ico{width:36px;height:36px;border-radius:10px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.acc .info{flex:1;min-width:0}
.acc .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
.acc .amt{text-align:right;white-space:nowrap}
.acc .amt .n{font-weight:600;font-size:14px}
.acc .amt .sub{font-size:10.5px;color:var(--faint);margin-top:3px}
.acc .acts{display:flex;gap:2px;flex-shrink:0}
.acc .acts button{border:none;background:none;cursor:pointer;font-size:15px;padding:6px;border-radius:7px;color:var(--muted);line-height:1}
.acc .acts button:hover{background:#f1f5f9}

.empty{text-align:center;padding:34px 18px;color:var(--faint)}
.empty .big{font-size:30px;margin-bottom:10px}
.empty .t{font-weight:600;color:var(--muted);font-size:14px;margin-bottom:5px}
.empty .s{font-size:12.5px;line-height:1.55;max-width:340px;margin:0 auto}

.status{font-size:12.5px;padding:9px 12px;border-radius:9px;background:#f1f5f9;color:var(--muted);margin-top:12px;line-height:1.5}
.status.ok{background:rgba(25,135,84,.1);color:var(--green-med)}
.status.err{background:var(--danger-bg);color:var(--danger)}

.mepbox{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mepbox .v{font-size:24px;font-weight:700}
.mepbox .src{font-size:12px;color:var(--faint)}

/* Movimientos */
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-bottom:10px}
.mesnav .m{font-weight:600;font-size:14px;text-transform:capitalize}
.mesnav button{border:none;background:#f1f5f9;color:var(--ink);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
.mesnav button.hoy{width:auto;padding:0 11px;height:30px;font-size:12px;font-weight:600;color:var(--muted)}
.mesnav button:disabled{opacity:.4;cursor:default}

.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tot .b{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;min-width:0}
.tot .lbl{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tot .v{font-weight:700;font-size:15px;margin-top:3px;font-family:'DM Mono',ui-monospace,monospace;overflow-wrap:anywhere}
.tot .v.pos{color:var(--green-med)}
.tot .v.neg{color:var(--danger)}
.tot .v .u{display:block;font-size:11.5px;font-weight:500;color:var(--faint);margin-top:2px}
@media(max-width:420px){ .tot{gap:6px} .tot .b{padding:8px 9px} .tot .v{font-size:13px} .tot .v .u{font-size:10.5px} }

.avisocot{font-size:12px;color:var(--danger);background:var(--danger-bg);border-radius:9px;padding:8px 11px;margin-bottom:10px;line-height:1.5}

/* Resumen */
.hero{background:var(--green-bg);border:1px solid var(--green-line);border-radius:var(--radius);padding:15px 17px;margin-bottom:12px}
.hero .lbl{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.75}
.hero .v{font-size:27px;font-weight:700;line-height:1.15;margin-top:4px;font-family:'DM Mono',ui-monospace,monospace;overflow-wrap:anywhere}
.hero .u{font-size:12px;color:var(--muted);margin-top:3px}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.bar .bl{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:5px}
.bar .bl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar .bl .pct{color:var(--faint);font-size:11.5px;flex-shrink:0}
.bar .bl .val{font-weight:600;font-size:12.5px;flex-shrink:0}
.track{height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;min-width:2px}

.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.pill.on{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:600}
.filtros select,.filtros input{padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--card);color:var(--ink)}
.filtros input{flex:1;min-width:150px}

.diahdr{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 7px}
.mov{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit}
.mov:hover{border-color:#cbd5e1}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.mov .info{flex:1;min-width:0}
.mov .cpt{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
.mov .amt{text-align:right;white-space:nowrap;flex-shrink:0}
.mov .amt .n{font-weight:700;font-size:15px}
.mov .amt .n.pos{color:var(--green-med)}
.mov .amt .n.neg{color:var(--danger)}
.mov .amt .n.int{color:var(--muted)}
.mov .amt .sub{font-size:10.5px;color:var(--faint);margin-top:3px}

.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:25px;cursor:pointer;box-shadow:0 6px 18px rgba(15,81,50,.35);z-index:45;line-height:1}
@media(min-width:860px){.fab{bottom:26px;right:26px}}

/* Selector de tipo de movimiento */
.seg{display:flex;gap:6px;margin:4px 0 2px}
.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.inputmon{position:relative}
.inputmon .sim{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);font-weight:600;pointer-events:none}
.inputmon input{padding-left:42px}
.tcinfo{font-size:12px;color:var(--muted);background:#f1f5f9;border-radius:9px;padding:8px 11px;margin-top:8px;line-height:1.5}

/* Items de lista en Ajustes (categorías, modos de pago) */
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f1f5f9}
.item:last-child{border-bottom:none}
.item .nm{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:2px;flex-shrink:0}
.item .acts button{border:none;background:none;cursor:pointer;font-size:14px;padding:6px;border-radius:7px;color:var(--muted);line-height:1}
.item .acts button:hover{background:#f1f5f9}
.swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:#fff;color:var(--ink)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 24px}
@media(min-width:640px){.modal{border-radius:16px}}
.modal h3{margin:2px 0 4px;font-size:17px}
.modal .close{float:right;background:none;border:none;font-size:22px;color:var(--faint);cursor:pointer;line-height:1}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(80px);bottom:78px;background:#1e293b;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;font-weight:500;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:860px){#toast{bottom:26px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">Mis <span>Finanzas</span><small id="brandSub">—</small></div>
    <div class="topbar-right">
      <div class="curtoggle" id="curToggle">
        <button data-cur="ARS">ARS</button>
        <button data-cur="USD">USD</button>
        <button data-cur="ambas">Ambas</button>
      </div>
      <button class="mepchip" id="mepChip" title="Cotización del dólar">Dólar —</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" id="sideNav"></nav>
  <main class="content" id="content"></main>
</div>

<nav class="bottomnav"><div class="bottomnav-in" id="bottomNav"></div></nav>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ══════════════════════ CONSTANTES ══════════════════════ */
const TABS = [
  {id:"resumen",     label:"Resumen",     ic:"📊", fase:4},
  {id:"movimientos", label:"Movimientos", ic:"💸", fase:2},
  {id:"patrimonio",  label:"Patrimonio",  ic:"🏦", fase:5},
  {id:"inversiones", label:"Inversiones", ic:"📈", fase:6},
  {id:"ajustes",     label:"Ajustes",     ic:"⚙️", fase:1}
];

const TIPOS_CUENTA = [
  {v:"efectivo",  l:"Efectivo",   ic:"💵"},
  {v:"banco",     l:"Banco",      ic:"🏦"},
  {v:"billetera", l:"Billetera",  ic:"📱"},
  {v:"inversion", l:"Inversión",  ic:"📈"},
  {v:"tarjeta",   l:"Tarjeta",    ic:"💳"},
  {v:"otro",      l:"Otro",       ic:"📦"}
];
const tipoInfo = t => TIPOS_CUENTA.find(x => x.v === t) || TIPOS_CUENTA[5];

const TIPOS_MOV = ["Ingreso","Egreso","Interno"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const APLICA = [{v:"gasto",l:"Egresos"},{v:"ingreso",l:"Ingresos"},{v:"ambos",l:"Ambos"}];
const COLOR_DEFAULT = "#64748b";

/* Sets iniciales opcionales (botón "Cargar sugeridas") */
const CATEGORIAS_SUGERIDAS = [
  {nombre:"Supermercado",     aplica:"gasto",   color:"#C53030", orden:1},
  {nombre:"Comida y salidas", aplica:"gasto",   color:"#B44D1A", orden:2},
  {nombre:"Transporte",       aplica:"gasto",   color:"#2563eb", orden:3},
  {nombre:"Servicios",        aplica:"gasto",   color:"#7c3aed", orden:4},
  {nombre:"Alquiler",         aplica:"gasto",   color:"#0f766e", orden:5},
  {nombre:"Salud",            aplica:"gasto",   color:"#db2777", orden:6},
  {nombre:"Ocio",             aplica:"gasto",   color:"#EF9F27", orden:7},
  {nombre:"Compras",          aplica:"gasto",   color:"#0891b2", orden:8},
  {nombre:"Sueldo",           aplica:"ingreso", color:"#198754", orden:20},
  {nombre:"Freelance",        aplica:"ingreso", color:"#0F5132", orden:21},
  {nombre:"Otros",            aplica:"ambos",   color:"#94a3b8", orden:30}
];
const MODOS_SUGERIDOS = ["Efectivo","Débito","Crédito","Transferencia"];

/* ══════════════════════ ESTADO ══════════════════════ */
const state = {
  url:      localStorage.getItem("mf_url") || "",
  token:    localStorage.getItem("mf_token") || "",       // token compartido del backend
  cur:      localStorage.getItem("mf_cur") || "ARS",          // ARS | USD | ambas
  mep:      JSON.parse(localStorage.getItem("mf_mep") || "null"), // {compra,venta,fecha,fuente,manual}
  tab:      localStorage.getItem("mf_tab") || "resumen",
  cuentas:  [],
  categorias: [],
  modosPago:  [],
  movimientos: [],
  mes:      "",                                               // "YYYY-MM" que se está mirando
  grafico:  "Egreso",                                         // qué muestra el gráfico del Resumen
  filtros:  {tipo:"todos", cuenta:"", categoria:"", texto:""},
  config:   {},
  conectado: false,
  cargando:  false,
  error:     ""
};

/* ══════════════════════ HELPERS ══════════════════════ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* Números y montos — es-AR, con símbolo por moneda */
function nf(n, dec){
  const v = Math.abs(+n || 0);
  const d = dec != null ? dec : (Number.isInteger(v) ? 0 : 2);
  return v.toLocaleString("es-AR", {minimumFractionDigits:d, maximumFractionDigits:d});
}
const simbolo = mon => (mon === "USD" ? "u$s " : "$");
function fmt(monto, moneda, dec){
  const n = +monto || 0;
  return (n < 0 ? "−" : "") + simbolo(moneda) + nf(n, dec);
}

/* Fechas — internamente ISO YYYY-MM-DD, se muestran DD/MM/YYYY */
function todayIso(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function isoDate(v){
  if(!v) return "";
  if(v instanceof Date && !isNaN(v)){
    return v.getFullYear() + "-" + String(v.getMonth()+1).padStart(2,"0") + "-" + String(v.getDate()).padStart(2,"0");
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);          // ISO o ISO+hora (serializado por Sheets)
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);        // DD/MM/YYYY
  if(m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
  const d = new Date(s);
  return isNaN(d) ? "" : isoDate(d);
}
function dispDate(v){
  const iso = isoDate(v);
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

/* ══════════════════════ COTIZACIÓN ══════════════════════ */
/* Cuántos ARS vale 1 USD, hoy */
function rate(){ return (state.mep && state.mep.venta > 0) ? state.mep.venta : null; }

/* ── Conversión ──
   Regla de oro (PLAN.md):
   · Un movimiento se valúa con SU cotización congelada, la del día en que pasó.
   · Un saldo (cuentas, patrimonio) se valúa al dólar de HOY: representa cuánto vale ahora.
   Devuelve null si no hay cotización con la que convertir. */
function convertir(monto, moneda, cur, tc){
  const n = +monto || 0;
  if(!cur || cur === "ambas" || cur === moneda) return n;
  if(!(tc > 0)) return null;
  if(cur === "USD") return moneda === "ARS" ? n / tc : n;
  return moneda === "USD" ? n * tc : n;
}
/* ── Saldos ──
   El saldo de una cuenta es su SaldoInicial más lo que entró y salió, en la
   moneda de la cuenta (los movimientos siempre están en esa moneda). */
function saldosPorCuenta(hasta){
  const tope = hasta || "9999-12-31";
  const s = {};
  for(const c of state.cuentas){
    s[c.id] = (c.fechaInicial && isoDate(c.fechaInicial) > tope) ? 0 : (+c.saldoInicial || 0);
  }
  for(const m of state.movimientos){
    if(m.fecha > tope) continue;
    if(m.tipo === "Ingreso"){ if(m.cuenta in s) s[m.cuenta] += +m.monto || 0; }
    else if(m.tipo === "Egreso"){ if(m.cuenta in s) s[m.cuenta] -= +m.monto || 0; }
    else if(m.tipo === "Interno"){
      if(m.cuenta in s) s[m.cuenta] -= +m.monto || 0;
      if(m.cuentaDestino in s) s[m.cuentaDestino] += (m.montoDestino == null ? +m.monto : +m.montoDestino) || 0;
    }
  }
  return s;
}

/** Patrimonio: suma de las cuentas marcadas `EnPatrimonio`, al dólar de hoy. */
function patrimonio(hasta){
  const s = saldosPorCuenta(hasta);
  const t = {ars:0, usd:0, sinCotizacion:0};
  for(const c of state.cuentas){
    if(!c.enPatrimonio) continue;
    const ars = convertir(s[c.id], c.moneda, "ARS", rate());
    const usd = convertir(s[c.id], c.moneda, "USD", rate());
    if(ars == null || usd == null){ t.sinCotizacion++; continue; }
    t.ars += ars; t.usd += usd;
  }
  return t;
}

/** Cotización de un movimiento: la congelada; si le falta, la de hoy. */
const tcDe = m => (+m.cotizacion > 0 ? +m.cotizacion : rate());
/** Valor de un movimiento en la moneda de vista (histórico). */
const valorMov = (m, cur) => convertir(m.monto, m.moneda, cur, tcDe(m));
/** Valor de hoy de un saldo (cuentas, inversiones, patrimonio). */
const valorHoy = (monto, moneda, cur) => convertir(monto, moneda, cur, rate());

function toARS(monto, moneda){ const v = convertir(monto, moneda, "ARS", rate()); return v == null ? (+monto||0) : v; }
function toUSD(monto, moneda){ const v = convertir(monto, moneda, "USD", rate()); return v == null ? 0 : v; }

/* Cómo mostrar un monto según el toggle. Si hubo conversión, el monto original
   queda de referencia abajo: nunca se muestra un importe convertido con la
   etiqueta de la moneda original. */
function montoVista(monto, moneda, tc){
  const nativo = fmt(monto, moneda);
  if(state.cur === "ambas" || state.cur === moneda) return {txt:nativo, sub:"", tit:""};
  const v = convertir(monto, moneda, state.cur, tc);
  if(v == null){
    return {txt:nativo, sub:"sin cotización",
            tit:"No hay cotización cargada, así que se muestra el monto en " + moneda + "."};
  }
  return {txt:fmt(v, state.cur), sub:nativo,
          tit:`${nativo} convertidos a ${state.cur} a $${nf(tc, 2)} por USD`};
}

const MEP_SOURCES = [
  {n:"MEP",  url:"https://dolarapi.com/v1/dolares/mep",                        pick:d=>({compra:+d.compra, venta:+d.venta, fecha:(d.fechaActualizacion||"").slice(0,10)})},
  {n:"MEP",  url:"https://api.argentinadatos.com/v1/cotizaciones/dolares/mep", pick:d=>({compra:+d.compra, venta:+d.venta, fecha:(d.fecha||"").slice(0,10)})},
  {n:"Blue", url:"https://api.bluelytics.com.ar/v2/latest",                    pick:d=>({compra:+d.blue.value_buy, venta:+d.blue.value_sell, fecha:(d.last_update||"").slice(0,10)})}
];

async function fetchMep(silent){
  for(const s of MEP_SOURCES){
    try{
      const r = await fetch(s.url, {cache:"no-store"});
      if(!r.ok) continue;
      const m = s.pick(await r.json());
      if(m && m.venta > 0){
        state.mep = {compra:m.compra, venta:m.venta, fecha:m.fecha || todayIso(), fuente:s.n, manual:false};

        return true;
      }
    }catch(e){ /* probamos la siguiente fuente */ }
  }
  if(!silent) toast("No se pudo obtener la cotización online. Cargala a mano en Ajustes.");
  return false;
}

/* MEP de una fecha pasada (para congelar el valor del movimiento en su día).
   Si no hay dato (fin de semana, feriado, API caída) devuelve null y se usa el actual. */
const mepHistCache = {};
async function mepDe(fechaIso){
  const iso = isoDate(fechaIso);
  if(!iso) return null;
  if(iso >= todayIso()) return rate();
  if(iso in mepHistCache) return mepHistCache[iso];
  const [y,m,d] = iso.split("-");
  try{
    const r = await fetch(`https://api.argentinadatos.com/v1/cotizaciones/dolares/mep/${y}/${m}/${d}`, {cache:"force-cache"});
    if(r.ok){
      const j = await r.json();
      const dato = Array.isArray(j) ? j[j.length - 1] : j;
      const venta = dato && +dato.venta;
      if(venta > 0){ mepHistCache[iso] = venta; return venta; }
    }
  }catch(e){ /* sin dato histórico: se usa el actual */ }
  mepHistCache[iso] = null;
  return null;
}

/* ══════════════════════ API ══════════════════════ */
async function api(payload){
  if(!state.url) throw new Error("Falta configurar la URL del backend en Ajustes.");
  if(!state.token) throw new Error("Falta el token del backend en Ajustes.");
  const res = await fetch(state.url, {
    method: "POST",
    // text/plain evita el preflight CORS con Apps Script
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    // el token viaja en el cuerpo, nunca en la URL (no queda en logs ni historial)
    body: JSON.stringify({...payload, token: state.token})
  });
  const txt = await res.text();
  let data;
  try{ data = JSON.parse(txt); }
  catch(e){
    throw new Error("El backend no devolvió JSON. Verificá que la URL termine en /exec y que la implementación tenga acceso 'Cualquiera con el enlace'.");
  }
  if(!data.ok) throw new Error(data.error || "Error del servidor");
  return data;
}

function ordenarCuentas(list){
  return list.slice().sort((a,b) => ((+a.orden||0) - (+b.orden||0)) || String(a.nombre).localeCompare(String(b.nombre), "es"));
}
/* Más nuevos primero; a igual fecha, el último cargado arriba. */
function ordenarMovs(list){
  return list.slice().sort((a,b) => (b.fecha + (b.timestamp||"")).localeCompare(a.fecha + (a.timestamp||"")));
}

/* ── Mes ── */
const mesActual  = () => todayIso().slice(0,7);
const mesDe      = iso => String(iso || "").slice(0,7);
function mesLabel(mes){
  const [y,m] = String(mes).split("-");
  return (MESES[+m - 1] || "") + " " + y;
}
function mesShift(mes, delta){
  const [y,m] = String(mes).split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

/* ── Lookups ── */
const cuentaPorId = id => state.cuentas.find(c => c.id === id) || null;
const catPorId    = id => state.categorias.find(c => c.id === id) || null;
const nombreCuenta = id => (cuentaPorId(id) || {}).nombre || "cuenta borrada";
const monedaCuenta = id => (cuentaPorId(id) || {}).moneda || "ARS";
/* Categorías que aplican a un tipo de movimiento */
function catsPara(tipo){
  const quiere = tipo === "Ingreso" ? "ingreso" : "gasto";
  return state.categorias.filter(c => c.aplica === quiere || c.aplica === "ambos");
}

async function bootstrap(silent){
  if(!state.url || !state.token){ state.conectado = false; render(); return false; }
  state.cargando = true; state.error = ""; render();
  try{
    const d = await api({action:"bootstrap"});
    state.cuentas     = ordenarCuentas((d.cuentas || []).filter(c => c.activo !== false));
    state.categorias  = (d.categorias || []).filter(c => c.activo !== false);
    state.modosPago   = (d.modosPago || []).filter(m => m.activo !== false);
    state.movimientos = ordenarMovs((d.movimientos || []).map(m => ({...m, fecha:isoDate(m.fecha)})));
    state.config      = d.config || {};
    state.conectado = true;
    if(!silent) toast("Conectado · " + state.cuentas.length + (state.cuentas.length === 1 ? " cuenta" : " cuentas"));
    return true;
  }catch(e){
    state.conectado = false;
    state.error = e.message;
    if(!silent) toast(e.message);
    return false;
  }finally{
    state.cargando = false;
    render();
  }
}

/* Gráfico de barras por categoría (sin librerías) */
function cardGrafico(movsMes){
  const tipo = state.grafico === "Ingreso" ? "Ingreso" : "Egreso";
  const map = {};
  let sinCot = 0;
  for(const m of movsMes){
    if(m.tipo !== tipo) continue;
    const tc  = tcDe(m);
    const ars = convertir(m.monto, m.moneda, "ARS", tc);
    const usd = convertir(m.monto, m.moneda, "USD", tc);
    if(ars == null || usd == null){ sinCot++; continue; }
    const k = m.categoria || "";
    if(!map[k]) map[k] = {id:k, ars:0, usd:0};
    map[k].ars += ars; map[k].usd += usd;
  }
  const filas = Object.values(map).sort((a,b) => b.ars - a.ars);
  const total = filas.reduce((a,x) => a + x.ars, 0);

  const pills = ["Egreso","Ingreso"].map(t =>
    `<button class="pill ${tipo===t?"on":""}" data-graf="${t}">${t}s</button>`).join("");

  let cuerpo;
  if(!filas.length){
    cuerpo = `<div class="empty" style="padding:20px 10px"><div class="s">Sin ${tipo.toLowerCase()}s en ${mesLabel(state.mes)}.</div></div>`;
  }else{
    cuerpo = `<div class="bars">` + filas.map(f => {
      const cat = catPorId(f.id);
      const pct = total ? Math.round(f.ars / total * 100) : 0;
      const val = state.cur === "USD" ? fmt(f.usd, "USD", 0) : fmt(f.ars, "ARS", 0);
      return `<div class="bar">
        <div class="bl">
          <span class="dot" style="background:${esc(cat ? cat.color : COLOR_DEFAULT)}"></span>
          <span class="nm">${esc(cat ? cat.nombre : "Sin categoría")}</span>
          <span class="pct">${pct}%</span>
          <span class="val num">${val}</span>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${esc(cat ? cat.color : COLOR_DEFAULT)}"></div></div>
      </div>`;
    }).join("") + `</div>`;
  }

  return `
  <div class="card">
    <div class="card-head"><h3>Por categoría</h3><span style="display:flex;gap:6px">${pills}</span></div>
    ${cuerpo}
    ${sinCot ? `<p class="hint" style="margin:10px 0 0">${sinCot} ${sinCot === 1 ? "movimiento quedó" : "movimientos quedaron"} fuera por no tener cotización.</p>` : ""}
  </div>`;
}

function filaMov(m){
  const cat  = catPorId(m.categoria);
  const color = m.tipo === "Interno" ? "#94a3b8" : (cat ? cat.color : COLOR_DEFAULT);
  const tags = [];
  if(m.tipo !== "Interno") tags.push(`<span class="tag">${esc(cat ? cat.nombre : "Sin categoría")}</span>`);
  tags.push(`<span class="tag">${esc(m.tipo === "Interno" ? nombreCuenta(m.cuenta) + " → " + nombreCuenta(m.cuentaDestino) : nombreCuenta(m.cuenta))}</span>`);
  if(m.modoPago) tags.push(`<span class="tag">${esc(m.modoPago)}</span>`);

  let clase = "int", signo = "";
  if(m.tipo === "Ingreso"){ clase = "pos"; signo = "+"; }
  if(m.tipo === "Egreso"){  clase = "neg"; signo = "−"; }

  // Valuado con la cotización congelada del movimiento
  const vista = montoVista(m.monto, m.moneda, tcDe(m));
  let sub = vista.sub;
  if(m.tipo === "Interno" && state.cur === "ambas"){
    // En vista nativa mostramos lo que entra; convertido, ambos lados dan lo mismo.
    const cambio = m.monedaDestino && m.monedaDestino !== m.moneda;
    sub = "→ " + fmt(m.montoDestino || m.monto, m.monedaDestino || m.moneda) +
          (cambio ? " · TC " + nf(tcImplicito(m), 0) : "");
  }

  return `
  <button class="mov" data-mov="${esc(m.id)}"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
    <span class="dot" style="background:${esc(color)}"></span>
    <span class="info">
      <span class="cpt">${esc(m.concepto || "(sin concepto)")}</span>
      <span class="meta">${tags.join("")}</span>
    </span>
    <span class="amt">
      <span class="n ${clase}">${signo}${vista.txt}</span>
      ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
    </span>
  </button>`;
}

/* Totales del mes (de lo que se está viendo). Los internos no suman: mueven
   plata entre cuentas propias. Se calculan en las dos monedas y el toggle elige. */
function totalesDe(movs){
  const t = {ars:{ing:0, egr:0}, usd:{ing:0, egr:0}, sinCotizacion:0};
  for(const m of movs){
    if(m.tipo === "Interno") continue;
    const tc = tcDe(m);
    const ars = convertir(m.monto, m.moneda, "ARS", tc);
    const usd = convertir(m.monto, m.moneda, "USD", tc);
    if(ars == null || usd == null){ t.sinCotizacion++; continue; }
    const k = m.tipo === "Ingreso" ? "ing" : "egr";
    t.ars[k] += ars;
    t.usd[k] += usd;
  }
  return t;
}

/** Un total en la(s) moneda(s) del toggle. */
function totalVista(ars, usd){
  if(state.cur === "USD") return fmt(usd, "USD", 0);
  if(state.cur === "ARS") return fmt(ars, "ARS", 0);
  return fmt(ars, "ARS", 0) + `<span class="u">${fmt(usd, "USD", 0)}</span>`;
}

function bloqueTotales(movs){
  const t = totalesDe(movs);
  const netoArs = t.ars.ing - t.ars.egr, netoUsd = t.usd.ing - t.usd.egr;
  const signoNeto = netoArs < 0 ? "neg" : "pos";
  return `
  <div class="tot">
    <div class="b"><div class="lbl">Ingresos</div><div class="v pos">${totalVista(t.ars.ing, t.usd.ing)}</div></div>
    <div class="b"><div class="lbl">Egresos</div><div class="v neg">${totalVista(t.ars.egr, t.usd.egr)}</div></div>
    <div class="b"><div class="lbl">Neto</div><div class="v ${signoNeto}">${totalVista(netoArs, netoUsd)}</div></div>
  </div>
  ${t.sinCotizacion ? `<p class="hint" style="margin:-4px 2px 10px">${t.sinCotizacion} ${t.sinCotizacion === 1 ? "movimiento quedó" : "movimientos quedaron"} fuera del total por no tener cotización.</p>` : ""}`;
}

/** ARS por 1 USD implícito en un interno con cambio de moneda. */
function tcImplicito(m){
  const a = +m.monto || 0, b = +m.montoDestino || 0;
  if(!a || !b) return 0;
  if(m.moneda === "USD" && m.monedaDestino === "ARS") return b / a;   // venta de dólares
  if(m.moneda === "ARS" && m.monedaDestino === "USD") return a / b;   // compra de dólares
  return 0;
}

}

function modalMovimiento(id){

    `<option value="${esc(c.id)}" ${sel === c.id ? "selected" : ""}>${esc(c.nombre)} · ${esc(c.moneda)}</option>`).join("");

      <h3>${m ? "Editar movimiento" : "Nuevo movimiento"}</h3>

      </div>

      <div class="row2">
        <div>
          <label class="f" for="mFecha">Fecha</label>
          <input class="f" id="mFecha" type="date" value="${m ? esc(isoDate(m.fecha)) : todayIso()}">
        </div>
        <div>
          <label class="f" for="mMonto"><span id="lblMonto">Monto</span></label>
          <div class="inputmon">
            <span class="sim" id="simMonto">$</span>
            <input class="f num" id="mMonto" type="number" step="0.01" min="0" inputmode="decimal" value="${m ? esc(m.monto) : ""}" placeholder="0">
          </div>
        </div>
      </div>

      <label class="f" for="mCuenta"><span id="lblCuenta">Cuenta</span></label>
      <select class="f" id="mCuenta">${optCuentas(m ? m.cuenta : state.cuentas[0].id)}</select>

      <div id="bloqueDestino" class="hidden">
        <label class="f" for="mCuentaDestino">Entra en</label>
        <select class="f" id="mCuentaDestino">${optCuentas(m ? m.cuentaDestino : "")}</select>
        <div id="bloqueMontoDestino" class="hidden">
          <label class="f" for="mMontoDestino">Monto que entra</label>
          <div class="inputmon">
            <span class="sim" id="simMontoDestino">$</span>
            <input class="f num" id="mMontoDestino" type="number" step="0.01" min="0" inputmode="decimal" value="${m && m.montoDestino ? esc(m.montoDestino) : ""}" placeholder="0">
          </div>
        </div>
        <div class="tcinfo hidden" id="tcInfo"></div>
      </div>

      <div id="bloqueCategoria">
        <label class="f" for="mCategoria">Categoría</label>
        <select class="f" id="mCategoria"></select>
      </div>

      <label class="f" for="mConcepto">Concepto</label>
      <input class="f" id="mConcepto" placeholder="Coto, sueldo, transferencia…" autocomplete="off" value="${m ? esc(m.concepto) : ""}">

      <div class="row2">
        <div>
          <label class="f" for="mModoPago">Modo de pago</label>
          <select class="f" id="mModoPago">${optModos}</select>
        </div>
        <div>
          <label class="f" for="mCotizacion">Cotización (ARS por USD)</label>
          <input class="f num" id="mCotizacion" type="number" step="0.01" min="0" value="${m && m.cotizacion ? esc(m.cotizacion) : (rate() ? esc(Math.round(rate()*100)/100) : "")}">
        </div>
      </div>
      <p class="hint" style="margin:6px 0 0">Se guarda con el movimiento para congelar su valor en la otra moneda.</p>

      <label class="f" for="mObservacion">Observación (opcional)</label>
      <input class="f" id="mObservacion" autocomplete="off" value="${m ? esc(m.observacion) : ""}">

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
      ${m ? `<div class="btn-row"><button class="btn danger block" id="mBorrar">Borrar movimiento</button></div>` : ""}
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovMov").onclick = e => { if(e.target.id === "ovMov") cerrar(); };

  /* Ajusta el formulario al tipo y a las monedas de las cuentas elegidas */
  function sync(){
    const esInterno = tipo === "Interno";
    const cuentaId  = $("#mCuenta").value;
    const moneda    = monedaCuenta(cuentaId);

    $("#simMonto").textContent = simbolo(moneda).trim();
    $("#lblMonto").textContent = esInterno ? "Monto que sale" : "Monto";
    $("#lblCuenta").textContent = tipo === "Ingreso" ? "Entra en" : esInterno ? "Sale de" : "Cuenta";

    $("#bloqueDestino").classList.toggle("hidden", !esInterno);
    $("#bloqueCategoria").classList.toggle("hidden", esInterno);

    // Categorías según el tipo (se re-arma para respetar `Aplica`)
    if(!esInterno){
      const sel = $("#mCategoria").value || (m ? m.categoria : "");
      const cats = catsPara(tipo);
      $("#mCategoria").innerHTML = cats.length
        ? cats.map(c => `<option value="${esc(c.id)}" ${sel===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")
        : `<option value="">(no hay categorías — creá una en Ajustes)</option>`;
    }

    if(esInterno){
      const destId  = $("#mCuentaDestino").value;
      const monDest = monedaCuenta(destId);
      const cambio  = destId && monDest !== moneda;
      $("#bloqueMontoDestino").classList.toggle("hidden", !cambio);
      $("#simMontoDestino").textContent = simbolo(monDest).trim();
      const info = $("#tcInfo");
      if(cambio){
        const a = parseFloat($("#mMonto").value) || 0;
        const b = parseFloat($("#mMontoDestino").value) || 0;
        const tc = tcImplicito({monto:a, montoDestino:b, moneda, monedaDestino:monDest});
        info.classList.remove("hidden");
        info.innerHTML = tc
          ? `Tipo de cambio implícito: <b>$${nf(tc, 2)}</b> por USD.`
          : `Cambio de moneda ${esc(moneda)} → ${esc(monDest)}: cargá los dos montos y calculo el tipo de cambio.`;
        if(tc) $("#mCotizacion").value = Math.round(tc * 100) / 100;
      }else{
        info.classList.add("hidden");
        if(destId && destId === cuentaId) { info.classList.remove("hidden"); info.textContent = "La cuenta destino tiene que ser distinta de la de origen."; }
      }
    }
  }

  // La cotización se autocompleta con el MEP del día del movimiento, salvo que la toques.
  let cotTocada = !!(m && m.cotizacion);
  $("#mCotizacion").oninput = () => { cotTocada = true; };
  async function cotizacionDeLaFecha(){
    if(cotTocada || tipo === "Interno") return;
    const v = await mepDe($("#mFecha").value);
    const el = $("#mCotizacion");                 // puede haberse cerrado el modal mientras tanto
    if(v > 0 && el && !cotTocada) el.value = Math.round(v * 100) / 100;
  }
  $("#mFecha").onchange = cotizacionDeLaFecha;
  if(!m) cotizacionDeLaFecha();

  $$("#segTipo button").forEach(b => b.onclick = () => {
    tipo = b.dataset.tipo;
    $$("#segTipo button").forEach(x => x.classList.toggle("on", x === b));
    sync();
  });
  ["#mCuenta","#mCuentaDestino","#mMonto","#mMontoDestino"].forEach(sel => {
    const el = $(sel);
    if(el){ el.onchange = sync; el.oninput = sync; }
  });
  sync();
  setTimeout(() => { const el = $("#mMonto"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const esInterno = tipo === "Interno";
    const fecha  = $("#mFecha").value || todayIso();
    const cuenta = $("#mCuenta").value;
    const moneda = monedaCuenta(cuenta);
    const monto  = parseFloat($("#mMonto").value) || 0;
    const cuentaDestino = esInterno ? $("#mCuentaDestino").value : "";
    const monedaDestino = esInterno ? monedaCuenta(cuentaDestino) : "";
    const categoria = esInterno ? "" : $("#mCategoria").value;
    let montoDestino = esInterno ? (parseFloat($("#mMontoDestino").value) || 0) : null;
    if(esInterno && monedaDestino === moneda) montoDestino = monto;   // misma moneda: entra lo mismo que sale

    if(!(monto > 0)){ toast("El monto tiene que ser mayor a cero"); $("#mMonto").focus(); return; }
    if(esInterno){
      if(!cuentaDestino){ toast("Elegí la cuenta destino"); return; }
      if(cuentaDestino === cuenta){ toast("La cuenta destino tiene que ser distinta"); return; }
      if(!(montoDestino > 0)){ toast("Cargá el monto que entra"); $("#mMontoDestino").focus(); return; }
    }else if(!categoria){
      toast("Elegí una categoría (o creá una en Ajustes)"); return;
    }

    const concepto = $("#mConcepto").value.trim() ||
      (esInterno ? "Transferencia interna" : (catPorId(categoria) || {}).nombre || "");

    const mov = {
      id: m ? m.id : uid(),
      mes: mesDe(fecha),
      fecha, tipo, categoria, concepto,
      cuenta, cuentaDestino, moneda, monto,
      monedaDestino, montoDestino,
      cotizacion: parseFloat($("#mCotizacion").value) || null,
      modoPago: $("#mModoPago").value,
      observacion: $("#mObservacion").value.trim(),
      timestamp: (m && m.timestamp) || new Date().toISOString()
    };

    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveMovimiento", mov});
      const i = state.movimientos.findIndex(x => x.id === mov.id);
      if(i >= 0) state.movimientos[i] = mov; else state.movimientos.push(mov);
      state.movimientos = ordenarMovs(state.movimientos);
      state.mes = mov.mes;                       // saltamos al mes del movimiento guardado
      cerrar();
      render();
      toast(m ? "Movimiento actualizado" : "Movimiento guardado");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };

  const btnBorrar = $("#mBorrar");
  if(btnBorrar) btnBorrar.onclick = async (ev) => {
    if(!confirm(`¿Borrar "${m.concepto || "este movimiento"}"?`)) return;
    const b = ev.currentTarget;
    b.disabled = true; b.textContent = "Borrando…";
    try{
      await api({action:"deleteMovimiento", id:m.id});
      state.movimientos = state.movimientos.filter(x => x.id !== m.id);
      cerrar();
      render();
      toast("Movimiento borrado");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Borrar movimiento";
    }
  };
}

    cuerpo = `<div class="empty">
      <div class="big">🏷️</div>
      <div class="t">Todavía no hay categorías</div>
      <div class="s">Creá las tuyas o arrancá con un set típico que después podés editar y borrar.</div>
      <div class="btn-row" style="justify-content:center"><button class="btn ghost sm" id="btnSeedCats">Cargar sugeridas</button></div>
    </div>`;
  }else{
    cuerpo = state.categorias.map(c => `
      <div class="item">
        <span class="swatch" style="background:${esc(c.color || COLOR_DEFAULT)}"></span>
        <span class="nm">${esc(c.nombre)}</span>
        <span class="tag">${aplicaL(c.aplica)}</span>
        <span class="acts">
          <button data-editcat="${esc(c.id)}" title="Editar">✏️</button>
          <button data-delcat="${esc(c.id)}" title="Borrar">🗑️</button>
        </span>
      </div>`).join("");
  }
  return `
  <div class="card">
    <div class="card-head">
      <div>
        <h3>Categorías</h3>
        <p class="hint" style="margin-bottom:0">Un solo nivel. Cada una aplica a egresos, a ingresos o a ambos.</p>
      </div>
      <button class="btn primary sm" id="btnNuevaCat" ${state.conectado ? "" : "disabled"} style="flex-shrink:0">＋ Nueva</button>
    </div>
    <div style="margin-top:10px">${cuerpo}</div>
  </div>`;
}

function cardModosPago(){
  let cuerpo;
  if(!state.conectado){
    cuerpo = `<div class="empty"><div class="t">Sin conexión</div><div class="s">Conectá tu backend para administrar modos de pago.</div></div>`;
  }else if(!state.modosPago.length){
    cuerpo = `<div class="empty">
      <div class="big">💳</div>
      <div class="t">Todavía no hay modos de pago</div>
      <div class="s">Efectivo, débito, crédito, transferencia… complementan a la cuenta del movimiento.</div>
      <div class="btn-row" style="justify-content:center"><button class="btn ghost sm" id="btnSeedModos">Cargar sugeridos</button></div>
    </div>`;
  }else{
    cuerpo = state.modosPago.map(x => `
      <div class="item">
        <span class="nm">${esc(x.nombre)}</span>
        <span class="acts">
          <button data-editmodo="${esc(x.id)}" title="Renombrar">✏️</button>
          <button data-delmodo="${esc(x.id)}" title="Borrar">🗑️</button>
        </span>
      </div>`).join("");
  }
  return `
  <div class="card">
    <div class="card-head"><h3>Modos de pago</h3></div>
    <div style="margin-top:4px">${cuerpo}</div>
    ${state.conectado ? `<div class="addrow">
      <input id="nuevoModo" placeholder="Agregar modo de pago…" autocomplete="off">
      <button class="btn primary sm" id="btnAddModo">Agregar</button>
    </div>` : ""}
  </div>`;
}

/* ── ABM Categorías ── */
function modalCategoria(id){
  const c = id ? state.categorias.find(x => x.id === id) : null;
  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ovCat">
    <div class="modal">
      <button class="close" id="mClose">×</button>
      <h3>${c ? "Editar categoría" : "Nueva categoría"}</h3>

      <label class="f" for="kNombre">Nombre</label>
      <input class="f" id="kNombre" value="${c ? esc(c.nombre) : ""}" placeholder="Supermercado" autocomplete="off">

      <div class="row2">
        <div>
          <label class="f" for="kAplica">Aplica a</label>
          <select class="f" id="kAplica">
            ${APLICA.map(a => `<option value="${a.v}" ${c && c.aplica === a.v ? "selected" : ""}>${a.l}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="f" for="kOrden">Orden</label>
          <input class="f num" id="kOrden" type="number" step="1" value="${c ? esc(c.orden || 0) : "0"}">
        </div>
      </div>

      <label class="f" for="kColor">Color</label>
      <input class="f" id="kColor" type="color" value="${c ? esc(c.color || COLOR_DEFAULT) : COLOR_DEFAULT}" style="height:44px;padding:4px">

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovCat").onclick = e => { if(e.target.id === "ovCat") cerrar(); };
  setTimeout(() => { const el = $("#kNombre"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const nombre = $("#kNombre").value.trim();
    if(!nombre){ toast("La categoría necesita un nombre"); $("#kNombre").focus(); return; }
    const categoria = {
      id: c ? c.id : uid(),
      nombre,
      aplica: $("#kAplica").value,
      color:  $("#kColor").value,
      orden:  parseInt($("#kOrden").value, 10) || 0,
      activo: true
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveCategoria", categoria});
      const i = state.categorias.findIndex(x => x.id === categoria.id);
      if(i >= 0) state.categorias[i] = categoria; else state.categorias.push(categoria);
      state.categorias.sort((a,z) => ((+a.orden||0)-(+z.orden||0)) || a.nombre.localeCompare(z.nombre, "es"));
      cerrar(); render();
      toast(c ? "Categoría actualizada" : "Categoría creada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };
}

async function borrarCategoria(id){
  const c = state.categorias.find(x => x.id === id);
  if(!c || !confirm(`¿Borrar la categoría "${c.nombre}"?`)) return;
  try{
    await api({action:"deleteCategoria", id});
    state.categorias = state.categorias.filter(x => x.id !== id);
    render(); toast("Categoría borrada");
  }catch(e){ toast(e.message); }
}

/* ── ABM Modos de pago ── */
function modalModoPago(id){
  const mp = id ? state.modosPago.find(x => x.id === id) : null;
  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ovModo">
    <div class="modal">
      <button class="close" id="mClose">×</button>
      <h3>${mp ? "Editar modo de pago" : "Nuevo modo de pago"}</h3>
      <label class="f" for="pNombre">Nombre</label>
      <input class="f" id="pNombre" value="${mp ? esc(mp.nombre) : ""}" placeholder="Transferencia" autocomplete="off">
      <label class="f" for="pOrden">Orden</label>
      <input class="f num" id="pOrden" type="number" step="1" value="${mp ? esc(mp.orden || 0) : "0"}">
      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
    </div>
  </div>`;
  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovModo").onclick = e => { if(e.target.id === "ovModo") cerrar(); };
  setTimeout(() => { const el = $("#pNombre"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const nombre = $("#pNombre").value.trim();
    if(!nombre){ toast("Poné un nombre"); $("#pNombre").focus(); return; }
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await guardarModoPago({id: mp ? mp.id : uid(), nombre, orden: parseInt($("#pOrden").value, 10) || 0, activo:true});
      cerrar(); render();
      toast(mp ? "Modo de pago actualizado" : "Modo de pago creado");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };
}

async function guardarModoPago(modoPago){
  await api({action:"saveModoPago", modoPago});
  const i = state.modosPago.findIndex(x => x.id === modoPago.id);
  if(i >= 0) state.modosPago[i] = modoPago; else state.modosPago.push(modoPago);
  state.modosPago.sort((a,z) => ((+a.orden||0)-(+z.orden||0)) || a.nombre.localeCompare(z.nombre, "es"));
}

async function borrarModoPago(id){
  const mp = state.modosPago.find(x => x.id === id);
  if(!mp || !confirm(`¿Borrar "${mp.nombre}"?`)) return;
  try{
    await api({action:"deleteModoPago", id});
    state.modosPago = state.modosPago.filter(x => x.id !== id);
    render(); toast("Modo de pago borrado");
  }catch(e){ toast(e.message); }
}

/* Carga en lote de los sets sugeridos */
async function cargarSugeridos(que, btn){
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "Cargando…";
  try{
    if(que === "categorias"){
      const categorias = CATEGORIAS_SUGERIDAS.map(c => ({...c, id:uid(), activo:true}));
      const d = await api({action:"saveCategorias", categorias});
      state.categorias = (d.categorias || categorias).filter(c => c.activo !== false);
    }else{
      const modosPago = MODOS_SUGERIDOS.map((nombre, i) => ({id:uid(), nombre, orden:i+1, activo:true}));
      const d = await api({action:"saveModosPago", modosPago});
      state.modosPago = (d.modosPago || modosPago).filter(m => m.activo !== false);
    }
    render(); toast("Listo, ya podés editarlos");
  }catch(e){
    toast(e.message);
    btn.disabled = false; btn.textContent = prev;
  }
}

function bindAjustes(){
  const url = $("#cfgUrl");
  const tok = $("#cfgToken");

  // Toma URL + token de los inputs; false si falta alguno.
  function tomarCredenciales(){
    const u = url.value.trim();
    if(!u){ toast("Pegá la URL del Apps Script"); url.focus(); return false; }
    const t = tok.value.trim();
    if(!t){ toast("Pegá el token del backend"); tok.focus(); return false; }
    state.url = u; state.token = t;
    return true;
  }

  $("#btnConectar").onclick = async () => {
    if(!tomarCredenciales()) return;
    localStorage.setItem("mf_url", state.url);
    localStorage.setItem("mf_token", state.token);
    await bootstrap(false);
  };

  $("#btnProbar").onclick = async (ev) => {
    const b = ev.currentTarget, prev = b.textContent;
    if(!tomarCredenciales()) return;
    b.disabled = true; b.textContent = "Probando…";
    try{
      const d = await api({action:"bootstrap"});
      toast("Conexión OK · " + (d.cuentas || []).length + " cuentas");
    }catch(e){ toast(e.message); }
    b.disabled = false; b.textContent = prev;
  };

  $("#btnMepOnline").onclick = async (ev) => {
    const b = ev.currentTarget, prev = b.textContent;
    b.disabled = true; b.textContent = "Buscando…";
    await fetchMep(false);
    b.disabled = false; b.textContent = prev;
    render();
  };

  const btnAuto = $("#btnMepAuto");
  if(btnAuto) btnAuto.onclick = async () => {
    if(state.mep) state.mep.manual = false;
    localStorage.setItem("mf_mep", JSON.stringify(state.mep));
    await fetchMep(false);
    render();
  };

  $("#btnMepManual").onclick = () => setMepManual($("#cfgMepManual").value);
  $("#cfgMepManual").onkeydown = e => { if(e.key === "Enter") setMepManual(e.currentTarget.value); };

  const nueva = $("#btnNuevaCuenta");
  if(nueva) nueva.onclick = () => modalCuenta(null);

  $$("[data-edit]").forEach(b => b.onclick = () => modalCuenta(b.dataset.edit));
  $$("[data-del]").forEach(b => b.onclick = () => borrarCuenta(b.dataset.del));

  const nuevaCat = $("#btnNuevaCat");
  if(nuevaCat) nuevaCat.onclick = () => modalCategoria(null);
  $$("[data-editcat]").forEach(b => b.onclick = () => modalCategoria(b.dataset.editcat));
  $$("[data-delcat]").forEach(b => b.onclick = () => borrarCategoria(b.dataset.delcat));
  const seedCats = $("#btnSeedCats");
  if(seedCats) seedCats.onclick = ev => cargarSugeridos("categorias", ev.currentTarget);

  $$("[data-editmodo]").forEach(b => b.onclick = () => modalModoPago(b.dataset.editmodo));
  $$("[data-delmodo]").forEach(b => b.onclick = () => borrarModoPago(b.dataset.delmodo));
  const seedModos = $("#btnSeedModos");
  if(seedModos) seedModos.onclick = ev => cargarSugeridos("modos", ev.currentTarget);

  const addModo = $("#btnAddModo"), inputModo = $("#nuevoModo");
  if(addModo){
    const agregar = async (ev) => {
      const nombre = inputModo.value.trim();
      if(!nombre){ inputModo.focus(); return; }
      const b = ev.currentTarget && ev.currentTarget.tagName === "BUTTON" ? ev.currentTarget : addModo;
      const prev = b.textContent;
      b.disabled = true; b.textContent = "Guardando…";
      try{
        await guardarModoPago({id:uid(), nombre, orden:state.modosPago.length + 1, activo:true});
        render(); toast("Modo de pago agregado");
      }catch(e){
        toast(e.message);
        b.disabled = false; b.textContent = prev;
      }
    };
    addModo.onclick = agregar;
    inputModo.onkeydown = e => { if(e.key === "Enter") agregar(e); };
  }
}

/* ── ABM Cuentas ── */
function modalCuenta(id){
  const c = id ? state.cuentas.find(x => x.id === id) : null;
  const nueva = !c;
  const opciones = TIPOS_CUENTA.map(t =>
    `<option value="${t.v}" ${c && c.tipo === t.v ? "selected" : ""}>${t.ic} ${t.l}</option>`).join("");

  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ovCuenta">
    <div class="modal">
      <button class="close" id="mClose">×</button>
      <h3>${nueva ? "Nueva cuenta" : "Editar cuenta"}</h3>
      <p class="hint">Cada cuenta maneja una sola moneda.</p>

      <label class="f" for="fNombre">Nombre</label>
      <input class="f" id="fNombre" placeholder="Efectivo ARS" value="${c ? esc(c.nombre) : ""}" autocomplete="off">

      <div class="row2">
        <div>
          <label class="f" for="fTipo">Tipo</label>
          <select class="f" id="fTipo">${opciones}</select>
        </div>
        <div>
          <label class="f" for="fMoneda">Moneda</label>
          <select class="f" id="fMoneda">
            <option value="ARS" ${c && c.moneda === "ARS" ? "selected" : ""}>ARS</option>
            <option value="USD" ${c && c.moneda === "USD" ? "selected" : ""}>USD</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="f" for="fSaldo">Saldo inicial</label>
          <input class="f num" id="fSaldo" type="number" step="0.01" value="${c ? esc(c.saldoInicial) : "0"}">
        </div>
        <div>
          <label class="f" for="fFecha">Fecha inicial</label>
          <input class="f" id="fFecha" type="date" value="${c && c.fechaInicial ? esc(isoDate(c.fechaInicial)) : todayIso()}">
        </div>
      </div>

      <label class="f" for="fOrden">Orden (opcional)</label>
      <input class="f num" id="fOrden" type="number" step="1" value="${c ? esc(c.orden || 0) : "0"}">

      <label class="check"><input type="checkbox" id="fPatrimonio" ${!c || c.enPatrimonio ? "checked" : ""}> Suma al patrimonio</label>

      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="mGuardar">Guardar</button>
      </div>
    </div>
  </div>`;

  const cerrar = () => { $("#modalRoot").innerHTML = ""; };
  $("#mClose").onclick = cerrar;
  $("#ovCuenta").onclick = e => { if(e.target.id === "ovCuenta") cerrar(); };
  setTimeout(() => { const el = $("#fNombre"); if(el) el.focus(); }, 50);

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const nombre = $("#fNombre").value.trim();
    if(!nombre){ toast("La cuenta necesita un nombre"); $("#fNombre").focus(); return; }
    const cuenta = {
      id:           c ? c.id : uid(),
      nombre,
      tipo:         $("#fTipo").value,
      moneda:       $("#fMoneda").value,
      saldoInicial: parseFloat($("#fSaldo").value) || 0,
      fechaInicial: $("#fFecha").value || todayIso(),
      enPatrimonio: $("#fPatrimonio").checked,
      orden:        parseInt($("#fOrden").value, 10) || 0,
      activo:       true
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveCuenta", cuenta});
      const i = state.cuentas.findIndex(x => x.id === cuenta.id);
      if(i >= 0) state.cuentas[i] = cuenta; else state.cuentas.push(cuenta);
      state.cuentas = ordenarCuentas(state.cuentas);
      cerrar();
      render();
      toast(c ? "Cuenta actualizada" : "Cuenta creada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };
}

async function borrarCuenta(id){
  const c = state.cuentas.find(x => x.id === id);
  if(!c) return;
  if(!confirm(`¿Borrar la cuenta "${c.nombre}"? Esta acción no se puede deshacer.`)) return;
  try{
    await api({action:"deleteCuenta", id});
    state.cuentas = state.cuentas.filter(x => x.id !== id);
    render();
    toast("Cuenta borrada");
  }catch(e){ toast(e.message); }
}

/* ══════════════════════ INIT ══════════════════════ */
$$("#curToggle button").forEach(b => b.onclick = () => {
  state.cur = b.dataset.cur;
  localStorage.setItem("mf_cur", state.cur);
  renderCurToggle();
  render();
});

$("#mepChip").onclick = () => fetchMep(false);

(async function init(){
  renderMep();
  render();
  // La cotización manual manda: no la pisamos con la online.
  if(!(state.mep && state.mep.manual)) fetchMep(true);
  if(state.url && state.token) bootstrap(true);
})();

/* PWA */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(new URL("sw.js", location.href))
      .catch(err => console.warn("SW no registrado:", err));
  });
}
</script>
</body>
</html>
