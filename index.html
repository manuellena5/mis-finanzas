  $("#mClose").onclick = cerrar;
  $("#ovInv").onclick = e => { if(e.target.id === "ovInv") cerrar(); };
  setTimeout(() => { const el = $("#iEspecie"); if(el) el.focus(); }, 50);

  function sync(){
    const moneda = $("#iMoneda").value;
    const valor  = (parseFloat($("#iCantidad").value) || 0) * (parseFloat($("#iPrecio").value) || 0);
    $("#iSim").textContent = simbolo(moneda).trim();
    const otra = convertir(valor, moneda, moneda === "ARS" ? "USD" : "ARS", rate());
    $("#iValor").innerHTML = `Valor de la tenencia: <b>${fmt(valor, moneda)}</b>` +
      (otra != null ? ` · ${fmt(otra, moneda === "ARS" ? "USD" : "ARS")} al dólar de hoy` : "");
  }
  ["#iCantidad","#iPrecio","#iMoneda"].forEach(sel => { const el = $(sel); el.oninput = sync; el.onchange = sync; });
  sync();

  $("#mGuardar").onclick = async (ev) => {
    const b = ev.currentTarget;
    const especie = $("#iEspecie").value.trim();
    const descripcion = $("#iDescripcion").value.trim();
    if(!especie && !descripcion){ toast("Poné al menos la especie"); $("#iEspecie").focus(); return; }
    const cantidad = parseFloat($("#iCantidad").value) || 0;
    const precioActual = parseFloat($("#iPrecio").value) || 0;
    if(cantidad < 0 || precioActual < 0){ toast("Cantidad y precio no pueden ser negativos"); return; }

    const inversion = {
      id: i ? i.id : uid(),
      broker: $("#iBroker").value.trim(),
      especie, descripcion,
      tipoActivo: $("#iTipo").value,
      cantidad, precioActual,
      moneda: $("#iMoneda").value,
      valorActual: cantidad * precioActual,
      fecha: $("#iFecha").value || todayIso()
    };
    b.disabled = true; b.textContent = "Guardando…";
    try{
      await api({action:"saveInversion", inversion});
      const k = state.inversiones.findIndex(x => x.id === inversion.id);
      if(k >= 0) state.inversiones[k] = inversion; else state.inversiones.push(inversion);
      cerrar(); render();
      toast(i ? "Tenencia actualizada" : "Tenencia cargada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Guardar";
    }
  };

  const btnBorrar = $("#mBorrar");
  if(btnBorrar) btnBorrar.onclick = async (ev) => {
    if(!confirm(`¿Borrar "${i.especie || i.descripcion}"?`)) return;
    const b = ev.currentTarget;
    b.disabled = true; b.textContent = "Borrando…";
    try{
      await api({action:"deleteInversion", id:i.id});
      state.inversiones = state.inversiones.filter(x => x.id !== i.id);
      cerrar(); render();
      toast("Tenencia borrada");
    }catch(e){
      toast(e.message);
      b.disabled = false; b.textContent = "Borrar tenencia";
    }
  };
}

/* ══════════════════════ PATRIMONIO ══════════════════════ */
function viewPatrimonio(){
  if(!state.conectado){
    return `<h2 class="tab-title">Patrimonio</h2>
      <div class="card"><div class="empty">
        <div class="big">🔌</div><div class="t">Sin conexión</div>
        <div class="s">Conectá tu backend en <b>Ajustes</b> para ver tu patrimonio.</div>
      </div></div>`;
  }
  if(!cuentasActivas().length){
    return `<h2 class="tab-title">Patrimonio</h2>
      <div class="card"><div class="empty">
        <div class="big">🏦</div><div class="t">Todavía no hay cuentas</div>
        <div class="s">El patrimonio se arma con el saldo de tus cuentas. Creá la primera en <b>Ajustes</b>.</div>
      </div></div>`;
  }

  const saldos = saldosPorCuenta();
  const p      = patrimonio();
  const enPat  = cuentasActivas().filter(c => c.enPatrimonio);
  const fuera  = cuentasActivas().filter(c => !c.enPatrimonio);

  /* Valor de cada cuenta en ARS y USD, al dólar de hoy */
  const valorDe = c => ({
    ars: convertir(saldos[c.id], c.moneda, "ARS", rate()),
    usd: convertir(saldos[c.id], c.moneda, "USD", rate())
  });

  /* Composición sobre todo lo que suma: cuentas + tenencias */
  const activos = activosPatrimonio();
  const grupos = (claveDe, infoDe) => {
    const map = {};
    for(const a of activos){
      const k = claveDe(a);
      if(!map[k]) map[k] = Object.assign(acum(), infoDe(k));
      sumar(map[k], a.monto, a.moneda, rate());
    }
    return Object.values(map).sort((a,b) => (state.cur === "USD" ? b.usd - a.usd : b.ars - a.ars));
  };

  const porMoneda = grupos(a => a.moneda,
    k => ({nombre:k === "USD" ? "Dólares" : "Pesos", color:k === "USD" ? COLOR_USD : COLOR_ARS}));
  const porTipo = grupos(a => a.tipo,
    k => ({nombre:tipoInfo(k).l, color:tipoInfo(k).color}));

  const totalFuera = fuera.reduce((a,c) => { const v = valorDe(c); return a + (v.ars || 0); }, 0);
  const totalFueraUsd = fuera.reduce((a,c) => { const v = valorDe(c); return a + (v.usd || 0); }, 0);

  /* Detalle agrupado por tipo de cuenta */
  const detalle = TIPOS_CUENTA.map(t => {
    const cuentas = enPat.filter(c => c.tipo === t.v);
    if(!cuentas.length) return "";
    return `<p class="hint" style="margin:14px 0 2px">${t.ic} ${t.l}</p>` +
      cuentas.map(c => filaSaldoCuenta(c, saldos[c.id], p.ars)).join("");
  }).join("");

  return `
    <h2 class="tab-title">Patrimonio</h2>

    <div class="hero">
      <div class="lbl">Total hoy</div>
      <div class="v num">${state.cur === "USD" ? fmt(p.usd, "USD", 0) : fmt(p.ars, "ARS", 0)}</div>
      ${state.cur === "ambas" ? `<div class="u num">${fmt(p.usd, "USD", 0)}</div>` : ""}
      <div class="u">${enPat.length} ${enPat.length === 1 ? "cuenta" : "cuentas"}${state.inversiones.length ? ` · ${state.inversiones.length} ${state.inversiones.length === 1 ? "tenencia" : "tenencias"}` : ""}${rate() ? ` · dólar de hoy $${nf(rate(), 0)}` : " · sin cotización"}</div>
    </div>

    ${cardComposicion("Por moneda", porMoneda)}
    ${cardComposicion("Por tipo de cuenta", porTipo)}

    <div class="card">
      <div class="card-head"><h3>Detalle por cuenta</h3><span class="tag">hoy</span></div>
      ${detalle || `<div class="empty"><div class="s">Ninguna cuenta suma al patrimonio.</div></div>`}
    </div>

    ${fuera.length ? `
    <div class="card">
      <div class="card-head">
        <div>
          <h3>Fuera del patrimonio</h3>
          <p class="hint" style="margin-bottom:0">Cuentas con <b>EnPatrimonio</b> desactivado (normalmente tarjetas).</p>
        </div>
      </div>
      <div style="margin-top:8px">${fuera.map(c => filaSaldoCuenta(c, saldos[c.id], 0)).join("")}</div>
      <div class="item" style="border-top:1px solid var(--line);border-bottom:none;margin-top:4px">
        <span class="nm" style="color:var(--muted)">Total</span>
        <span class="num" style="font-weight:700;text-align:right">${totalVista(totalFuera, totalFueraUsd)}</span>
      </div>
      ${totalFuera < 0 ? `<p class="hint" style="margin:10px 0 0">Patrimonio neto descontando estas cuentas: <b>${state.cur === "USD" ? fmt(p.usd + totalFueraUsd, "USD", 0) : fmt(p.ars + totalFuera, "ARS", 0)}</b>.</p>` : ""}
    </div>` : ""}

    ${(() => {
      const conSaldo = state.cuentas.filter(c => c.activo === false && saldos[c.id]);
      if(!conSaldo.length) return "";
      return `
      <div class="card">
        <div class="card-head"><h3>Cuentas archivadas con saldo</h3></div>
        <p class="hint">No suman al patrimonio. Si todavía tenés esa plata, reactivalas en Ajustes; si la cuenta se cerró, cargá el movimiento que la vació.</p>
        <div>${conSaldo.map(c => filaSaldoCuenta(c, saldos[c.id], 0)).join("")}</div>
      </div>`;
    })()}

    ${cardInversionesEnPatrimonio()}`;
}

/** Las tenencias dentro del patrimonio: total por broker y aviso de doble conteo. */
function cardInversionesEnPatrimonio(){
  if(!state.inversiones.length){
    return `
    <div class="card">
      <div class="card-head"><h3>Inversiones</h3></div>
      <p class="hint" style="margin-bottom:0">Todavía no hay tenencias cargadas. Las que cargues en <b>Inversiones</b> suman acá y al total de arriba.</p>
    </div>`;
  }
  const t = totalInversiones();
  const porBroker = {};
  for(const i of state.inversiones){
    const k = i.broker || "Sin broker";
    if(!porBroker[k]) porBroker[k] = Object.assign(acum(), {nombre:k});
    sumar(porBroker[k], valorInversion(i), i.moneda, rate());
  }
  const filas = Object.values(porBroker)
    .sort((a,b) => (state.cur === "USD" ? b.usd - a.usd : b.ars - a.ars))
    .map(b => `<div class="item">
      <span style="width:20px;text-align:center;flex-shrink:0">📈</span>
      <span class="nm">${esc(b.nombre)}</span>
      <span class="num" style="font-weight:600;font-size:14px;text-align:right">${totalVista(b.ars, b.usd)}</span>
    </div>`).join("");

  // Una cuenta de tipo Inversión con saldo, más tenencias cargadas, puede estar contando dos veces lo mismo.
  const cuentasInv = cuentasActivas().filter(c => c.enPatrimonio && c.tipo === "inversion" && saldosPorCuenta()[c.id] !== 0);

  return `
  <div class="card">
    <div class="card-head">
      <h3>Inversiones</h3>
      <span class="num" style="font-weight:700;font-size:14px;text-align:right">${totalVista(t.ars, t.usd)}</span>
    </div>
    <div style="margin-top:6px">${filas}</div>
    ${cuentasInv.length ? `<p class="hint" style="margin:12px 0 0">Ojo: ${cuentasInv.map(c => `<b>${esc(c.nombre)}</b>`).join(", ")} ${cuentasInv.length === 1 ? "es una cuenta" : "son cuentas"} de tipo Inversión con saldo. Si ${cuentasInv.length === 1 ? "representa" : "representan"} lo mismo que estas tenencias, el patrimonio lo está contando dos veces: desmarcá <b>Suma al patrimonio</b> en esa cuenta o dejá una sola de las dos fuentes.</p>` : ""}
  </div>`;
}

/** Fila de cuenta con su saldo y, si se pasa el total, su peso en el patrimonio. */
function filaSaldoCuenta(c, saldo, totalArs){
  const vista = montoVista(saldo, c.moneda, rate());
  const ars   = convertir(saldo, c.moneda, "ARS", rate());
  const pct   = (totalArs > 0 && ars != null && ars > 0) ? Math.round(ars / totalArs * 100) : null;
  return `<div class="item">
    <span style="width:20px;text-align:center;flex-shrink:0">${tipoInfo(c.tipo).ic}</span>
    <span class="nm">${esc(c.nombre)}</span>
    ${pct != null ? `<span class="tag">${pct}%</span>` : ""}
    <span style="text-align:right;flex-shrink:0"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
      <span class="num" style="font-weight:600;font-size:14px;display:block">${vista.txt}</span>
      ${vista.sub ? `<span style="font-size:10.5px;color:var(--faint)">${esc(vista.sub)}</span>` : ""}
    </span>
  </div>`;
}

/** Tarjeta de composición: barras con el peso de cada grupo. */
function cardComposicion(titulo, filasTodas){
  const enUsd = state.cur === "USD";
  const valor = f => enUsd ? f.usd : f.ars;
  // Un grupo que no se pudo convertir no se muestra en cero: se avisa aparte.
  const filas    = filasTodas.filter(f => valor(f) !== 0 || !faltan(f));
  const omitidos = filasTodas.length - filas.length;
  const total    = filas.reduce((a,f) => a + Math.max(0, valor(f)), 0);
  if(!filas.length || total <= 0){
    return `<div class="card">
      <div class="card-head"><h3>${esc(titulo)}</h3></div>
      <div class="empty" style="padding:18px 10px"><div class="s">Sin saldos positivos para repartir.</div></div>
    </div>`;
  }
  const barras = filas.map(f => {
    const pct = Math.round(Math.max(0, valor(f)) / total * 100);
    const val = fmt(valor(f), enUsd ? "USD" : "ARS", 0);
    return `<div class="bar">
      <div class="bl">
        <span class="dot" style="background:${esc(f.color)}"></span>
        <span class="nm">${esc(f.nombre)}</span>
        <span class="pct">${pct}%</span>
        <span class="val num">${val}</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${esc(f.color)}"></div></div>
    </div>`;
  }).join("");
  return `<div class="card">
    <div class="card-head"><h3>${esc(titulo)}</h3></div>
    <div class="bars">${barras}</div>
    ${omitidos ? `<p class="hint" style="margin:12px 0 0">${omitidos} ${omitidos === 1 ? "grupo quedó" : "grupos quedaron"} fuera: sin cotización para expresarlo${omitidos === 1 ? "" : "s"} en ${state.cur === "USD" ? "dólares" : "pesos"}.</p>` : ""}
  </div>`;
}

/* ══════════════════════ IMPORTACIÓN DE RESÚMENES ══════════════════════ */
function modalImportar(){
  const est = { datos:null, filas:[], periodo:"", fechaResumen:"", cuentaArs:"", cuentaUsd:"", archivo:"",
                modo:"tarjeta", detectadas:[], solapa:"", banco:null, tarjetas:[],
                mapeoAbierto:true, mapeoFalta:-1 };

  $("#modalRoot").innerHTML = `<div class="overlay" id="ovImp"><div class="modal wide" id="impBody"></div></div>`;
  const cerrar = () => { document.removeEventListener("keydown", onTecla); $("#modalRoot").innerHTML = ""; };

  /* A diferencia del resto de los modales, éste NO se cierra por click afuera:
     un resbalón del mouse tiraba a la basura el mapeo, las categorías y los
     internos ya armados. Sólo cierra con la ✕ o con Escape, y si hay filas
     cargadas todavía sin confirmar, pregunta antes. */
  function intentarCerrar(){
    if(est.filas.length && !confirm("¿Descartar la importación? Se pierde lo que cargaste.")) return;
    cerrar();
  }
  function onTecla(e){ if(e.key === "Escape"){ e.preventDefault(); intentarCerrar(); } }
  document.addEventListener("keydown", onTecla);

  /* ── Paso 1: archivo ── */
  function vistaArchivo(){
    return `
      <button class="close" id="mClose">×</button>
      <h3>Importar resumen de tarjeta</h3>
      <p class="hint">Resumen de Visa, Amex o Mastercard en <b>.pdf</b> o <b>.xlsx</b>. El archivo se lee en tu navegador: no se sube a ningún lado.</p>
      <div class="drop" id="dropZone">
        <span class="big">⬆</span>
        Arrastrá el archivo acá o tocá para elegirlo
      </div>
      <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls" class="hidden">
      <p class="hint" style="margin-top:14px">Los resúmenes de caja de ahorro y las tenencias de broker todavía no: por ahora sólo tarjetas.</p>`;
  }

  function bindArchivo(){
    $("#mClose").onclick = intentarCerrar;
    const zona = $("#dropZone"), input = $("#fileInput");
    zona.onclick = () => input.click();
    input.onchange = () => { if(input.files[0]) leerArchivo(input.files[0]); };
    zona.ondragover = e => { e.preventDefault(); zona.classList.add("over"); };
    zona.ondragleave = () => zona.classList.remove("over");
    zona.ondrop = e => {
      e.preventDefault(); zona.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if(f) leerArchivo(f);
    };
  }

  async function leerArchivo(file){
    const esPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
    try{
      let lineas, meta, info;

      if(esPdf){
        if(typeof pdfjsLib === "undefined"){ toast("El lector de PDF todavía está cargando, probá en un segundo"); return; }
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const conItems = await pdfLineasItems(file);

        // Resumen de cuenta: varias cuentas y las tarjetas embebidas
        if(esResumenDeCuenta(conItems)){
          est.modo = "cuenta";
          est.archivo = file.name;
          prepararResumenCuenta(conItems);
          if(!est.filas.length){ toast("No encontré movimientos en ese resumen"); return; }
          est.datos = { emisor:"Santander", numero:"", lineas:[], meta:{} };
          est.solapa = est.detectadas[0] ? est.detectadas[0].clave : "";
          pintar();
          return;
        }

        const lines = conItems.map(l => l.texto);
        ({ lineas, meta } = parseTarjetaPDF(lines));
        info = detectarEmisorPDF(lines, meta.card);
      }else{
        if(typeof XLSX === "undefined"){ toast("El lector de Excel todavía está cargando, probá en un segundo"); return; }
        const buf = await file.arrayBuffer();
        const wb  = XLSX.read(buf, {type:"array"});
        const ws  = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
        ({ lineas, meta } = parseTarjeta(aoa));
        info = detectarEmisor(aoa);
      }

      if(!lineas.length){ toast("No encontré consumos en ese archivo"); return; }
      est.datos   = { ...info, lineas, meta };
      est.archivo = file.name;
      est.modo    = "tarjeta";
      est.fechaResumen = meta.cierreIso || "";
      est.periodo = meta.periodo || (est.fechaResumen ? periodoDesdeCierre(est.fechaResumen) : mesActual());
      elegirCuentas();
      construirFilas();
      pintar();
    }catch(e){ toast("No pude leer el archivo: " + e.message); }
  }

  /* Autocompleta las cuentas de la tarjeta: por número, por emisor, o la primera del tipo. */
  function elegirCuentas(){
    const tarjetas = cuentasActivas().filter(c => c.tipo === "tarjeta");
    const buscar = mon => {
      const cand = tarjetas.filter(c => c.moneda === mon);
      const porNumero = est.datos.numero ? cand.find(c => c.nombre.includes(est.datos.numero)) : null;
      const porEmisor = cand.find(c => c.nombre.toLowerCase().includes(est.datos.emisor.toLowerCase()));
      return ((porNumero || porEmisor || cand[0]) || {}).id || "";
    };
    est.cuentaArs = buscar("ARS");
    est.cuentaUsd = buscar("USD");
  }

  function construirFilas(){
    est.filas = est.datos.lineas.map((l, i) => {
      const concepto = l.desc + textoCuotas(l.cuotas);
      const regla = aplicarReglas(concepto);
      return {
        i, fecha:l.fechaIso, concepto, moneda:l.moneda,
        fechaResumen: est.fechaResumen || l.fechaIso,   // el cierre del resumen
        monto: Math.abs(l.importe),
        tipo: l.importe < 0 ? "Ingreso" : "Egreso",   // negativo = pago o devolución
        esPago: l.importe < 0,
        esImpuesto: !!l.impuesto,
        categoria: (regla && regla.categoria) || "",
        reglaId: regla ? regla.id : "",
        categoriaManual: false,
        nuevaRegla: null,                              // {patron, tipoPatron, categoria, tipo, prioridad}
        sel: true
      };
    });
    revisarDuplicados();
  }

  /* ── Resumen de cuenta: cuentas detectadas, filas por cuenta e internos ── */
  function prepararResumenCuenta(lineas){
    const banco    = parseResumenBanco(lineas);
    const tarjetas = parseTarjetasEmbebidas(lineas);
    est.banco = banco;
    est.tarjetas = tarjetas;

    // Cuentas detectadas: las del banco + una por tarjeta y moneda
    const det = banco.cuentas.map(c => ({
      clave: c.clave, nombre: c.nombre, moneda: c.moneda, clase: "banco",
      saldoInicial: c.saldoInicial, cuentaApp: ""
    }));
    tarjetas.forEach(t => {
      const monedas = [...new Set(t.lineas.map(l => l.moneda))];
      monedas.forEach(mon => det.push({
        clave: `tarjeta:${t.numero}:${mon}`,
        nombre: `${t.emisor} ${t.numero}${mon === "USD" ? " (dólares)" : ""}`,
        moneda: mon, clase: "tarjeta", tarjeta: t, cuentaApp: ""
      }));
    });
    est.detectadas = det;
    autoMapear();

    /* Pagos de tarjeta: la pata del banco se convierte en Interno banco→tarjeta y
       el "Tu pago" del resumen de la tarjeta se saltea, para no contarlo dos veces. */
    const pagosTarjetaUsados = new Set();
    const filas = [];
    let idx = 0;

    banco.movs.forEach(m => {
      const esPagoTarjeta = /pago de tarjeta/i.test(m.concepto) && m.importe < 0;
      let destino = null;
      if(esPagoTarjeta){
        for(const t of tarjetas){
          const clave = `tarjeta:${t.numero}:${m.moneda}`;
          if(!det.some(d => d.clave === clave)) continue;
          const cand = t.lineas.find((l, i) =>
            l.clase === "pago" && /tu pago/i.test(l.desc) && l.moneda === m.moneda &&
            Math.abs(Math.abs(l.importe) - Math.abs(m.importe)) < 0.01 &&
            !pagosTarjetaUsados.has(t.numero + "|" + i));
          if(cand){
            pagosTarjetaUsados.add(t.numero + "|" + t.lineas.indexOf(cand));
            destino = clave;
            break;
          }
        }
      }
      filas.push(nuevaFila(idx++, {
        grupo: m.cuentaDetectada,
        fecha: m.fechaIso,
        concepto: m.concepto,
        moneda: m.moneda,
        monto: Math.abs(m.importe),
        tipo: destino ? "Interno" : (m.importe < 0 ? "Egreso" : "Ingreso"),
        tipoBase: m.importe < 0 ? "Egreso" : "Ingreso",   // a qué vuelve si se deshace el interno
        destinoGrupo: destino || "",
        esPagoTarjeta,
        origen: "banco"
      }));
    });

    tarjetas.forEach(t => {
      t.lineas.forEach((l, i) => {
        if(l.clase === "pago" && /tu pago/i.test(l.desc) && pagosTarjetaUsados.has(t.numero + "|" + i)) return;   // ya está como Interno
        const clave = `tarjeta:${t.numero}:${l.moneda}`;
        filas.push(nuevaFila(idx++, {
          grupo: clave,
          fecha: l.fechaIso,
          fechaResumen: t.meta.cierreIso || l.fechaIso,
          concepto: l.desc + textoCuotas(l.cuotas),
          moneda: l.moneda,
          monto: Math.abs(l.importe),
          tipo: l.importe < 0 ? "Ingreso" : "Egreso",
          esImpuesto: !!l.impuesto,
          esPago: l.importe < 0,
          observacion: `Resumen ${t.meta.periodo}` + (t.meta.vencIso ? ` · vence ${dispDate(t.meta.vencIso)}` : ""),
          origen: "tarjeta"
        }));
      });
    });

    est.filas = filas;
    sugerirInternos();
    revisarDuplicados();
  }

  /** Fila de preview con los defaults comunes (categoría por reglas incluida). */
  function nuevaFila(i, datos){
    const regla = datos.tipo === "Interno" ? null : aplicarReglas(datos.concepto);
    return {
      i, fechaResumen: datos.fecha, categoria: (regla && regla.categoria) || "",
      reglaId: regla ? regla.id : "", categoriaManual: false, nuevaRegla: null,
      sel: true, destinoGrupo: "", esImpuesto: false, esPago: false, observacion: "",
      tipoBase: datos.tipo === "Interno" ? "Egreso" : datos.tipo,
      absorbidoPor: null, parAbsorbido: null, unir: false, mep: false,
      ...datos
    };
  }

  /* Una fila absorbida es la pata espejo de un interno: se sigue viendo dentro de
     la tarjeta del interno, pero no se importa ni cuenta como movimiento aparte.
     Ojo con el índice 0: `!f.absorbidoPor` daría true para la primera fila. */
  const absorbida = f => f.absorbidoPor != null;

  /** Empareja egresos e ingresos espejo entre cuentas propias del mismo resumen. */
  function sugerirInternos(){
    const libres = est.filas.filter(f => f.origen === "banco" && f.tipo !== "Interno");
    for(const salida of libres){
      if(salida.tipo !== "Egreso" || salida.destinoGrupo) continue;
      const par = libres.find(e =>
        e.tipo === "Ingreso" && !e.destinoGrupo && e.grupo !== salida.grupo &&
        e.moneda === salida.moneda &&
        Math.abs(e.monto - salida.monto) < 0.01 &&
        Math.abs(new Date(e.fecha) - new Date(salida.fecha)) <= 86400000 * 2);
      if(!par) continue;
      salida.tipo = "Interno";
      salida.destinoGrupo = par.grupo;
      salida.sugerido = true;
      salida.categoria = "";
      salida.parAbsorbido = par.i;
      par.sel = false;                    // la pata espejo no se importa por separado
      par.absorbidoPor = salida.i;
    }
  }

  function autoMapear(){
    est.detectadas.forEach(d => {
      if(d.cuentaApp) return;
      const candidatas = cuentasActivas().filter(c => c.moneda === d.moneda);
      let m = null;
      if(d.clase === "tarjeta"){
        const tarj = candidatas.filter(c => c.tipo === "tarjeta");
        m = tarj.find(c => d.tarjeta.numero && c.nombre.includes(d.tarjeta.numero)) ||
            tarj.find(c => c.nombre.toLowerCase().includes(d.tarjeta.emisor.toLowerCase()));
      }else{
        /* Sólo mapeamos solo si el nombre coincide: con una única cuenta bancaria
           en esa moneda, adivinar mandaría la Cuenta Corriente a la Caja de Ahorro. */
        const clave = /corriente/i.test(d.nombre) ? "corriente" : /ahorro/i.test(d.nombre) ? "ahorro" : "";
        m = clave ? candidatas.find(c => c.nombre.toLowerCase().includes(clave)) : null;
      }
      d.cuentaApp = (m || {}).id || "";
    });
  }

  const grupoPorClave = clave => est.detectadas.find(d => d.clave === clave) || null;
  const cuentaDeGrupo = clave => (grupoPorClave(clave) || {}).cuentaApp || "";

  /** Regla prellenada a partir de una fila, para el editor inline. */
  function reglaDesdeFila(f){
    return {
      patron: patronDesde(f.concepto),
      tipoPatron: "contiene",
      categoria: f.categoria || "",
      tipo: "",
      prioridad: 10
    };
  }

  /** Cuántas filas del resumen matchearía un patrón que se está editando. */
  function alcanceRegla(regla){
    if(!regla || !String(regla.patron || "").trim()) return [];
    return est.filas.filter(f => matchRegla(f.concepto, regla)).map(f => f.i);
  }

  /* Clave sin la cuenta: si la fila se marcó como Interno (o se re-mapeó a otra
     cuenta), su hash cambia y el exacto ya no la reconocería como repetida. */
  const claveSinCuenta = m => [isoDate(m.fecha), Math.round((+m.monto || 0) * 100),
                               String(m.concepto || "").toLowerCase().slice(0, 40)].join("|");

  /** Recalcula el hash con la cuenta elegida y marca lo que ya está cargado. */
  function revisarDuplicados(){
    const existentes = new Set(state.movimientos.map(m => m.hash || calcHash(m)));
    const sinCuenta  = new Set(state.movimientos.map(claveSinCuenta));
    for(const f of est.filas){
      f.cuenta = est.modo === "cuenta" ? cuentaDeGrupo(f.grupo)
                                       : (f.moneda === "USD" ? est.cuentaUsd : est.cuentaArs);
      // En un interno, el movimiento se guarda en la cuenta de origen
      const cuentaHash = f.tipo === "Interno" ? (origenDeFila(f) || f.cuenta) : f.cuenta;
      f.hash = calcHash({fecha:f.fecha, monto:f.monto, concepto:f.concepto, cuenta:cuentaHash});
      f.dup = existentes.has(f.hash) || sinCuenta.has(claveSinCuenta(f));
      if(f.dup) f.sel = false;
    }
  }

  /* ── Paso 2: mapeo + preview ── */
  function optCuentasTarjeta(mon, sel){
    const cand = cuentasActivas().filter(c => c.moneda === mon);
    return `<option value="">— elegir cuenta ${mon} —</option>` + cand.map(c =>
      `<option value="${esc(c.id)}" ${sel === c.id ? "selected" : ""}>${esc(c.nombre)}${c.tipo === "tarjeta" ? "" : " · " + tipoInfo(c.tipo).l}</option>`).join("");
  }

  /* ── Internos armados a mano ── */
  /** Origen: la cuenta elegida a mano, o la que sale del mapeo de la fila. */
  const origenDeFila = f => f.tipo === "Interno" ? (f.origenManual ? (f.origenId || "") : f.cuenta) : f.cuenta;
  const destinoDeFila = f => f.destinoManual ? (f.destinoId || "") : (f.destinoGrupo ? cuentaDeGrupo(f.destinoGrupo) : "");
  const monedaDeCuenta = id => monedaCuenta(id);

  /** Monto que entra: igual al que sale si las dos cuentas son de la misma moneda. */
  function montoDestinoDe(f){
    const org = origenDeFila(f), dst = destinoDeFila(f);
    if(!org || !dst) return null;
    if(monedaDeCuenta(org) === monedaDeCuenta(dst)) return f.monto;
    return f.montoDestino != null ? f.montoDestino : null;
  }

  /** Qué le falta a una fila Interno para poder importarse. */
  function faltaInterno(f){
    if(f.tipo !== "Interno") return "";
    const org = origenDeFila(f), dst = destinoDeFila(f);
    if(!org) return "Falta la cuenta de origen";
    if(!dst) return "Falta la cuenta destino";
    if(org === dst) return "Origen y destino tienen que ser distintos";
    if(!(montoDestinoDe(f) > 0)) return "Falta el monto que entra";
    return "";
  }

  function cambiarTipoFila(i, nuevo){
    const f = est.filas[i];
    if(f.tipo === "Interno" && nuevo !== "Interno") deshacerUnion(f);
    if(nuevo === "Interno"){
      // Prellenado por el signo: lo que entró ya tiene destino; lo que salió, origen
      const propia = f.cuenta;
      if(f.tipo === "Ingreso"){ f.destinoId = propia; f.origenId = ""; }
      else { f.origenId = propia; f.destinoId = ""; }
      f.origenManual = true; f.destinoManual = true;
      f.categoria = ""; f.nuevaRegla = null; f.montoDestino = null;
      /* La fila se muda a la solapa de internos, pero NO vamos con ella: uno
         está categorizando esta cuenta y saltar de solapa corta el trabajo.
         Avisamos con un toast para que no parezca que la fila se perdió. */
      if(est.modo === "cuenta") toast("Pasó a «Internos / transferencias»: completá ahí el origen y el destino");
    }else{
      f.origenId = ""; f.destinoId = ""; f.destinoGrupo = "";
      f.origenManual = false; f.destinoManual = false; f.montoDestino = null;
    }
    f.tipo = nuevo;
    revisarDuplicados();
    pintar();
  }

  /** Devuelve a la tabla la pata espejo que este interno había absorbido (MEP o sugerido). */
  function deshacerUnion(f){
    const par = f.parAbsorbido != null ? est.filas[f.parAbsorbido] : null;
    if(par){ par.absorbidoPor = null; par.sel = !par.dup; }
    f.parAbsorbido = null; f.mep = false; f.mepConceptos = null; f.sugerido = false;
  }

  /* ── Compra/venta de dólar MEP: dos patas del resumen → un solo Interno ──
     Una operación MEP sale en el resumen como dos líneas (sale de la caja en
     dólares, entra en la de pesos, o al revés). Se marcan las dos con el botón
     ⇄ y se unen: la que sale queda como Interno y la que entra se absorbe, así
     no se cuenta dos veces. El TC implícito es el MEP de esa operación. */
  const marcadasUnir = () => est.filas.filter(f => f.unir && !absorbida(f));

  /** Qué le falta al par marcado para poder unirse. Devuelve "" si está listo. */
  function validarUnion(ms){
    if(ms.length !== 2) return "Marcá exactamente dos líneas: la que sale y la que entra.";
    const sale  = ms.filter(f => f.tipo === "Egreso");
    const entra = ms.filter(f => f.tipo === "Ingreso");
    if(sale.length !== 1 || entra.length !== 1) return "Tiene que ser una línea que sale y otra que entra.";
    if(sale[0].grupo === entra[0].grupo) return "Las dos líneas son de la misma cuenta.";
    if(!sale[0].cuenta || !entra[0].cuenta) return "Falta asignar la cuenta de alguna de las dos.";
    if(monedaDeCuenta(sale[0].cuenta) === monedaDeCuenta(entra[0].cuenta))
      return "Las dos cuentas son de la misma moneda: no es una compra/venta de dólares.";
    return "";
  }

  function unirComoInterno(){
    const ms = marcadasUnir();
    const err = validarUnion(ms);
    if(err){ toast(err); return; }
    const sale  = ms.find(f => f.tipo === "Egreso");
    const entra = ms.find(f => f.tipo === "Ingreso");
    sale.tipo = "Interno";
    sale.origenManual  = true; sale.origenId  = sale.cuenta;
    sale.destinoManual = true; sale.destinoId = entra.cuenta;
    sale.montoDestino  = entra.monto;
    sale.categoria = ""; sale.nuevaRegla = null;
    sale.mep = true;
    sale.mepConceptos = [sale.concepto, entra.concepto];
    sale.parAbsorbido = entra.i;
    entra.absorbidoPor = sale.i;
    entra.sel = false;
    sale.unir = entra.unir = false;
    est.solapa = GRUPO_INTERNOS;
    revisarDuplicados();
    pintar();
  }

  function limpiarUnir(){ est.filas.forEach(f => f.unir = false); pintar(); }

  /** Barra de acción que aparece al marcar filas con el ⇄. */
  function barraUnir(){
    const ms = marcadasUnir();
    if(!ms.length) return "";
    const err = validarUnion(ms);
    const detalle = ms.map(f =>
      `${f.tipo === "Ingreso" ? "entra" : "sale"} ${fmt(f.monto, f.moneda)}`).join(" + ");
    return `<div class="mepBar">
      <span class="txt"><b>${ms.length}</b> marcada${ms.length === 1 ? "" : "s"} para unir · ${esc(detalle)}${
        err ? ` · <span class="mal">${esc(err)}</span>` : ""}</span>
      <button class="btn primary sm" id="btnUnirMep" ${err ? "disabled" : ""}
        title="Un MEP es cambiar tu propia plata de una moneda a otra: por eso es un Interno, no un ingreso ni un gasto. El tipo de cambio implícito es cuántos pesos por dólar te quedó.">Unir como interno (compra/venta de dólares)</button>
      <button class="btn ghost sm" id="btnLimpiarUnir">Cancelar</button>
    </div>`;
  }

  /** Editor inline de un Interno: origen, destino y —si cambian de moneda— el monto que entra. */
  function editorInterno(f){
    const org = origenDeFila(f), dst = destinoDeFila(f);
    const opciones = (sel) => `<option value="">— elegir —</option>` + cuentasActivas().map(c =>
      `<option value="${esc(c.id)}" ${sel === c.id ? "selected" : ""}>${esc(c.nombre)} · ${esc(c.moneda)}</option>`).join("");
    const cambio = org && dst && monedaDeCuenta(org) !== monedaDeCuenta(dst);
    const tc = cambio ? tcImplicito({ monto:f.monto, montoDestino:f.montoDestino,
                                      moneda:monedaDeCuenta(org), monedaDestino:monedaDeCuenta(dst) }) : 0;
    const falta = faltaInterno(f);
    return `
    <tr class="reglaEd" data-internoed="${f.i}">
      <td></td>
      <td colspan="${colsTabla() - 1}">
        <div class="reglaform">
          <label>Sale de
            <select data-origen="${f.i}">${opciones(org)}</select>
          </label>
          <label>Entra en
            <select data-destinoc="${f.i}">${opciones(dst)}</select>
          </label>
          ${cambio ? `
          <label>Monto que entra (${esc(monedaDeCuenta(dst))})
            <input type="number" step="0.01" min="0" style="width:130px" data-mdest="${f.i}" value="${f.montoDestino != null ? esc(f.montoDestino) : ""}">
          </label>` : ""}
          <span class="rinfo ${falta ? "vacio" : ""}">${falta ? esc(falta)
            : cambio ? (tc ? `Tipo de cambio implícito: $${nf(tc, 2)} por USD` : "Cargá el monto que entra")
            : `Entra ${fmt(f.monto, f.moneda)} en la cuenta destino`}</span>
        </div>
      </td>
    </tr>`;
  }

  /* ── Solapa Internos: una tarjeta de dos lados por movimiento ──
     Los internos NO se muestran también en la solapa de la cuenta de origen o
     destino: viven sólo acá, para que en cada cuenta se vean sus ingresos y
     egresos y nada más. */
  function tarjetaInterno(f){
    const org = origenDeFila(f), dst = destinoDeFila(f);
    const opciones = sel => `<option value="">— elegir —</option>` + cuentasActivas().map(c =>
      `<option value="${esc(c.id)}" ${sel === c.id ? "selected" : ""}>${esc(c.nombre)} · ${esc(c.moneda)}</option>`).join("");
    const monOrg = org ? monedaDeCuenta(org) : f.moneda;
    const monDst = dst ? monedaDeCuenta(dst) : "";
    const cambio = org && dst && monOrg !== monDst;
    const mdst   = montoDestinoDe(f);
    const tc = cambio ? tcImplicito({ monto:f.monto, montoDestino:mdst,
                                      moneda:monOrg, monedaDestino:monDst }) : 0;
    const falta = faltaInterno(f);

    const etiqueta = f.mep ? `<span class="tag usd" title="Compra/venta de dólares armada uniendo dos líneas del resumen">MEP · 2 líneas</span>`
      : f.esPagoTarjeta ? `<span class="tag ok">pago de tarjeta · detectado</span>`
      : f.sugerido      ? `<span class="tag ok">detectado</span>`
                        : `<span class="tag">manual</span>`;

    /* Cuando el origen sale del mapeo (pago de tarjeta), lo que falta no es el
       interno sino asignar esa cuenta bancaria arriba: lo decimos así. */
    const pie = falta
      ? (falta === "Falta la cuenta de origen" && !f.origenManual
          ? "Asigná la cuenta bancaria en «Cuentas detectadas» y el origen se completa solo"
          : falta)
      : cambio
        ? `Tipo de cambio implícito: $${nf(tc, 2)} por USD`
        : `Mueve ${fmt(f.monto, monOrg)} entre dos cuentas tuyas`;

    const desdeDos = f.mep && f.mepConceptos
      ? `<span class="de"> · viene de dos líneas: «${esc(f.mepConceptos[0])}» y «${esc(f.mepConceptos[1])}»</span>` : "";

    return `
    <div class="intCard ${falta ? "conError" : ""}${f.dup ? " dup" : ""}" data-int="${f.i}">
      <div class="top">
        <input type="checkbox" data-sel="${f.i}" ${f.sel ? "checked" : ""} ${f.dup ? "disabled" : ""}>
        <input type="date" data-fecha="${f.i}" value="${esc(f.fecha)}">
        <span class="cpt">${esc(f.concepto)}</span>
        ${etiqueta}
        <span data-dup="${f.i}">${f.dup ? `<span class="tag off">ya está</span>` : ""}</span>
        <span class="acts">
          <button class="btn ghost sm" data-desunir="${f.i}">${f.parAbsorbido != null ? "Separar" : "No es interno"}</button>
        </span>
      </div>
      <div class="patas">
        <div class="pata">
          <div class="lbl">Sale de</div>
          <select data-origen="${f.i}">${opciones(org)}</select>
          <div class="mto sale">− ${fmt(f.monto, monOrg)}</div>
        </div>
        <span class="flecha">→</span>
        <div class="pata">
          <div class="lbl">Entra en</div>
          <select data-destinoc="${f.i}">${opciones(dst)}</select>
          ${cambio
            ? `<input type="number" step="0.01" min="0" data-mdest="${f.i}" placeholder="Monto que entra en ${esc(monDst)}" value="${f.montoDestino != null ? esc(f.montoDestino) : ""}">`
            : `<div class="mto entra">+ ${fmt(f.monto, monDst || monOrg)}</div>`}
        </div>
      </div>
      <div class="pie ${falta ? "vacio" : ""}">${esc(pie)}${desdeDos}</div>
    </div>`;
  }

  function vistaInternos(){
    const ints = est.filas.filter(f => f.tipo === "Interno" && !absorbida(f));
    const ayuda = `<p class="hint" style="margin:0 0 9px">Un interno mueve plata entre cuentas tuyas: no es ingreso ni gasto. Una compra o venta de dólares (MEP) también es un interno — el tipo de cambio implícito es cuántos pesos por dólar te quedó.</p>`;
    return `<div class="intWrap">${ayuda}${ints.length
      ? `<div class="intList">${ints.map(tarjetaInterno).join("")}</div>`
      : `<p class="intVacio">Todavía no hay internos. Marcá dos líneas con ⇄ en las solapas de cuenta para unirlas, o pasá una fila a «Interno».</p>`}</div>`;
  }

  /** Cantidad de columnas de la tabla según el modo. */
  const colsTabla = () => est.modo === "cuenta" ? 11 : 9;

  /** Una fila de la previsualización, con sus dos fechas editables. */
  function filaPreview(f){
    const esInterno = f.tipo === "Interno";
    const cats = catsPara(f.tipo);
    const opts = `<option value="">Sin categoría</option>` + cats.map(c =>
      `<option value="${esc(c.id)}" ${f.categoria === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("");

    const chips = [];
    if(f.esImpuesto) chips.push(`<span class="tag">impuesto</span>`);
    else if(esInterno) chips.push(`<span class="tag">${f.sugerido ? "interno sugerido" : "interno"}</span>`);
    else if(f.esPago || f.tipo === "Ingreso") chips.push(`<span class="tag ok">${f.esPago ? "pago" : "ingreso"}</span>`);

    // En modo cuenta se puede corregir a qué cuenta va la fila
    const celdaCuenta = est.modo === "cuenta" ? `
      <td><select data-grupo="${f.i}">
        ${est.detectadas.map(d => `<option value="${esc(d.clave)}" ${f.grupo === d.clave ? "selected" : ""}>${esc(d.nombre)}</option>`).join("")}
      </select></td>` : "";

    // Los internos no llevan categoría: se editan con el bloque de abajo
    const celdaCat = esInterno
      ? `<td style="color:var(--faint)">${esc(nombreCuenta(destinoDeFila(f)) === "cuenta borrada" ? "—" : "→ " + nombreCuenta(destinoDeFila(f)))}</td>`
      : `<td><select data-cat="${f.i}" class="${f.categoria ? "" : "sinCat"}">${opts}</select></td>`;

    const errorInterno = faltaInterno(f);

    /* Marcar dos patas de una MEP para unirlas (sólo en el resumen de cuenta) */
    const celdaUnir = est.modo === "cuenta" ? `
      <td style="text-align:center">${esInterno ? "" : `<button class="btnUnir ${f.unir ? "on" : ""}" data-unir="${f.i}" title="Marcar esta línea como una de las dos patas de una compra/venta de dólares (MEP)">⇄</button>`}</td>` : "";

    return `
    <tr data-row="${f.i}" class="${f.dup ? "dup" : ""}${errorInterno ? " conError" : ""}${f.unir ? " unirSel" : ""}">
      <td><input type="checkbox" data-sel="${f.i}" ${f.sel ? "checked" : ""} ${f.dup ? "disabled" : ""}></td>
      <td><input type="date" data-fecha="${f.i}" value="${esc(f.fecha)}"></td>
      <td><input type="date" data-fres="${f.i}" value="${esc(f.fechaResumen || f.fecha)}"></td>
      <td class="flex">${esc(f.concepto)} ${chips.join(" ")}<span data-dup="${f.i}">${f.dup ? `<span class="tag off">ya está</span>` : ""}</span></td>
      ${celdaCuenta}
      <td><select data-tipo="${f.i}">
        ${TIPOS_MOV.map(t => `<option value="${t}" ${f.tipo === t ? "selected" : ""}>${t}</option>`).join("")}
      </select></td>
      <td class="num ${f.tipo === "Ingreso" ? "pos" : esInterno ? "" : "neg"}">${f.tipo === "Ingreso" ? "+" : esInterno ? "" : "−"}${fmt(f.monto, f.moneda)}</td>
      <td><span class="tag ${f.moneda === "USD" ? "usd" : ""}">${f.moneda}</span></td>
      ${celdaCat}
      <td style="text-align:center">${esInterno ? "" : `<input type="checkbox" data-regla="${f.i}" title="Crear una regla a partir de este movimiento" ${f.nuevaRegla ? "checked" : ""}>`}</td>
      ${celdaUnir}
    </tr>`;
  }

  /** Editor inline de la regla de una fila (se despliega debajo de ella). */
  function editorRegla(f){
    const r = f.nuevaRegla;
    const alcance = alcanceRegla(r).length;
    return `
    <tr class="reglaEd" data-reglaed="${f.i}">
      <td></td>
      <td colspan="${colsTabla() - 1}">
        <div class="reglaform">
          <label>El concepto
            <select data-rmatch="${f.i}">
              ${TIPOS_PATRON.map(t => `<option value="${t.v}" ${r.tipoPatron === t.v ? "selected" : ""}>${t.l}</option>`).join("")}
            </select>
          </label>
          <label>Patrón
            <input type="text" data-rpatron="${f.i}" value="${esc(r.patron)}" placeholder="netflix" autocomplete="off">
          </label>
          <label>Categoría
            <select data-rcat="${f.i}">
              <option value="">— ninguna —</option>
              ${state.categorias.map(c => `<option value="${esc(c.id)}" ${r.categoria === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}
            </select>
          </label>
          <label>Forzar tipo
            <select data-rtipo="${f.i}">
              <option value="">— no —</option>
              ${TIPOS_MOV.map(t => `<option value="${t}" ${r.tipo === t ? "selected" : ""}>${t}</option>`).join("")}
            </select>
          </label>
          <label>Prioridad
            <input type="number" step="1" style="width:70px" data-rprio="${f.i}" value="${esc(r.prioridad)}">
          </label>
          <span class="rinfo ${r.patron.trim() ? "" : "vacio"}" data-rinfo="${f.i}">${textoAlcance(r, alcance)}</span>
        </div>
      </td>
    </tr>`;
  }

  function textoAlcance(r, n){
    if(!String(r.patron || "").trim()) return "Sin patrón no se crea la regla";
    return n === 1 ? "Matchea 1 línea de este resumen" : `Matchea ${n} líneas de este resumen`;
  }

  const cuentaImportar = () => est.filas.filter(f => f.sel && !f.dup && !absorbida(f)).length;
  const reglasAcrear   = () => est.filas.filter(f => f.nuevaRegla && String(f.nuevaRegla.patron || "").trim()).length;
  function textoPie(){
    const n = cuentaImportar(), r = reglasAcrear();
    const total  = est.filas.filter(f => !absorbida(f)).length;
    const dups   = est.filas.filter(f => f.dup && !absorbida(f)).length;
    const unidas = est.filas.filter(f => absorbida(f)).length;
    return `${n} de ${total} para importar` +
      (dups ? ` · ${dups} ya estaban cargadas` : "") +
      (unidas ? ` · ${unidas} ${unidas === 1 ? "línea unida a un interno" : "líneas unidas a internos"}` : "") +
      (r ? ` · ${r} ${r === 1 ? "regla nueva" : "reglas nuevas"}` : "") + ".";
  }
  function textoBoton(){
    const n = cuentaImportar();
    return `Importar ${n} movimiento${n === 1 ? "" : "s"}`;
  }

  /* ── Vista del resumen de cuenta: mapeo + solapas ── */
  const GRUPO_INTERNOS = "__internos";
  const grupoDeFila = f => f.tipo === "Interno" ? GRUPO_INTERNOS : f.grupo;

  function solapas(){
    const grupos = est.detectadas.map(d => ({
      clave: d.clave, nombre: d.nombre,
      n: est.filas.filter(f => grupoDeFila(f) === d.clave && !absorbida(f)).length
    })).filter(g => g.n);
    const internos = est.filas.filter(f => f.tipo === "Interno" && !absorbida(f)).length;
    if(internos) grupos.push({ clave: GRUPO_INTERNOS, nombre: "Internos / transferencias", n: internos });
    if(!grupos.some(g => g.clave === est.solapa)) est.solapa = (grupos[0] || {}).clave || "";
    return grupos;
  }

  function vistaCuenta(){
    const gs = solapas();
    const t  = est.banco.totales || {};
    const conc = Object.entries(t).map(([mon, v]) =>
      `<span class="${v.coincide ? "ok" : "mal"}">${mon === "USD" ? "U$S" : "$"} ${v.coincide ? "✓" : "✗"}</span> ${fmt(v.calculado, mon)}${
        v.resumen == null ? "" : ` vs ${fmt(v.resumen, mon)}`}`).join(" · ");

    /* Se mapea toda cuenta que aparezca: como origen de movimientos o como
       destino de un interno (una tarjeta puede recibir un pago sin tener
       consumos propios en este resumen). */
    const usadas = new Set();
    est.filas.forEach(f => { usadas.add(f.grupo); if(f.destinoGrupo) usadas.add(f.destinoGrupo); });
    const aMapear   = est.detectadas.filter(d => usadas.has(d.clave));
    const sinMapear = aMapear.filter(d => !d.cuentaApp).length;

    /* El mapeo es un paso que se hace una vez: arranca abierto mientras falte
       asignar algo y se colapsa solo apenas está completo, para que el centro
       de la pantalla sea la tabla de movimientos. */
    if(est.mapeoFalta !== sinMapear){
      est.mapeoAbierto = sinMapear > 0;
      est.mapeoFalta   = sinMapear;
    }

    const mapeo = aMapear.map(d => {
      const cand = cuentasActivas().filter(c => c.moneda === d.moneda);
      const n = est.filas.filter(f => f.grupo === d.clave).length;
      return `
      <div class="item">
        <span style="width:18px;text-align:center;flex-shrink:0">${d.clase === "tarjeta" ? "💳" : "🏦"}</span>
        <span class="nm">${esc(d.nombre)} <span class="tag">${d.moneda}</span> <span class="tag">${n} mov.</span></span>
        <select data-mapa="${esc(d.clave)}">
          <option value="">— elegir cuenta —</option>
          ${cand.map(c => `<option value="${esc(c.id)}" ${d.cuentaApp === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}
        </select>
        ${d.cuentaApp ? "" : `<button class="btn ghost xs" data-crear="${esc(d.clave)}">Crear</button>`}
      </div>`;
    }).join("");

    const cabMapeo = sinMapear
      ? `Cuentas detectadas · <span class="falta">Falta asignar ${sinMapear} ${sinMapear === 1 ? "cuenta" : "cuentas"}</span>`
      : `Cuentas detectadas · <span class="listo">${aMapear.length} asignadas ✓</span>`;

    const esInternos = est.solapa === GRUPO_INTERNOS;
    const filasHtml = est.filas
      .filter(f => grupoDeFila(f) === est.solapa && !absorbida(f))
      .map(f => filaPreview(f) + (f.nuevaRegla ? editorRegla(f) : "")).join("");

    const cuerpo = esInternos ? vistaInternos() : `
      <div class="tblwrap">
        <table class="tbl">
          <thead><tr>
            <th><input type="checkbox" id="selTodos"></th>
            <th>Fecha consumo</th><th>Fecha resumen</th><th class="flex">Concepto</th><th>Cuenta</th><th>Tipo</th>
            <th style="text-align:right">Monto</th><th>Moneda</th><th>Categoría / destino</th><th>Regla</th><th title="Unir dos líneas como una compra/venta de dólares">Unir</th>
          </tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>`;

    return `
      <div class="impHead">
      <button class="close" id="mClose">×</button>
      <h3>Resumen de cuenta Santander</h3>
      <p class="impLinea"><span>${esc(est.archivo)} · ${est.detectadas.length} cuentas · ${est.filas.length} movimientos${
        est.tarjetas.length ? ` · ${est.tarjetas.length} ${est.tarjetas.length === 1 ? "tarjeta embebida" : "tarjetas embebidas"}` : ""}</span>${
        conc ? `<span>Saldos: ${conc}</span>` : ""}</p>

      <div class="mapBox ${est.mapeoAbierto ? "abierto" : ""}">
        <button type="button" class="cab" id="mapToggle">${cabMapeo}<span class="chev">▸</span></button>
        ${est.mapeoAbierto ? `<div class="mapeo">${mapeo}</div>` : ""}
      </div>

      ${barraUnir()}

      <div class="impSolapas">
        ${gs.map(g => `<button class="pill ${est.solapa === g.clave ? "on" : ""}" data-solapa="${esc(g.clave)}">${esc(g.nombre)} · ${g.n}</button>`).join("")}
      </div>
      </div>

      <div class="impTabla">${cuerpo}</div>

      <div class="impPie">
        <p class="hint" style="margin:0" id="impPie">${textoPie()}</p>
        ${sinMapear ? `<p class="hint" style="color:var(--danger);margin:4px 0 0">Falta asignar ${sinMapear} ${sinMapear === 1 ? "cuenta" : "cuentas"} antes de importar.</p>` : ""}
        <div class="btn-row">
          <button class="btn primary block" id="btnImportar" ${cuentaImportar() && !sinMapear ? "" : "disabled"}>${textoBoton()}</button>
        </div>
      </div>`;
  }

  function vistaPreview(){
    if(est.modo === "cuenta") return vistaCuenta();
    const { meta } = est.datos;
    const hayUsd = est.filas.some(f => f.moneda === "USD");
    const dups   = est.filas.filter(f => f.dup).length;
    const aImportar = cuentaImportar();

    /* Conciliación informativa: sirve para ver si quedó alguna línea afuera.
       Si el resumen trae el subtotal de consumos, se compara contra eso (es lo
       exacto); si no, contra el total a pagar. */
    const suma = (mon, filtro) => est.datos.lineas
      .filter(l => l.moneda === mon && filtro(l)).reduce((a,l) => a + l.importe, 0);
    const consumosArs = suma("ARS", l => l.importe > 0 && !l.impuesto);
    const consumosUsd = suma("USD", l => l.importe > 0 && !l.impuesto);
    const impuestosArs = suma("ARS", l => l.importe > 0 && l.impuesto);
    const pagosArs = suma("ARS", l => l.importe < 0);
    const pagosUsd = suma("USD", l => l.importe < 0);

    const cerca = (a, b, tol) => b != null && Math.abs(a - b) < tol;
    const contraSubtotal = meta.subtotalPesos != null || meta.subtotalUsd != null;
    const refArs = contraSubtotal ? meta.subtotalPesos : meta.totalPesos;
    const refUsd = contraSubtotal ? meta.subtotalUsd  : meta.totalUsd;
    const propioArs = contraSubtotal ? consumosArs : consumosArs + impuestosArs;
    const propioUsd = consumosUsd;
    const concilia =
      (refArs == null || cerca(propioArs, refArs, 1) || cerca(propioArs + pagosArs, refArs, 1)) &&
      (refUsd == null || cerca(propioUsd, refUsd, 0.05) || cerca(propioUsd + pagosUsd, refUsd, 0.05));

    const conRef = refArs != null || refUsd != null;
    const nombreRef = contraSubtotal ? "el subtotal de consumos" : "el total del resumen";
    const detalleConcil =
      `Consumos ${fmt(consumosArs, "ARS")}${consumosUsd ? " / " + fmt(consumosUsd, "USD") : ""}` +
      (impuestosArs ? ` · impuestos ${fmt(impuestosArs, "ARS")}` : "") +
      ((pagosArs || pagosUsd) ? ` · pagos ${fmt(pagosArs, "ARS")}${pagosUsd ? " / " + fmt(pagosUsd, "USD") : ""}` : "");

    const filasHtml = est.filas.map(f => filaPreview(f) + (f.tipo === "Interno" ? editorInterno(f) : "") + (f.nuevaRegla ? editorRegla(f) : "")).join("");

    return `
      <div class="impHead scroll">
      <button class="close" id="mClose">×</button>
      <h3>${esc(est.datos.emisor)}${est.datos.numero ? " ·· " + esc(est.datos.numero) : ""}</h3>
      <p class="hint">${esc(est.archivo)} · ${est.datos.lineas.length} líneas detectadas</p>

      <div class="resumen-meta">
        ${meta.totalPesos != null ? `<span class="m">Total a pagar<b>${fmt(meta.totalPesos, "ARS")}</b></span>` : ""}
        ${meta.totalUsd ? `<span class="m">En dólares<b>${fmt(meta.totalUsd, "USD")}</b></span>` : ""}
        ${meta.cierreIso ? `<span class="m">Cierre<b>${dispDate(meta.cierreIso)}</b></span>` : ""}
        ${meta.vencIso ? `<span class="m">Vencimiento<b>${dispDate(meta.vencIso)}</b></span>` : ""}
      </div>
      ${conRef ? `<p class="hint" style="margin:2px 0 10px">${concilia
        ? `✓ Lo detectado coincide con ${nombreRef}. ${detalleConcil}.`
        : `${detalleConcil}. No coincide con ${nombreRef} (${fmt(refArs || 0, "ARS")}${refUsd ? " / " + fmt(refUsd, "USD") : ""}): puede haber quedado alguna línea afuera.`}</p>` : ""}

      <div class="row2">
        <div>
          <label class="f" for="impCuentaArs">Cuenta de la tarjeta (pesos)</label>
          <select class="f" id="impCuentaArs">${optCuentasTarjeta("ARS", est.cuentaArs)}</select>
        </div>
        <div>
          <label class="f" for="impFechaResumen">Fecha de resumen (cierre)</label>
          <input class="f" id="impFechaResumen" type="date" value="${esc(est.fechaResumen || "")}">
          <p class="hint" style="margin:6px 0 0">Se aplica a todas las líneas; después se puede corregir una por una. Período <b>${esc(est.periodo || "—")}</b>${meta.vencIso ? ` · vence ${dispDate(meta.vencIso)}` : ""}.</p>
        </div>
      </div>
      ${hayUsd ? `
      <label class="f" for="impCuentaUsd">Cuenta de la tarjeta (dólares)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="f" id="impCuentaUsd">${optCuentasTarjeta("USD", est.cuentaUsd)}</select>
        ${!est.cuentaUsd ? `<button class="btn ghost sm" id="btnCrearUsd" style="flex-shrink:0;white-space:nowrap">Crear cuenta USD</button>` : ""}
      </div>` : ""}
      </div>

      <div class="impTabla">
      <div class="tblwrap">
        <table class="tbl">
          <thead><tr>
            <th><input type="checkbox" id="selTodos" ${aImportar && aImportar === est.filas.filter(f => !f.dup).length ? "checked" : ""}></th>
            <th>Fecha consumo</th><th>Fecha resumen</th><th class="flex">Concepto</th><th>Tipo</th>
            <th style="text-align:right">Monto</th><th>Moneda</th><th>Categoría</th><th>Regla</th>
          </tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>

      </div>

      <div class="impPie">
        <p class="hint" style="margin:0" id="impPie">${textoPie()}</p>
        <div class="btn-row">
          <button class="btn primary block" id="btnImportar" ${aImportar ? "" : "disabled"}>${textoBoton()}</button>
        </div>
      </div>`;
  }

  /* Las filas se actualizan en el DOM sin repintar todo el modal: si repintáramos,
     un input de fecha o de patrón perdería el foco a mitad de la edición. */
  function refrescarPie(){
    const pie = $("#impPie"); if(pie) pie.textContent = textoPie();
    const btn = $("#btnImportar");
    if(!btn) return;
    btn.textContent = textoBoton();
    // Con el resumen de cuenta no se puede importar hasta mapear todas las cuentas
    const usadas = new Set();
    est.filas.forEach(f => { usadas.add(f.grupo); if(f.destinoGrupo) usadas.add(f.destinoGrupo); });
    const sinMapear = est.modo === "cuenta"
      ? est.detectadas.filter(d => !d.cuentaApp && usadas.has(d.clave)).length : 0;
    btn.disabled = !cuentaImportar() || !!sinMapear;
  }
  function refrescarFila(i){
    const f = est.filas[i];
    const tr = $(`tr[data-row="${i}"]`) || $(`.intCard[data-int="${i}"]`);
    if(!tr) return;
    tr.classList.toggle("dup", !!f.dup);
    const chk = $(`[data-sel="${i}"]`);
    if(chk){ chk.checked = !!f.sel; chk.disabled = !!f.dup; }
    const marca = $(`[data-dup="${i}"]`);
    if(marca) marca.innerHTML = f.dup ? `<span class="tag off">ya está</span>` : "";
  }
  /** Resalta las filas que matchearían los patrones que se están editando. */
  function refrescarResaltado(){
    const alcanzadas = new Set();
    est.filas.forEach(f => { if(f.nuevaRegla) alcanceRegla(f.nuevaRegla).forEach(i => alcanzadas.add(i)); });
    est.filas.forEach(f => {
      const tr = $(`tr[data-row="${f.i}"]`);
      if(tr) tr.classList.toggle("matchea", alcanzadas.has(f.i));
    });
  }
  function refrescarInfoRegla(i){
    const f = est.filas[i], info = $(`[data-rinfo="${i}"]`);
    if(!f.nuevaRegla || !info) return;
    info.textContent = textoAlcance(f.nuevaRegla, alcanceRegla(f.nuevaRegla).length);
    info.classList.toggle("vacio", !String(f.nuevaRegla.patron || "").trim());
  }

  function bindPreview(){
    $("#mClose").onclick = intentarCerrar;

    if(est.modo === "cuenta"){
      $$("[data-mapa]").forEach(sel => sel.onchange = () => {
        const d = grupoPorClave(sel.dataset.mapa);
        if(d) d.cuentaApp = sel.value;
        revisarDuplicados();
        pintar();
      });
      $$("[data-crear]").forEach(b => b.onclick = ev => crearCuentaDetectada(b.dataset.crear, ev.currentTarget));
      $$("[data-solapa]").forEach(b => b.onclick = () => { est.solapa = b.dataset.solapa; pintar(); });
      $("#mapToggle").onclick = () => { est.mapeoAbierto = !est.mapeoAbierto; pintar(); };
      $$("[data-unir]").forEach(b => b.onclick = () => {
        const f = est.filas[+b.dataset.unir];
        f.unir = !f.unir;
        pintar();
      });
      const btnUnir = $("#btnUnirMep");
      if(btnUnir) btnUnir.onclick = unirComoInterno;
      const btnLimpiar = $("#btnLimpiarUnir");
      if(btnLimpiar) btnLimpiar.onclick = limpiarUnir;
      $$("[data-desunir]").forEach(b => b.onclick = () => {
        const f = est.filas[+b.dataset.desunir];
        cambiarTipoFila(f.i, f.tipoBase || "Egreso");
      });
      $$("[data-grupo]").forEach(sel => sel.onchange = () => {
        const f = est.filas[+sel.dataset.grupo];
        f.grupo = sel.value;
        revisarDuplicados();
        pintar();
      });
    }else{
      $("#impCuentaArs").onchange = e => { est.cuentaArs = e.target.value; revisarDuplicados(); pintar(); };
      const selUsd = $("#impCuentaUsd");
      if(selUsd) selUsd.onchange = e => { est.cuentaUsd = e.target.value; revisarDuplicados(); pintar(); };

      // Atajo: la fecha de cierre se aplica a todas las líneas de una
      $("#impFechaResumen").onchange = e => {
        est.fechaResumen = e.target.value;
        est.periodo = periodoDesdeCierre(est.fechaResumen) || est.periodo;
        est.filas.forEach(f => { f.fechaResumen = est.fechaResumen || f.fecha; });
        pintar();
      };

      const btnUsd = $("#btnCrearUsd");
      if(btnUsd) btnUsd.onclick = ev => crearCuentaUsd(ev.currentTarget);
    }

    // En la solapa de internos no hay tabla: el "todos" es de la tabla nomás
    const todos = $("#selTodos");
    if(todos) todos.onchange = e => {
      est.filas.forEach(f => { if(!f.dup && !absorbida(f)) f.sel = e.target.checked; });
      est.filas.forEach(f => refrescarFila(f.i));
      refrescarPie();
    };
    $$("[data-sel]").forEach(ch => ch.onchange = () => {
      est.filas[+ch.dataset.sel].sel = ch.checked;
      refrescarPie();
    });

    // Fechas por fila: la de consumo entra en el hash, así que hay que revisar duplicados
    $$("[data-fecha]").forEach(inp => inp.onchange = () => {
      const i = +inp.dataset.fecha, f = est.filas[i];
      f.fecha = inp.value || f.fecha;
      inp.value = f.fecha;
      revisarDuplicados();
      est.filas.forEach(x => refrescarFila(x.i));
      refrescarPie();
    });
    $$("[data-fres]").forEach(inp => inp.onchange = () => {
      const f = est.filas[+inp.dataset.fres];
      f.fechaResumen = inp.value || f.fecha;
      inp.value = f.fechaResumen;
    });

    // Tipo por fila: pasar a Interno abre el editor de origen/destino
    $$("[data-tipo]").forEach(sel => sel.onchange = () => cambiarTipoFila(+sel.dataset.tipo, sel.value));
    $$("[data-origen]").forEach(sel => sel.onchange = () => {
      const f = est.filas[+sel.dataset.origen];
      f.origenId = sel.value; f.origenManual = true;
      revisarDuplicados(); pintar();
    });
    $$("[data-destinoc]").forEach(sel => sel.onchange = () => {
      const f = est.filas[+sel.dataset.destinoc];
      f.destinoId = sel.value; f.destinoManual = true;
      pintar();
    });
    $$("[data-mdest]").forEach(inp => inp.onchange = () => {
      const f = est.filas[+inp.dataset.mdest];
      f.montoDestino = parseFloat(inp.value) || null;
      pintar();
    });

    $$("[data-cat]").forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.cat, f = est.filas[i];
      f.categoria = sel.value;
      f.categoriaManual = true;
      sel.classList.toggle("sinCat", !sel.value);
      // Si la fila tiene el editor de regla abierto, seguimos la categoría elegida
      if(f.nuevaRegla){
        f.nuevaRegla.categoria = sel.value;
        const rcat = $(`[data-rcat="${i}"]`);
        if(rcat) rcat.value = sel.value;
      }
    });

    // Checkbox "Regla" por fila: despliega el editor inline debajo
    $$("[data-regla]").forEach(ch => ch.onchange = () => {
      const i = +ch.dataset.regla, f = est.filas[i];
      f.nuevaRegla = ch.checked ? reglaDesdeFila(f) : null;
      pintar();
      if(ch.checked){
        const inp = $(`[data-rpatron="${i}"]`);
        if(inp){ inp.focus(); inp.select(); }
      }
    });

    // Campos del editor de regla
    $$("[data-rpatron]").forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.rpatron;
      est.filas[i].nuevaRegla.patron = inp.value;
      refrescarInfoRegla(i);
      refrescarResaltado();
      refrescarPie();
    });
    $$("[data-rmatch]").forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.rmatch;
      est.filas[i].nuevaRegla.tipoPatron = sel.value;
      refrescarInfoRegla(i);
      refrescarResaltado();
    });
    $$("[data-rcat]").forEach(sel => sel.onchange = () => {
      est.filas[+sel.dataset.rcat].nuevaRegla.categoria = sel.value;
    });
    $$("[data-rtipo]").forEach(sel => sel.onchange = () => {
      est.filas[+sel.dataset.rtipo].nuevaRegla.tipo = sel.value;
    });
    $$("[data-rprio]").forEach(inp => inp.onchange = () => {
      est.filas[+inp.dataset.rprio].nuevaRegla.prioridad = parseInt(inp.value, 10) || 0;
    });

    refrescarResaltado();
    $("#btnImportar").onclick = ev => confirmar(ev.currentTarget);
  }

  /** Crea en la app una de las cuentas detectadas en el resumen. */
  async function crearCuentaDetectada(clave, btn){
    const d = grupoPorClave(clave);
    if(!d) return;
    const cuenta = {
      id: uid(),
      nombre: d.nombre,
      tipo: d.clase === "tarjeta" ? "tarjeta" : "banco",
      moneda: d.moneda,
      saldoInicial: d.clase === "banco" ? (+d.saldoInicial || 0) : 0,
      fechaInicial: est.filas.filter(f => f.grupo === clave).map(f => f.fecha).sort()[0] || todayIso(),
      enPatrimonio: d.clase !== "tarjeta",
      orden: 0, activo: true
    };
    const prev = btn.textContent;
    btn.disabled = true; btn.textContent = "Creando…";
    try{
      await api({action:"saveCuenta", cuenta});
      state.cuentas.push(cuenta);
      state.cuentas = ordenarCuentas(state.cuentas);
      d.cuentaApp = cuenta.id;
      revisarDuplicados();
      pintar();
      toast(`Cuenta "${cuenta.nombre}" creada`);
    }catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = prev;
    }
  }

  async function crearCuentaUsd(btn){
    const nombre = `${est.datos.emisor}${est.datos.numero ? " " + est.datos.numero : ""} USD`;
    const cuenta = {
      id: uid(), nombre, tipo:"tarjeta", moneda:"USD",
      saldoInicial: 0, fechaInicial: todayIso(),
      enPatrimonio: false, orden: 0, activo: true
    };
    const prev = btn.textContent;
    btn.disabled = true; btn.textContent = "Creando…";
    try{
      await api({action:"saveCuenta", cuenta});
      state.cuentas.push(cuenta);
      state.cuentas = ordenarCuentas(state.cuentas);
      est.cuentaUsd = cuenta.id;
      revisarDuplicados();
      pintar();
      toast(`Cuenta "${nombre}" creada`);
    }catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = prev;
    }
  }

  async function confirmar(btn){
    const sel = est.filas.filter(f => f.sel && !f.dup && !absorbida(f));
    if(!sel.length){ toast("No hay filas para importar"); return; }
    if(sel.some(f => !f.cuenta)){
      toast(est.modo === "cuenta" ? "Falta asignar alguna cuenta detectada"
        : sel.some(f => f.moneda === "USD" && !f.cuenta) ? "Falta elegir la cuenta en dólares" : "Falta elegir la cuenta de la tarjeta");
      return;
    }
    const internoIncompleto = sel.find(f => faltaInterno(f));
    if(internoIncompleto){
      toast(`${faltaInterno(internoIncompleto)} en «${internoIncompleto.concepto.slice(0, 30)}»`);
      return;
    }

    btn.disabled = true; btn.textContent = "Guardando…";
    try{
      const meta = est.datos.meta || {};
      const obsTarjeta = `Resumen ${est.periodo}` + (meta.vencIso ? ` · vence ${dispDate(meta.vencIso)}` : "");
      const modoCredito = (state.modosPago.find(m => /cr[eé]dito/i.test(m.nombre)) || {}).nombre || "";

      // Cotizaciones: una consulta por fecha distinta, todas en paralelo
      const cots = {};
      await Promise.all([...new Set(sel.map(f => f.fecha))].map(async fecha => {
        cots[fecha] = (await mepDe(fecha)) || rate();
      }));

      const movimientos = [];
      for(const f of sel){
        const cot = cots[f.fecha];
        const esInterno = f.tipo === "Interno";
        const origen  = esInterno ? origenDeFila(f) : f.cuenta;
        const destino = esInterno ? destinoDeFila(f) : "";
        movimientos.push({
          id: uid(), mes: mesDe(f.fecha), fecha: f.fecha, tipo: f.tipo,
          categoria: esInterno ? "" : f.categoria, concepto: f.concepto,
          cuenta: origen, cuentaDestino: destino,
          moneda: esInterno ? monedaCuenta(origen) : f.moneda, monto: f.monto,
          monedaDestino: esInterno ? monedaCuenta(destino) : "",
          montoDestino: esInterno ? montoDestinoDe(f) : null,
          cotizacion: cot || null,
          modoPago: (est.modo === "cuenta" ? (f.origen === "tarjeta" ? modoCredito : "") : modoCredito),
          observacion: est.modo === "cuenta" ? (f.observacion || "") : obsTarjeta,
          fechaResumen: f.fechaResumen || f.fecha,   // el cierre del resumen que lo factura
          timestamp: "", hash: f.hash, fuente: "import"
        });
      }

      const res = await api({action:"saveMovimientos", movimientos});

      // Reflejamos localmente lo que el backend efectivamente guardó
      const yaEstaban = new Set(state.movimientos.map(m => m.hash || calcHash(m)));
      const importados = [];
      movimientos.forEach(m => {
        if(!yaEstaban.has(m.hash)){
          yaEstaban.add(m.hash);
          const guardado = {...m, timestamp: ahoraLocal()};
          state.movimientos.push(guardado);
          importados.push(guardado);
        }
      });
      state.movimientos = ordenarMovs(state.movimientos);
      if(movimientos.length) state.mes = mesLente(movimientos[0]);

      const nuevasReglas = await actualizarReglas(sel);
      // Con las reglas recién creadas, categorizamos lo que entró sin categoría
      const recategorizados = nuevasReglas
        ? await aplicarReglasA(importados.filter(m => !m.categoria))
        : 0;

      cerrar();
      render();
      toast(`Importados ${res.guardados}` +
        (res.omitidos ? ` · ${res.omitidos} ya estaban` : "") +
        (nuevasReglas ? ` · ${nuevasReglas} ${nuevasReglas === 1 ? "regla creada" : "reglas creadas"}` : "") +
        (recategorizados ? ` · ${recategorizados} categorizados por las reglas` : ""));
    }catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = "Reintentar importación";
    }
  }

  /** Suma hits a las reglas que se aplicaron y crea las nuevas que pidió el usuario. */
  /**
   * Suma hits a las reglas que se aplicaron y crea las que el usuario pidió con
   * el checkbox "Regla" de cada fila. Devuelve cuántas reglas nuevas se crearon.
   */
  async function actualizarReglas(filas){
    const cambios = [];

    const hits = {};
    filas.forEach(f => { if(f.reglaId && !f.categoriaManual) hits[f.reglaId] = (hits[f.reglaId] || 0) + 1; });
    Object.keys(hits).forEach(id => {
      const r = state.reglas.find(x => x.id === id);
      if(r) cambios.push({...r, hits:(+r.hits || 0) + hits[id]});
    });

    // Una regla por cada fila con el checkbox activo y patrón cargado
    const nuevas = [];
    const vistos = new Set();
    for(const f of est.filas){
      const r = f.nuevaRegla;
      if(!r) continue;
      const patron = String(r.patron || "").trim();
      if(!patron || (!r.categoria && !r.tipo)) continue;
      const clave = patron.toLowerCase() + "|" + r.categoria + "|" + r.tipoPatron;
      if(vistos.has(clave)) continue;
      vistos.add(clave);
      if(state.reglas.some(x => x.patron.toLowerCase() === patron.toLowerCase() &&
                                x.categoria === r.categoria && x.tipoPatron === r.tipoPatron)) continue;
      nuevas.push({
        id: uid(), patron, tipoPatron: r.tipoPatron || "contiene",
        categoria: r.categoria || "", tipo: r.tipo || "",
        prioridad: +r.prioridad || 10, hits: 0, activo: true
      });
    }
    cambios.push(...nuevas);

    if(!cambios.length) return 0;
    try{
      const d = await api({action:"saveReglas", reglas:cambios});
      state.reglas = (d.reglas || []).filter(r => r.activo !== false);
      return nuevas.length;
    }catch(e){
      // Las reglas son secundarias: si fallan, la importación ya quedó guardada
      toast("Los movimientos se importaron, pero no pude guardar las reglas: " + e.message);
      return 0;
    }
  }

  function pintar(){
    const body = $("#impBody");
    body.className = "modal wide" + (est.datos ? " imp" : "");   // el preview usa el modal grande
    body.innerHTML = est.datos ? vistaPreview() : vistaArchivo();
    if(est.datos) bindPreview(); else bindArchivo();
  }
  pintar();
}

/* ══════════════════════ MOVIMIENTOS ══════════════════════ */
function movsVisibles(){
  const f = state.filtros;
  const txt = f.texto.trim().toLowerCase();
  return state.movimientos.filter(m => {
    if(mesLente(m) !== state.mes) return false;
    if(f.tipo !== "todos" && m.tipo !== f.tipo) return false;
    if(f.cuenta && m.cuenta !== f.cuenta && m.cuentaDestino !== f.cuenta) return false;
    if(f.categoria && m.categoria !== f.categoria) return false;
    if(txt && !((m.concepto || "") + " " + (m.observacion || "")).toLowerCase().includes(txt)) return false;
    return true;
  });
}

function filaMov(m){
  const cat  = catPorId(m.categoria);
  const color = m.tipo === "Interno" ? "#94a3b8" : (cat ? cat.color : COLOR_DEFAULT);
  const tags = [];
  if(m.tipo !== "Interno") tags.push(`<span class="tag">${esc(cat ? cat.nombre : "Sin categoría")}</span>`);
  tags.push(`<span class="tag">${esc(m.tipo === "Interno" ? nombreCuenta(m.cuenta) + " → " + nombreCuenta(m.cuentaDestino) : nombreCuenta(m.cuenta))}</span>`);
  if(m.modoPago) tags.push(`<span class="tag">${esc(m.modoPago)}</span>`);
  // Si las dos fechas difieren, mostramos la que NO se está usando para agrupar
  if(m.fechaResumen && isoDate(m.fechaResumen) !== isoDate(m.fecha)){
    tags.push(`<span class="tag">${state.lente === "consumo" ? "resumen " + dispDate(m.fechaResumen) : "consumo " + dispDate(m.fecha)}</span>`);
  }

  let clase = "int", signo = "";
  if(m.tipo === "Ingreso"){ clase = "pos"; signo = "+"; }
  if(m.tipo === "Egreso"){  clase = "neg"; signo = "−"; }

  // Valuado con la cotización congelada del movimiento
  const vista = montoVista(m.monto, m.moneda, tcDe(m));
  let sub = vista.sub;
  if(m.tipo === "Interno" && state.cur === "ambas"){
    // En vista nativa mostramos lo que entra; convertido, ambos lados dan lo mismo.
    const cambio = m.monedaDestino && m.monedaDestino !== m.moneda;
    sub = "→ " + fmt(m.montoDestino || m.monto, m.monedaDestino || m.moneda) +
          (cambio ? " · TC " + nf(tcImplicito(m), 0) : "");
  }

  return `
  <button class="mov" data-mov="${esc(m.id)}"${vista.tit ? ` title="${esc(vista.tit)}"` : ""}>
    <span class="dot" style="background:${esc(color)}"></span>
    <span class="info">
      <span class="cpt">${esc(m.concepto || "(sin concepto)")}</span>
      <span class="meta">${tags.join("")}</span>
    </span>
    <span class="amt">
      <span class="n ${clase}">${signo}${vista.txt}</span>
      ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
    </span>
  </button>`;
}

/* Totales del mes (de lo que se está viendo). Los internos no suman: mueven
   plata entre cuentas propias. Se calculan en las dos monedas y el toggle elige. */
function totalesDe(movs){
  const ing = acum(), egr = acum();
  for(const m of movs){
    if(m.tipo === "Interno") continue;
    sumar(m.tipo === "Ingreso" ? ing : egr, m.monto, m.moneda, tcDe(m));
  }
  return {ing, egr};
}

/** Un total en la(s) moneda(s) del toggle. */
function totalVista(ars, usd){
  if(state.cur === "USD") return fmt(usd, "USD", 0);
  if(state.cur === "ARS") return fmt(ars, "ARS", 0);
  return fmt(ars, "ARS", 0) + `<span class="u">${fmt(usd, "USD", 0)}</span>`;
}

function bloqueTotales(movs){
  const t = totalesDe(movs);
  const netoArs = t.ing.ars - t.egr.ars, netoUsd = t.ing.usd - t.egr.usd;
  const signoNeto = (state.cur === "USD" ? netoUsd : netoArs) < 0 ? "neg" : "pos";
  const fuera = faltan(t.ing) + faltan(t.egr);
  return `
  <div class="tot">
    <div class="b"><div class="lbl">Ingresos</div><div class="v pos">${totalVista(t.ing.ars, t.ing.usd)}</div></div>
    <div class="b"><div class="lbl">Egresos</div><div class="v neg">${totalVista(t.egr.ars, t.egr.usd)}</div></div>
    <div class="b"><div class="lbl">Neto</div><div class="v ${signoNeto}">${totalVista(netoArs, netoUsd)}</div></div>
  </div>
  ${fuera ? `<p class="hint" style="margin:-4px 2px 10px">${fuera} ${fuera === 1 ? "movimiento quedó" : "movimientos quedaron"} fuera del total por no tener cotización.</p>` : ""}`;
}

/** ARS por 1 USD implícito en un interno con cambio de moneda. */
function tcImplicito(m){
  const a = +m.monto || 0, b = +m.montoDestino || 0;
  if(!a || !b) return 0;
  if(m.moneda === "USD" && m.monedaDestino === "ARS") return b / a;   // venta de dólares
  if(m.moneda === "ARS" && m.monedaDestino === "USD") return a / b;   // compra de dólares
  return 0;
}

/**
 * Corre las reglas sobre una lista de movimientos y guarda los que cambian.
 * Devuelve cuántos se categorizaron. `onProgreso` es opcional (para el botón).
 */
async function aplicarReglasA(movs, onProgreso){
  const cambios = [], hits = {};
  for(const m of movs){
    if(m.categoria || m.tipo === "Interno") continue;
    const r = aplicarReglas(m.concepto);
    if(!r || !r.categoria) continue;
    cambios.push({...m, categoria:r.categoria, tipo:r.tipo || m.tipo});
    hits[r.id] = (hits[r.id] || 0) + 1;
  }
  if(!cambios.length) return 0;

  let ok = 0;
  for(const mov of cambios){
    if(onProgreso) onProgreso(ok + 1, cambios.length);
    try{
      await api({action:"saveMovimiento", mov:{...mov, hash:""}});
      const i = state.movimientos.findIndex(x => x.id === mov.id);
      if(i >= 0) state.movimientos[i] = mov;
      ok++;
    }catch(e){ toast(e.message); break; }
  }

  const actualizadas = Object.keys(hits).map(id => {
    const r = state.reglas.find(x => x.id === id);
    return r ? {...r, hits:(+r.hits || 0) + hits[id]} : null;
  }).filter(Boolean);
  if(actualizadas.length){
    try{
      const d = await api({action:"saveReglas", reglas:actualizadas});
      state.reglas = (d.reglas || []).filter(r => r.activo !== false);
    }catch(e){ /* secundario */ }
  }
  return ok;
}

/** Botón "Aplicar reglas a los sin categoría" de la pantalla Movimientos. */
async function aplicarReglasPendientes(btn){
  const prev = btn.textContent;
  btn.disabled = true;
  const ok = await aplicarReglasA(
    state.movimientos.filter(m => !m.categoria && m.tipo !== "Interno"),
    (n, total) => { btn.textContent = `Aplicando… ${n}/${total}`; }
  );
  btn.disabled = false; btn.textContent = prev;
  if(!ok){ toast("Ninguna regla aplica a los movimientos sin categoría"); return; }
  render();
  toast(`${ok} ${ok === 1 ? "movimiento categorizado" : "movimientos categorizados"}`);
}
